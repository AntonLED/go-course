<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 284" role="img" aria-label="Слева монолит: модули orders, inventory, payments в одном процессе вызывают друг друга функциями и пишут в одну общую БД. Справа микросервисы: три отдельных процесса, у каждого своя БД, вызовы идут по сети; лезть в чужую БД напрямую нельзя" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Монолит и микросервисы</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- ===== Монолит ===== -->
  <text x="170" y="20" text-anchor="middle" font-weight="600">Монолит</text>
  <rect x="20" y="36" width="300" height="112" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="32" y="54" font-size="11" opacity="0.6">один процесс, один бинарник</text>

  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="32" y="76" width="76" height="36" rx="4"/>
    <rect x="132" y="76" width="76" height="36" rx="4"/>
    <rect x="232" y="76" width="76" height="36" rx="4"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="70" y="98">inventory</text><text x="170" y="98">orders</text><text x="270" y="98">payments</text>
  </g>
  <line x1="132" y1="94" x2="110" y2="94" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="208" y1="94" x2="230" y2="94" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="170" y="136" text-anchor="middle" font-size="11" opacity="0.7">вызов функции: наносекунды, не теряется</text>

  <!-- общая БД -->
  <line x1="170" y1="148" x2="170" y2="190" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="178" y="174" font-size="11" opacity="0.7">одна ACID-транзакция</text>
  <g fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.2">
    <path d="M125,198 a45,7 0 0 0 90,0 a45,7 0 0 0 -90,0 v34 a45,7 0 0 0 90,0 v-34"/>
  </g>
  <text x="170" y="226" text-anchor="middle" font-size="12">общая БД</text>
  <text x="170" y="258" text-anchor="middle" font-size="11" opacity="0.6">деплой и масштабирование — целиком</text>

  <!-- разделитель -->
  <line x1="340" y1="12" x2="340" y2="276" stroke="currentColor" stroke-width="1" opacity="0.25" stroke-dasharray="4 4"/>

  <!-- ===== Микросервисы ===== -->
  <text x="512" y="20" text-anchor="middle" font-weight="600">Микросервисы</text>

  <g fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2">
    <rect x="360" y="76" width="84" height="36" rx="4"/>
    <rect x="470" y="76" width="84" height="36" rx="4"/>
    <rect x="580" y="76" width="84" height="36" rx="4"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="402" y="98">inventory</text><text x="512" y="98">orders</text><text x="622" y="98">payments</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#0891b2">
    <text x="457" y="68">сеть</text><text x="567" y="68">сеть</text>
  </g>
  <line x1="470" y1="94" x2="446" y2="94" stroke="#0891b2" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-acc)"/>
  <line x1="554" y1="94" x2="578" y2="94" stroke="#0891b2" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-acc)"/>

  <!-- свои БД -->
  <g stroke="currentColor" stroke-width="1.4">
    <line x1="402" y1="112" x2="402" y2="190" marker-end="url(#arr)"/>
    <line x1="622" y1="112" x2="622" y2="190" marker-end="url(#arr)"/>
    <line x1="512" y1="112" x2="512" y2="190" marker-end="url(#arr)"/>
  </g>
  <g fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.2">
    <path d="M372,198 a30,6 0 0 0 60,0 a30,6 0 0 0 -60,0 v34 a30,6 0 0 0 60,0 v-34"/>
    <path d="M482,198 a30,6 0 0 0 60,0 a30,6 0 0 0 -60,0 v34 a30,6 0 0 0 60,0 v-34"/>
    <path d="M592,198 a30,6 0 0 0 60,0 a30,6 0 0 0 -60,0 v34 a30,6 0 0 0 60,0 v-34"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="402" y="226">БД</text><text x="512" y="226">БД</text><text x="622" y="226">БД</text>
  </g>
  <text x="512" y="258" text-anchor="middle" font-size="11" fill="#0891b2">вызов по сети: мс, может упасть или повториться</text>
  <text x="512" y="274" text-anchor="middle" font-size="11" opacity="0.6">своя БД и свой деплой у каждого</text>
</svg>
