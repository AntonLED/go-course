<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318" role="img" aria-label="ZigZag обходит числа 0, −1, 1, −2, 2, −3, 3 по очереди и нумерует их 0, 1, 2, 3, 4, 5, 6, так что маленькие по модулю отрицательные числа становятся маленькими беззнаковыми. Ниже: −1 в поле int32 кодируется 10 байтами значения, а в sint32 — одним байтом 01" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>ZigZag-кодирование</title>
  <text x="16" y="20" font-weight="600">ZigZag: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400">(n &lt;&lt; 1) ^ (n &gt;&gt; 31)</tspan></text>
  <text x="16" y="52" font-size="11" opacity="0.6">n</text>
  <line x1="114" y1="48" x2="546" y2="48" stroke="currentColor" stroke-width="1.2"/>
  <line x1="138" y1="44" x2="138" y2="52" stroke="currentColor" stroke-width="1.2"/>
  <text x="138" y="38" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">−3</text>
  <line x1="202" y1="44" x2="202" y2="52" stroke="currentColor" stroke-width="1.2"/>
  <text x="202" y="38" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">−2</text>
  <line x1="266" y1="44" x2="266" y2="52" stroke="currentColor" stroke-width="1.2"/>
  <text x="266" y="38" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">−1</text>
  <line x1="330" y1="44" x2="330" y2="52" stroke="currentColor" stroke-width="1.2"/>
  <text x="330" y="38" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0</text>
  <line x1="394" y1="44" x2="394" y2="52" stroke="currentColor" stroke-width="1.2"/>
  <text x="394" y="38" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">1</text>
  <line x1="458" y1="44" x2="458" y2="52" stroke="currentColor" stroke-width="1.2"/>
  <text x="458" y="38" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">2</text>
  <line x1="522" y1="44" x2="522" y2="52" stroke="currentColor" stroke-width="1.2"/>
  <text x="522" y="38" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">3</text>
  <line x1="330" y1="52" x2="330" y2="76" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-dasharray="2 3"/>
  <line x1="266" y1="52" x2="266" y2="92" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-dasharray="2 3"/>
  <line x1="394" y1="52" x2="394" y2="108" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-dasharray="2 3"/>
  <line x1="202" y1="52" x2="202" y2="124" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-dasharray="2 3"/>
  <line x1="458" y1="52" x2="458" y2="140" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-dasharray="2 3"/>
  <line x1="138" y1="52" x2="138" y2="156" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-dasharray="2 3"/>
  <line x1="522" y1="52" x2="522" y2="172" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-dasharray="2 3"/>
