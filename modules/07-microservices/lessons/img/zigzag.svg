  <circle cx="330" cy="76" r="6" fill="#0891b2"/>
  <text x="342" y="80" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2" font-weight="600">0</text>
  <circle cx="266" cy="92" r="6" fill="#0891b2"/>
  <text x="254" y="96" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2" font-weight="600">1</text>
  <circle cx="394" cy="108" r="6" fill="#0891b2"/>
  <text x="406" y="112" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2" font-weight="600">2</text>
  <circle cx="202" cy="124" r="6" fill="#0891b2"/>
  <text x="190" y="128" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2" font-weight="600">3</text>
  <circle cx="458" cy="140" r="6" fill="#0891b2"/>
  <text x="470" y="144" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2" font-weight="600">4</text>
  <circle cx="138" cy="156" r="6" fill="#0891b2"/>
  <text x="126" y="160" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2" font-weight="600">5</text>
  <circle cx="522" cy="172" r="6" fill="#0891b2"/>
  <text x="534" y="176" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2" font-weight="600">6</text>
  <text x="562" y="176" font-size="11" fill="#0891b2">= zigzag(n)</text>
  <line x1="16" y1="188" x2="664" y2="188" stroke="currentColor" stroke-width="1" opacity="0.25" stroke-dasharray="4 4"/>
  <text x="16" y="208" font-size="11" opacity="0.6">поле 1 со значением −1 на проводе</text>
  <text x="16" y="241" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">int32</text>
  <rect x="80" y="222" width="30" height="28" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.1"/>
  <text x="95" y="241" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">08</text>
  <rect x="114" y="222" width="30" height="28" rx="3" fill="#dc2626" fill-opacity="0.14" stroke="#dc2626" stroke-width="1.1"/>
  <text x="129" y="241" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ff</text>
