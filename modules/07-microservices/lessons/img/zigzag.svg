  <rect x="216" y="222" width="30" height="28" rx="3" fill="#dc2626" fill-opacity="0.14" stroke="#dc2626" stroke-width="1.1"/>
  <text x="231" y="241" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ff</text>
  <rect x="250" y="222" width="30" height="28" rx="3" fill="#dc2626" fill-opacity="0.14" stroke="#dc2626" stroke-width="1.1"/>
  <text x="265" y="241" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ff</text>
  <rect x="284" y="222" width="30" height="28" rx="3" fill="#dc2626" fill-opacity="0.14" stroke="#dc2626" stroke-width="1.1"/>
  <text x="299" y="241" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ff</text>
  <rect x="318" y="222" width="30" height="28" rx="3" fill="#dc2626" fill-opacity="0.14" stroke="#dc2626" stroke-width="1.1"/>
  <text x="333" y="241" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ff</text>
  <rect x="352" y="222" width="30" height="28" rx="3" fill="#dc2626" fill-opacity="0.14" stroke="#dc2626" stroke-width="1.1"/>
  <text x="367" y="241" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ff</text>
  <rect x="386" y="222" width="30" height="28" rx="3" fill="#dc2626" fill-opacity="0.14" stroke="#dc2626" stroke-width="1.1"/>
  <text x="401" y="241" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ff</text>
  <rect x="420" y="222" width="30" height="28" rx="3" fill="#dc2626" fill-opacity="0.14" stroke="#dc2626" stroke-width="1.1"/>
  <text x="435" y="241" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">01</text>
  <text x="462" y="241" font-size="11" fill="#dc2626">10 байт на значение</text>
  <text x="16" y="285" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">sint32</text>
