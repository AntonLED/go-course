<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 396" role="img" aria-label="Клиент шлёт POST с Idempotency-Key k-42, middleware застолбляет ключ, обработчик списывает деньги, ответ сохраняется по ключу, но теряется в сети. Клиент по таймауту повторяет запрос с тем же ключом, middleware находит сохранённый ответ и отдаёт его, не вызывая обработчик" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Повтор запроса с Idempotency-Key</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-grn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- участники -->
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="30" y="12" width="120" height="32" rx="4"/>
    <rect x="530" y="12" width="120" height="32" rx="4"/>
  </g>
  <rect x="260" y="12" width="160" height="32" rx="4" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <text x="90" y="33" text-anchor="middle">клиент</text>
  <text x="340" y="33" text-anchor="middle" fill="#0891b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Idempotency</text>
  <text x="590" y="33" text-anchor="middle">обработчик</text>
  <g stroke="currentColor" stroke-width="1" opacity="0.35" stroke-dasharray="3 3">
    <line x1="90" y1="44" x2="90" y2="388"/>
    <line x1="340" y1="44" x2="340" y2="388"/>
    <line x1="590" y1="44" x2="590" y2="388"/>
  </g>

  <!-- попытка 1 -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">
    <text x="215" y="62">POST /payments</text>
    <text x="215" y="76">Idempotency-Key: k-42</text>
  </g>
  <line x1="90" y1="84" x2="338" y2="84" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="264" y="94" width="152" height="22" rx="3" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1" stroke-opacity="0.5"/>
  <text x="340" y="109" text-anchor="middle" font-size="11">k-42: застолбить</text>

  <text x="465" y="134" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">next</text>
  <line x1="340" y1="140" x2="588" y2="140" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="582" y="140" width="16" height="36" fill="#d97706" fill-opacity="0.25" stroke="#d97706" stroke-width="1"/>
  <text x="604" y="162" font-size="11" fill="#d97706">списать</text>
  <text x="465" y="186" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">201 {"id":7}</text>
  <line x1="582" y1="192" x2="342" y2="192" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)"/>

  <rect x="248" y="202" width="184" height="22" rx="3" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1" stroke-opacity="0.5"/>
  <text x="340" y="217" text-anchor="middle" font-size="11">k-42 → сохранить 201 + тело</text>

  <!-- потерянный ответ -->
  <line x1="340" y1="244" x2="200" y2="244" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 3"/>
  <g stroke="#dc2626" stroke-width="2"><line x1="186" y1="236" x2="202" y2="252"/><line x1="202" y1="236" x2="186" y2="252"/></g>
  <text x="270" y="238" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">201</text>
  <text x="194" y="268" text-anchor="middle" font-size="11" fill="#dc2626">ответ потерян</text>
  <text x="84" y="268" text-anchor="end" font-size="11" fill="#d97706">таймаут</text>

  <!-- попытка 2 -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">
    <text x="215" y="286">POST /payments</text>
    <text x="215" y="300">Idempotency-Key: k-42</text>
  </g>
  <text x="84" y="312" text-anchor="end" font-size="11" opacity="0.7">повтор</text>
  <line x1="90" y1="308" x2="338" y2="308" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="248" y="318" width="184" height="22" rx="3" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1"/>
  <text x="340" y="333" text-anchor="middle" font-size="11">k-42 есть, запрос тот же</text>
  <text x="580" y="333" text-anchor="end" font-size="11" opacity="0.7">обработчик не вызван</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle" fill="#16a34a">
    <text x="215" y="358">201 {"id":7}</text>
    <text x="215" y="372">Idempotent-Replayed: true</text>
  </g>
  <line x1="338" y1="380" x2="92" y2="380" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr-grn)"/>
  <text x="580" y="384" text-anchor="end" font-size="11" fill="#16a34a">деньги списаны один раз</text>
</svg>
