<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236" role="img" aria-label="Шкала кодов ошибок JSON-RPC 2.0 в масштабе: весь диапазон от −32768 до −32000 зарезервирован спецификацией; в нём определены −32700 Parse error, −32600…−32603 и диапазон −32099…−32000 для ошибок реализации сервера; коды вне диапазона свободны для приложения" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Коды ошибок JSON-RPC 2.0</title>
  <text x="340" y="18" text-anchor="middle" font-size="11" opacity="0.7">зарезервировано спецификацией (в масштабе)</text>
  <path d="M60,26 v-4 h560 v4" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <rect x="60" y="80" width="560" height="28" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.2"/>
  <rect x="16" y="80" width="40" height="28" fill="#16a34a" fill-opacity="0.15"/>
  <rect x="624" y="80" width="40" height="28" fill="#16a34a" fill-opacity="0.15"/>
  <text x="36" y="72" text-anchor="middle" font-size="10" fill="#16a34a">прил.</text>
  <text x="644" y="72" text-anchor="middle" font-size="10" fill="#16a34a">прил.</text>
  <rect x="547.8" y="80" width="72.2" height="28" fill="#7c3aed" fill-opacity="0.3"/>
  <line x1="109.6" y1="76" x2="109.6" y2="112" stroke="#dc2626" stroke-width="2.5"/>
  <text x="109.6" y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#dc2626">−32700</text>
  <text x="109.6" y="66" text-anchor="middle" font-size="11">Parse error</text>
  <rect x="179.3" y="76" width="4.2" height="36" fill="#0891b2"/>
  <line x1="181.4" y1="112" x2="181.4" y2="128" stroke="#0891b2" stroke-width="1.2"/>
  <path d="M181.4,128 H236" fill="none" stroke="#0891b2" stroke-width="1.2"/>
  <line x1="236" y1="128" x2="236" y2="196" stroke="#0891b2" stroke-width="1.2"/>
  <line x1="236" y1="136" x2="244" y2="136" stroke="#0891b2" stroke-width="1.2"/>
  <text x="250" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">−32600</text><text x="310" y="140" font-size="12">Invalid Request</text>
  <line x1="236" y1="156" x2="244" y2="156" stroke="#0891b2" stroke-width="1.2"/>
  <text x="250" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">−32601</text><text x="310" y="160" font-size="12">Method not found</text>
  <line x1="236" y1="176" x2="244" y2="176" stroke="#0891b2" stroke-width="1.2"/>
  <text x="250" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">−32602</text><text x="310" y="180" font-size="12">Invalid params</text>
  <line x1="236" y1="196" x2="244" y2="196" stroke="#0891b2" stroke-width="1.2"/>
  <text x="250" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">−32603</text><text x="310" y="200" font-size="12">Internal error</text>
  <text x="583.9" y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7c3aed">−32099…−32000</text>
  <text x="583.9" y="66" text-anchor="middle" font-size="11">Server error</text>
  <text x="583.9" y="148" text-anchor="middle" font-size="11" opacity="0.7">ошибки реализации</text>
  <text x="583.9" y="162" text-anchor="middle" font-size="11" opacity="0.7">сервера</text>
  <text x="60" y="124" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" opacity="0.8">−32768</text>
  <text x="620" y="124" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" opacity="0.8">−32000</text>
  <text x="420" y="98" text-anchor="middle" font-size="11" opacity="0.6">остальное — «на будущее»</text>
  <text x="20" y="228" font-size="11" fill="#16a34a">вне диапазона (−1, 1001, −40000…) — свободно для ошибок приложения</text>
</svg>
