<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 308" role="img" aria-label="grpc.ChainUnaryInterceptor(logging, auth): сервер вызывает logging, тот засекает время и вызывает следующий handler — auth; auth проверяет токен и вызывает обработчик GetItem. Ответ возвращается в обратном порядке, logging пишет код и длительность. Без токена auth сразу возвращает Unauthenticated, не вызывая обработчик" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Цепочка интерсепторов</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="124" height="30" rx="4" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.2"/>
  <text x="70" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">grpc.Server</text>
  <rect x="188" y="8" width="124" height="40" rx="4" fill="#0891b2" fill-opacity="0.10" stroke="#0891b2" stroke-width="1.2"/>
  <text x="250" y="26" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">logging</text>
  <text x="250" y="41" text-anchor="middle" font-size="10" opacity="0.65">a, внешний</text>
  <rect x="368" y="8" width="124" height="40" rx="4" fill="#7c3aed" fill-opacity="0.10" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="430" y="26" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">auth</text>
  <text x="430" y="41" text-anchor="middle" font-size="10" opacity="0.65">b</text>
  <rect x="538" y="8" width="124" height="40" rx="4" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-width="1.2"/>
  <text x="600" y="26" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">GetItem</text>
  <text x="600" y="41" text-anchor="middle" font-size="10" opacity="0.65">handler</text>
  <line x1="70" y1="38" x2="70" y2="300" stroke="currentColor" stroke-width="1" opacity="0.35" stroke-dasharray="3 3"/>
  <line x1="250" y1="48" x2="250" y2="300" stroke="currentColor" stroke-width="1" opacity="0.35" stroke-dasharray="3 3"/>
  <line x1="430" y1="48" x2="430" y2="300" stroke="currentColor" stroke-width="1" opacity="0.35" stroke-dasharray="3 3"/>
  <line x1="600" y1="48" x2="600" y2="222" stroke="currentColor" stroke-width="1" opacity="0.35" stroke-dasharray="3 3"/>
  <line x1="70" y1="74" x2="248" y2="74" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="160.0" y="68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="currentColor">req</text>
  <rect x="179" y="85" width="141" height="20" rx="3" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.6"/>
  <text x="250" y="99" text-anchor="middle" font-size="11">start := time.Now()</text>
  <line x1="250" y1="130" x2="428" y2="130" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="340.0" y="124" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="currentColor">handler(ctx, req)</text>
  <rect x="372" y="141" width="115" height="20" rx="3" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.6"/>
  <text x="430" y="155" text-anchor="middle" font-size="11">проверить токен</text>
  <line x1="430" y1="186" x2="598" y2="186" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="515.0" y="180" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="currentColor">handler(ctx, req)</text>
  <line x1="600" y1="212" x2="432" y2="212" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="515.0" y="206" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="currentColor">resp, err</text>
  <line x1="430" y1="238" x2="252" y2="238" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="340.0" y="232" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="currentColor">resp, err</text>
  <rect x="192" y="249" width="115" height="20" rx="3" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.6"/>
  <text x="250" y="263" text-anchor="middle" font-size="11">slog: code, dur</text>
  <line x1="250" y1="292" x2="72" y2="292" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="160.0" y="286" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="currentColor">resp, err</text>
  <text x="468" y="256" font-size="11" fill="#dc2626">без токена auth сразу вернёт</text>
  <text x="468" y="271" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#dc2626">codes.Unauthenticated,</text>
  <text x="468" y="286" font-size="11" fill="#dc2626">и GetItem не вызовется</text>
</svg>
