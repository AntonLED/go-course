<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 212" role="img" aria-label="Кодирование varint: число 150 делится на 7-битные группы 0000001 и 0010110; младшая группа идёт первой со старшим битом продолжения 1, получается 96 01. Для 300 группы 0000010 и 0101100 дают ac 02" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Varint: 150 и 300</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
  </defs>
  <text x="40" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">150 = 1001 0110₂</text>
  <g font-size="10" opacity="0.6" text-anchor="middle"><text x="116" y="38">старшие</text><text x="192" y="38">младшие 7</text></g>
  <rect x="80" y="44" width="72" height="26" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <rect x="156" y="44" width="72" height="26" rx="3" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <text x="116" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0000001</text>
  <text x="192" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0010110</text>
  <line x1="192" y1="70" x2="116" y2="112" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <line x1="116" y1="70" x2="216" y2="112" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="64" y="114" width="18" height="26" fill="#d97706" fill-opacity="0.2" stroke="#d97706" stroke-width="1.2"/>
  <text x="73" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#d97706" font-weight="600">1</text>
  <rect x="82" y="114" width="72" height="26" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <text x="118" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0010110</text>
  <text x="109" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">96</text>
  <text x="109" y="176" text-anchor="middle" font-size="10" opacity="0.6">1-й байт</text>
  <rect x="164" y="114" width="18" height="26" fill="#d97706" fill-opacity="0.2" stroke="#d97706" stroke-width="1.2"/>
  <text x="173" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#d97706" font-weight="600">0</text>
  <rect x="182" y="114" width="72" height="26" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="218" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0000001</text>
  <text x="209" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">01</text>
  <text x="209" y="176" text-anchor="middle" font-size="10" opacity="0.6">2-й байт</text>
  <text x="380" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">300 = 1 0010 1100₂</text>
  <g font-size="10" opacity="0.6" text-anchor="middle"><text x="456" y="38">старшие</text><text x="532" y="38">младшие 7</text></g>
  <rect x="420" y="44" width="72" height="26" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <rect x="496" y="44" width="72" height="26" rx="3" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <text x="456" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0000010</text>
  <text x="532" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0101100</text>
  <line x1="532" y1="70" x2="456" y2="112" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <line x1="456" y1="70" x2="556" y2="112" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="404" y="114" width="18" height="26" fill="#d97706" fill-opacity="0.2" stroke="#d97706" stroke-width="1.2"/>
  <text x="413" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#d97706" font-weight="600">1</text>
  <rect x="422" y="114" width="72" height="26" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <text x="458" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0101100</text>
  <text x="449" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">ac</text>
  <text x="449" y="176" text-anchor="middle" font-size="10" opacity="0.6">1-й байт</text>
  <rect x="504" y="114" width="18" height="26" fill="#d97706" fill-opacity="0.2" stroke="#d97706" stroke-width="1.2"/>
  <text x="513" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#d97706" font-weight="600">0</text>
  <rect x="522" y="114" width="72" height="26" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="558" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0000010</text>
  <text x="549" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">02</text>
  <text x="549" y="176" text-anchor="middle" font-size="10" opacity="0.6">2-й байт</text>
  <line x1="350" y1="8" x2="350" y2="180" stroke="currentColor" stroke-width="1" opacity="0.25" stroke-dasharray="4 4"/>
  <rect x="40" y="194" width="12" height="12" fill="#d97706" fill-opacity="0.2" stroke="#d97706"/><text x="58" y="204" font-size="11">старший бит (MSB): 1 — дальше ещё байт, 0 — последний; младшая группа идёт первой</text>
</svg>
