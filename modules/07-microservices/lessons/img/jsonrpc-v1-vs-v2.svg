<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 303" role="img" aria-label="Сравнение сообщений JSON-RPC 1.0 (кодек net/rpc/jsonrpc) и JSON-RPC 2.0 для вызова Arith.Multiply: в 1.0 нет поля jsonrpc, params — массив из одного элемента, error: null присутствует в успешном ответе, ошибка — строка; в 2.0 есть jsonrpc 2.0, params может быть объектом, ошибка — объект с кодом" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>JSON-RPC 1.0 и 2.0</title>
  <text x="16" y="18" font-weight="600">1.0 — <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">net/rpc/jsonrpc</tspan></text>
  <text x="352" y="18" font-weight="600">2.0 — спецификация</text>
  <text x="16" y="36" font-size="11" opacity="0.6">запрос</text>
  <rect x="16" y="42" width="312" height="72" rx="4" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.1"/>
  <text x="24" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11"><tspan>{"method":"Arith.Multiply",</tspan></text>
  <text x="24" y="73" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11"><tspan fill="#d97706">"params":[{"A":7,"B":8}]</tspan><tspan>,</tspan></text>
  <text x="24" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11"><tspan>"id":0}</tspan></text>
  <text x="16" y="130" font-size="11" fill="#d97706">нет поля jsonrpc; params — массив из 1 элемента</text>
  <text x="16" y="156" font-size="11" opacity="0.6">ответ</text>
  <rect x="16" y="162" width="312" height="27" rx="4" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.1"/>
  <text x="24" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11"><tspan>{"id":0,"result":56,</tspan><tspan fill="#d97706">"error":null</tspan><tspan>}</tspan></text>
  <text x="16" y="205" font-size="11" fill="#d97706">error: null есть и в успешном ответе</text>
  <text x="16" y="231" font-size="11" opacity="0.6">ошибка</text>
  <rect x="16" y="237" width="312" height="42" rx="4" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.1"/>
  <text x="24" y="253" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11"><tspan>{"id":0,"result":null,</tspan></text>
  <text x="24" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11"><tspan fill="#d97706">"error":"rpc: can't find method …"</tspan><tspan>}</tspan></text>
  <text x="16" y="295" font-size="11" fill="#d97706">ошибка — просто строка</text>
  <text x="352" y="36" font-size="11" opacity="0.6">запрос</text>
  <rect x="352" y="42" width="312" height="72" rx="4" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.1"/>
  <text x="360" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11"><tspan>{</tspan><tspan fill="#0891b2">"jsonrpc":"2.0"</tspan><tspan>,</tspan></text>
  <text x="360" y="73" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11"><tspan>"method":"Arith.Multiply",</tspan></text>
  <text x="360" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11"><tspan fill="#0891b2">"params":{"A":7,"B":8}</tspan><tspan>,</tspan></text>
  <text x="360" y="103" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11"><tspan>"id":0}</tspan></text>
  <text x="352" y="130" font-size="11" fill="#0891b2">params — массив или объект, можно опустить</text>
  <text x="352" y="156" font-size="11" opacity="0.6">ответ</text>
  <rect x="352" y="162" width="312" height="27" rx="4" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.1"/>
  <text x="360" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11"><tspan>{</tspan><tspan fill="#0891b2">"jsonrpc":"2.0"</tspan><tspan>,"result":56,"id":0}</tspan></text>
  <text x="352" y="205" font-size="11" fill="#0891b2">ровно одно из result / error</text>
  <text x="352" y="231" font-size="11" opacity="0.6">ошибка</text>
  <rect x="352" y="237" width="312" height="42" rx="4" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.1"/>
  <text x="360" y="253" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11"><tspan>{"jsonrpc":"2.0","error":</tspan></text>
  <text x="360" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11"><tspan fill="#0891b2">{"code":-32601,"message":"…"}</tspan><tspan>,"id":0}</tspan></text>
  <text x="352" y="295" font-size="11" fill="#0891b2">ошибка — объект с числовым кодом</text>
  <line x1="340" y1="8" x2="340" y2="301" stroke="currentColor" stroke-width="1" opacity="0.25" stroke-dasharray="4 4"/>
</svg>
