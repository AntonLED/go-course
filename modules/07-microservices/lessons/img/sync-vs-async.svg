<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 334" role="img" aria-label="Сверху синхронная цепочка client → orders → inventory → payments: задержки складываются, доступность перемножается, отказ payments возвращается ошибкой до клиента. Снизу асинхронно: orders публикует OrderCreated в брокер и сразу отвечает, подписчики читают события когда смогут" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Синхронное и асинхронное взаимодействие</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-amb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- ===== синхронно ===== -->
  <text x="20" y="20" font-weight="600">Синхронно: запрос → ждём ответ</text>

  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="40" width="84" height="44" rx="4"/>
    <rect x="196" y="40" width="84" height="44" rx="4"/>
    <rect x="372" y="40" width="96" height="44" rx="4"/>
  </g>
  <rect x="560" y="40" width="100" height="44" rx="4" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="62" y="66">client</text><text x="238" y="66">orders</text><text x="420" y="66">inventory</text>
    <text x="610" y="60" fill="#dc2626">payments</text>
  </g>
  <text x="610" y="76" text-anchor="middle" font-size="11" fill="#dc2626">лежит</text>

  <!-- запросы -->
  <g stroke="currentColor" stroke-width="1.4">
    <line x1="104" y1="52" x2="194" y2="52" marker-end="url(#arr)"/>
    <line x1="280" y1="52" x2="370" y2="52" marker-end="url(#arr)"/>
    <line x1="468" y1="52" x2="558" y2="52" marker-end="url(#arr)"/>
  </g>
  <!-- ошибки назад -->
  <g stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3">
    <line x1="558" y1="74" x2="470" y2="74" marker-end="url(#arr-red)"/>
    <line x1="370" y1="74" x2="282" y2="74" marker-end="url(#arr-red)"/>
    <line x1="194" y1="74" x2="106" y2="74" marker-end="url(#arr-red)"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#dc2626">
    <text x="514" y="96">ошибка</text><text x="326" y="96">ошибка</text><text x="150" y="96">ошибка</text>
  </g>
  <g font-size="11" text-anchor="middle" opacity="0.6">
    <text x="150" y="44">ждёт</text><text x="326" y="44">ждёт</text><text x="514" y="44">ждёт</text>
  </g>

  <!-- итоги -->
  <text x="20" y="122" font-size="12">задержка = сумма звеньев · доступность = 0.999 × 0.999 × 0.999 ≈ 99.7%</text>
  <text x="20" y="140" font-size="12" fill="#dc2626">отказ одного звена каскадом доходит до клиента</text>

  <line x1="20" y1="160" x2="660" y2="160" stroke="currentColor" stroke-width="1" opacity="0.25" stroke-dasharray="4 4"/>

  <!-- ===== асинхронно ===== -->
  <text x="20" y="186" font-weight="600">Асинхронно: публикуем событие</text>

  <rect x="20" y="226" width="96" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="68" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">orders</text>
  <text x="68" y="290" text-anchor="middle" font-size="11" fill="#16a34a">сразу отвечает</text>
  <text x="68" y="304" text-anchor="middle" font-size="11" fill="#16a34a">клиенту</text>

  <!-- брокер -->
  <rect x="204" y="212" width="216" height="72" rx="6" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <text x="312" y="230" text-anchor="middle" font-size="12" fill="#0891b2">брокер (Kafka, NATS, RabbitMQ)</text>
  <g fill="none" stroke="#0891b2" stroke-width="1.2">
    <rect x="216" y="242" width="192" height="30" rx="3"/>
    <line x1="280" y1="242" x2="280" y2="272"/><line x1="344" y1="242" x2="344" y2="272"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">
    <text x="248" y="261">ev 41</text><text x="312" y="261">ev 42</text><text x="376" y="261">ev 43</text>
  </g>

  <line x1="116" y1="248" x2="202" y2="248" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <text x="160" y="240" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0891b2">publish</text>
  <text x="160" y="266" text-anchor="middle" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity="0.7">OrderCreated</text>

  <!-- подписчики -->
  <rect x="524" y="196" width="136" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="592" y="220" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">inventory</text>
  <rect x="524" y="260" width="136" height="40" rx="4" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="592" y="278" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">notifications</text>
  <text x="592" y="292" text-anchor="middle" font-size="10" fill="#d97706">недоступен</text>

  <path d="M420,236 L520,218" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M420,262 L520,280" fill="none" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-amb)"/>
  <text x="470" y="216" text-anchor="middle" font-size="11" opacity="0.7">читает</text>
  <text x="470" y="296" text-anchor="middle" font-size="11" fill="#d97706">прочтёт позже</text>
  <text x="312" y="324" text-anchor="middle" font-size="11" opacity="0.7">at-least-once: возможны дубли; согласованность — в конечном счёте</text>
</svg>
