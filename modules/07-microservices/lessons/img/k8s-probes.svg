<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 332" role="img" aria-label="Три пробы Kubernetes: startup ждёт окончания долгого старта, liveness при провале перезапускает контейнер и не должна проверять зависимости, readiness при провале убирает под из балансировки без перезапуска. Внизу жизненный цикл пода: старт, работа в балансировке, SIGTERM, not ready, graceful shutdown" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Пробы Kubernetes</title>
  <defs>
    <marker id="arr-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-amb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d97706"/>
    </marker>
  </defs>

  <g font-size="11" opacity="0.6">
    <text x="20" y="18">проба</text>
    <text x="196" y="18">kubelet спрашивает</text>
    <text x="420" y="18">если провал</text>
  </g>

  <!-- startup -->
  <rect x="20" y="28" width="160" height="48" rx="4" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="100" y="57" text-anchor="middle" font-weight="600">startup</text>
  <text x="196" y="50">«уже стартовал?»</text>
  <text x="196" y="66" font-size="11" opacity="0.65">остальные пробы ждут</text>
  <line x1="360" y1="52" x2="414" y2="52" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-red)"/>
  <text x="420" y="50" fill="#dc2626">не успел за лимит →</text>
  <text x="420" y="66" fill="#dc2626">перезапуск контейнера</text>

  <!-- liveness -->
  <rect x="20" y="88" width="160" height="48" rx="4" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="1.2"/>
  <text x="100" y="109" text-anchor="middle" font-weight="600">liveness</text>
  <text x="100" y="126" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/healthz</text>
  <text x="196" y="110">«процесс жив?»</text>
  <text x="196" y="126" font-size="11" opacity="0.65">без проверки БД!</text>
  <line x1="360" y1="112" x2="414" y2="112" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-red)"/>
  <text x="420" y="110" fill="#dc2626">перезапуск контейнера</text>
  <text x="420" y="126" font-size="11" opacity="0.65">проверяла бы БД → рестарт всех подов</text>

  <!-- readiness -->
  <rect x="20" y="148" width="160" height="48" rx="4" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="100" y="169" text-anchor="middle" font-weight="600">readiness</text>
  <text x="100" y="186" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/readyz</text>
  <text x="196" y="170">«готов к трафику?»</text>
  <text x="196" y="186" font-size="11" opacity="0.65">можно проверить БД, кэш</text>
  <line x1="360" y1="172" x2="414" y2="172" stroke="#d97706" stroke-width="1.4" marker-end="url(#arr-amb)"/>
  <text x="420" y="170" fill="#d97706">убрать из балансировки</text>
  <text x="420" y="186" font-size="11" opacity="0.65">без перезапуска; вернётся, когда готов</text>

  <line x1="20" y1="216" x2="660" y2="216" stroke="currentColor" stroke-width="1" opacity="0.25" stroke-dasharray="4 4"/>

  <!-- жизненный цикл -->
  <text x="20" y="240" font-size="11" opacity="0.6">жизнь пода</text>
  <rect x="20" y="252" width="160" height="30" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1"/>
  <rect x="180" y="252" width="280" height="30" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="1"/>
  <rect x="460" y="252" width="200" height="30" fill="#d97706" fill-opacity="0.15" stroke="#d97706" stroke-width="1"/>
  <g font-size="12" text-anchor="middle">
    <text x="100" y="272">старт (startup)</text>
    <text x="320" y="272">ready: получает трафик</text>
    <text x="560" y="272">not ready → Shutdown</text>
  </g>
  <g font-size="11" text-anchor="middle" opacity="0.75">
    <text x="180" y="300">readiness ✓</text>
    <text x="460" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SIGTERM</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2"><line x1="180" y1="248" x2="180" y2="288"/><line x1="460" y1="248" x2="460" y2="288"/></g>
  <text x="560" y="300" text-anchor="middle" font-size="11" opacity="0.75">/readyz → 503,</text>
  <text x="560" y="316" text-anchor="middle" font-size="11" opacity="0.75">дождаться активных запросов</text>
</svg>
