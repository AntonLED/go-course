<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-label="Четыре типа RPC как диаграммы последовательности: unary — один запрос и один ответ; server streaming — один запрос и поток ответов до io.EOF; client streaming — поток сообщений клиента, CloseSend и один ответ через SendAndClose; bidirectional — два независимых потока в обе стороны" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
