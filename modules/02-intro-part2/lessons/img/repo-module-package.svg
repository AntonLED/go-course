<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 276" role="img" aria-label="Репозиторий с двумя модулями: корневой go.mod задаёт модуль github.com/acme/app, вложенный tools/go.mod отрезает поддерево в модуль github.com/acme/app/tools. Каждая директория с .go-файлами — пакет, путь импорта = путь модуля + путь директории" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Репозиторий, модули и пакеты</title>

  <!-- headers -->
  <g font-size="11" opacity="0.6">
    <text x="48" y="20">файлы репозитория</text>
    <text x="330" y="20">путь импорта пакета</text>
  </g>

  <!-- module 1 bracket -->
  <rect x="36" y="30" width="634" height="138" rx="6" fill="#0891b2" fill-opacity="0.07" stroke="#0891b2" stroke-width="1.2"/>
  <text x="662" y="48" text-anchor="end" font-size="11" fill="#0891b2" font-weight="600">модуль 1</text>
  <!-- module 2 bracket -->
  <rect x="36" y="176" width="634" height="88" rx="6" fill="#7c3aed" fill-opacity="0.07" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="662" y="194" text-anchor="end" font-size="11" fill="#7c3aed" font-weight="600">модуль 2</text>

  <!-- tree lines -->
  <g stroke="currentColor" stroke-width="1" opacity="0.4" fill="none">
    <path d="M56,58 V200"/>
    <path d="M56,80 H64"/><path d="M56,112 H64"/><path d="M56,144 H64"/><path d="M56,200 H64"/>
    <path d="M80,208 V240 H88"/><path d="M80,218 H88"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="48" y="52" font-weight="600">/<tspan dx="8" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" opacity="0.6">корень git-репозитория</tspan></text>
    <text x="70" y="84">go.mod</text>
    <text x="70" y="116">cmd/server/</text>
    <text x="70" y="148">internal/store/</text>
    <text x="70" y="204">tools/</text>
    <text x="96" y="222">go.mod</text>
    <text x="96" y="244">gen/</text>
  </g>
  <g font-size="11" opacity="0.6">
    <text x="190" y="116">package main</text>
    <text x="190" y="148">package store</text>
    <text x="190" y="244">package gen</text>
  </g>

  <!-- right column -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="330" y="84"><tspan opacity="0.6">module </tspan><tspan fill="#0891b2" font-weight="600">github.com/acme/app</tspan></text>
    <text x="330" y="116"><tspan fill="#0891b2">github.com/acme/app</tspan>/cmd/server</text>
    <text x="330" y="148"><tspan fill="#0891b2">github.com/acme/app</tspan>/internal/store</text>
    <text x="330" y="222"><tspan opacity="0.6">module </tspan><tspan fill="#7c3aed" font-weight="600">github.com/acme/app/tools</tspan></text>
    <text x="330" y="244"><tspan fill="#7c3aed">github.com/acme/app/tools</tspan>/gen</text>
  </g>
</svg>
