<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 244" role="img" aria-label="Главный модуль требует github.com/acme/lib v1.9.0 и github.com/acme/lib/v2 v2.1.0. Это два разных пути модуля из одного репозитория, их пакеты импортируются по разным путям и попадают в сборку оба" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>v1 и v2 — разные модули</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
    <marker id="arr-vio" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- app -->
  <rect x="20" y="36" width="260" height="176" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="32" y="58" font-weight="600">главный модуль</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="32" y="86" opacity="0.6">// go.mod</text>
    <text x="32" y="106">require (</text>
    <text x="48" y="126" fill="#0891b2">…/acme/lib</text><text x="200" y="126" fill="#0891b2">v1.9.0</text>
    <text x="48" y="146" fill="#7c3aed">…/acme/lib/v2</text><text x="200" y="146" fill="#7c3aed">v2.1.0</text>
    <text x="32" y="166">)</text>
    <text x="32" y="196" opacity="0.6">// в сборке — оба модуля</text>
  </g>

  <!-- repo -->
  <rect x="360" y="20" width="310" height="212" rx="6" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="5 3" opacity="0.5"/>
  <text x="372" y="40" font-size="11" opacity="0.7">один репозиторий github.com/acme/lib</text>

  <rect x="376" y="52" width="278" height="76" rx="4" fill="#0891b2" fill-opacity="0.10" stroke="#0891b2" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="388" y="74"><tspan opacity="0.6">module </tspan><tspan fill="#0891b2" font-weight="600">github.com/acme/lib</tspan></text>
    <text x="388" y="94" opacity="0.7">тег v1.9.0</text>
    <text x="388" y="116">import ".../lib/client"</text>
  </g>

  <rect x="376" y="144" width="278" height="76" rx="4" fill="#7c3aed" fill-opacity="0.10" stroke="#7c3aed" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="388" y="166"><tspan opacity="0.6">module </tspan><tspan fill="#7c3aed" font-weight="600">github.com/acme/lib/v2</tspan></text>
    <text x="388" y="186" opacity="0.7">тег v2.1.0</text>
    <text x="388" y="208">import ".../lib/v2/client"</text>
  </g>

  <path d="M256,122 C320,122 316,90 374,90" fill="none" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <path d="M256,142 C320,142 316,182 374,182" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-vio)"/>
</svg>
