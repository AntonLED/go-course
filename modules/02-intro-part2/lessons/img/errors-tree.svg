<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 334" role="img" aria-label="Дерево ошибок: wrapError над joinError, у которого два ребёнка — ValidationError и wrapErrors с двумя %w. errors.Is обходит узлы в глубину в порядке 1–6 и находит ErrTimeout шестым" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Дерево ошибок и обход в глубину</title>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.7"><text x="20" y="20">err := fmt.Errorf("save: %w", errors.Join(verr,</text><text x="52" y="36">fmt.Errorf("db: %w, %w", ErrConflict, ErrTimeout)))</text></g>

  <g transform="translate(0,16)">
  <!-- edges -->
  <g stroke="currentColor" stroke-width="1.2" fill="none" opacity="0.6">
    <line x1="340" y1="80" x2="340" y2="104"/>
    <path d="M340,144 V156 H180 V168"/><path d="M340,156 H480 V168"/>
    <path d="M480,208 V220 H380 V232"/><path d="M480,220 H580 V232"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" opacity="0.7">
    <text x="350" y="97">Unwrap() error</text>
    <text x="172" y="160" text-anchor="end">Unwrap() []error</text>
    <text x="372" y="224" text-anchor="end">Unwrap() []error</text>
  </g>

  <!-- node 1 -->
  <rect x="250" y="40" width="180" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="340" y="57" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">*fmt.wrapError</text>
  <text x="340" y="73" text-anchor="middle" font-size="11" opacity="0.6">"save: …"</text>

  <!-- node 2 -->
  <rect x="250" y="104" width="180" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="340" y="121" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">*errors.joinError</text>
  <text x="340" y="137" text-anchor="middle" font-size="11" opacity="0.6">errors.Join(…)</text>

  <!-- node 3 -->
  <rect x="90" y="168" width="180" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="180" y="185" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">*ValidationError</text>
  <text x="180" y="201" text-anchor="middle" font-size="11" opacity="0.6">verr, лист</text>

  <!-- node 4 -->
  <rect x="390" y="168" width="180" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="480" y="185" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">*fmt.wrapErrors</text>
  <text x="480" y="201" text-anchor="middle" font-size="11" opacity="0.6">"db: …", два %w</text>

  <!-- node 5 -->
  <rect x="300" y="232" width="160" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="380" y="257" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ErrConflict</text>

  <!-- node 6 -->
  <rect x="500" y="232" width="160" height="40" rx="4" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.6"/>
  <text x="580" y="257" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">ErrTimeout</text>

  <!-- order badges -->
  <g font-size="11" font-weight="600" text-anchor="middle" fill="#0891b2">
    <circle cx="234" cy="60" r="10" fill="#0891b2" fill-opacity="0.18" stroke="#0891b2"/><text x="234" y="64">1</text>
    <circle cx="234" cy="124" r="10" fill="#0891b2" fill-opacity="0.18" stroke="#0891b2"/><text x="234" y="128">2</text>
    <circle cx="74" cy="188" r="10" fill="#0891b2" fill-opacity="0.18" stroke="#0891b2"/><text x="74" y="192">3</text>
    <circle cx="374" cy="188" r="10" fill="#0891b2" fill-opacity="0.18" stroke="#0891b2"/><text x="374" y="192">4</text>
    <circle cx="284" cy="252" r="10" fill="#0891b2" fill-opacity="0.18" stroke="#0891b2"/><text x="284" y="256">5</text>
    <circle cx="484" cy="252" r="10" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a"/><text x="484" y="256" fill="#16a34a">6</text>
  </g>

  <text x="20" y="300" font-size="12"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">errors.Is(err, ErrTimeout)</tspan><tspan opacity="0.7">: порядок 1 → 2 → 3 → 4 → 5 → 6, совпадение на 6 → true</tspan></text>
  </g>
</svg>
