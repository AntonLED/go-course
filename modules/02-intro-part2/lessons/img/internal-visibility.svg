<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236" role="img" aria-label="Пакет billing/internal/tax могут импортировать только пакеты с корнем в billing: сам billing и billing/invoice. shipping и чужой модуль получают ошибку use of internal package not allowed" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Кто может импортировать internal</title>

  <!-- allowed zone -->
  <rect x="40" y="56" width="620" height="104" rx="6" fill="#16a34a" fill-opacity="0.08" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="648" y="112" text-anchor="end" font-size="11" fill="#16a34a">корень: …/billing — родитель internal/</text>

  <!-- tree lines -->
  <g stroke="currentColor" stroke-width="1" opacity="0.4" fill="none">
    <path d="M30,40 V172"/><path d="M30,76 H40"/><path d="M30,172 H40"/>
    <path d="M60,84 V140"/><path d="M60,108 H70"/><path d="M60,140 H70"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="20" y="28" font-weight="600">github.com/acme/app/</text>
    <text x="48" y="80">billing/</text>
    <text x="76" y="112" font-weight="600" fill="#0891b2">internal/tax/</text>
    <text x="76" y="144">invoice/</text>
    <text x="48" y="176">shipping/</text>
    <text x="20" y="220" font-weight="600">github.com/other/tool</text>
  </g>

  <!-- target mark -->
  <rect x="70" y="95" width="116" height="24" rx="4" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <text x="200" y="112" font-size="11" fill="#0891b2">импортируемый пакет</text>

  <!-- verdicts -->
  <g font-size="12">
    <text x="360" y="80" fill="#16a34a">✓ может импортировать</text>
    <text x="360" y="144" fill="#16a34a">✓ может импортировать</text>
    <text x="360" y="176" fill="#dc2626">✗ use of internal package … not allowed</text>
    <text x="360" y="220" fill="#dc2626">✗ not allowed — путь не под …/billing</text>
  </g>
  <g stroke="currentColor" stroke-width="1" opacity="0.25">
    <line x1="120" y1="76" x2="350" y2="76"/>
    <line x1="140" y1="140" x2="350" y2="140"/>
    <line x1="130" y1="172" x2="350" y2="172"/>
    <line x1="190" y1="216" x2="350" y2="216"/>
  </g>
</svg>
