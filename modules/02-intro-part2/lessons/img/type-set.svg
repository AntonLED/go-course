<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 232" role="img" aria-label="Набор типов Number — объединение трёх множеств: ~int (int, MyInt), ~int64 (int64, time.Duration), ~float64 (float64, Celsius). Без тильды множество состояло бы из одного float64, и Celsius в него не попал бы. string в набор не входит" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Type set ограничения Number</title>

  <!-- Number -->
  <rect x="20" y="28" width="560" height="176" rx="12" fill="#0891b2" fill-opacity="0.06" stroke="#0891b2" stroke-width="1.2"/>
  <text x="36" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12"><tspan fill="#0891b2" font-weight="600">Number</tspan><tspan opacity="0.7"> = ~int | ~int64 | ~float64</tspan></text>

  <!-- ~int -->
  <ellipse cx="112" cy="120" rx="80" ry="64" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="112" y="80" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">~int</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="112" y="118">int</text>
    <text x="112" y="142">MyInt</text>
  </g>

  <!-- ~int64 -->
  <ellipse cx="292" cy="120" rx="88" ry="64" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="292" y="80" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">~int64</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="292" y="118">int64</text>
    <text x="292" y="142">time.Duration</text>
  </g>

  <!-- ~float64 -->
  <ellipse cx="480" cy="120" rx="88" ry="64" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="480" y="80" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">~float64</text>
  <rect x="436" y="98" width="88" height="28" rx="14" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4 3"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="480" y="117">float64</text>
    <text x="480" y="152" fill="#16a34a" font-weight="600">Celsius</text>
  </g>

  <!-- notes -->
  <text x="596" y="108" font-size="11" fill="#d97706">без ~ —</text>
  <text x="596" y="122" font-size="11" fill="#d97706">только float64</text>
  <line x1="524" y1="112" x2="590" y2="112" stroke="#d97706" stroke-width="1" opacity="0.6"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.5">
    <text x="600" y="172">string</text>
    <text x="600" y="192">[]int</text>
  </g>
  <text x="600" y="216" font-size="11" opacity="0.5">вне набора</text>
</svg>
