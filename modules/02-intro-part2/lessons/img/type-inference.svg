<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 208" role="img" aria-label="Инференс типов в Map([]int{1, 2}, strconv.Itoa): тип параметра []T сопоставляется с []int, отсюда T = int; func(T) U сопоставляется с func(int) string, отсюда U = string; результат []U становится []string" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Вывод T и U в Map</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="20" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.7">strs := Map([]int{1, 2}, strconv.Itoa)</text>
  <g font-size="11" opacity="0.6">
    <text x="20" y="54">параметры</text>
    <text x="20" y="150">аргументы</text>
  </g>

  <!-- params -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <rect x="100" y="32" width="120" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="160" y="55">s <tspan fill="#0891b2" font-weight="600">[]T</tspan></text>
    <rect x="260" y="32" width="160" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="340" y="55">f <tspan font-weight="600">func(<tspan fill="#0891b2">T</tspan>) <tspan fill="#7c3aed">U</tspan></tspan></text>
    <!-- args -->
    <rect x="100" y="128" width="120" height="36" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.2"/>
    <text x="160" y="151">[]int{1, 2}</text>
    <rect x="260" y="128" width="160" height="36" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.2"/>
    <text x="340" y="151">strconv.Itoa</text>
  </g>
  <text x="340" y="182" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" opacity="0.6">func(int) string</text>

  <!-- unification -->
  <g stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7">
    <line x1="160" y1="68" x2="160" y2="128"/>
    <line x1="340" y1="68" x2="340" y2="128"/>
  </g>
  <g font-size="12">
    <text x="168" y="102"><tspan fill="#0891b2" font-weight="600">T</tspan> = int</text>
    <text x="348" y="94"><tspan fill="#0891b2" font-weight="600">T</tspan> = int ✓</text>
    <text x="348" y="112"><tspan fill="#7c3aed" font-weight="600">U</tspan> = string</text>
  </g>

  <!-- result -->
  <line x1="424" y1="100" x2="484" y2="100" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="488" y="52" width="176" height="96" rx="4" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="500" y="76">Map[<tspan fill="#0891b2">int</tspan>, <tspan fill="#7c3aed">string</tspan>]</text>
    <text x="500" y="102" opacity="0.7">результат []U</text>
    <text x="500" y="128" font-weight="600">strs: []string</text>
  </g>
</svg>
