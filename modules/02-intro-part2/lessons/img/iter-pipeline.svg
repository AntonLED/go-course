<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 264" role="img" aria-label="Ленивый конвейер Take(Filter(Fibonacci(), чётные), 5): числа Фибоначчи идут по одному; нечётные отсеивает Filter, чётные 0, 2, 8, 34, 144 проходят в Take; после пятого Take возвращается, и 233 уже не вычисляется" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Ленивый конвейер итераторов</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
    <marker id="arr-t" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="20" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.7">slices.Collect(Take(Filter(Fibonacci(), even), 5))</text>

