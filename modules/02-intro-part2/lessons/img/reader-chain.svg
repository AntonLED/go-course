<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236" role="img" aria-label="Цепочка обёрток io.Reader: ReadAll вызывает Read у TeeReader, тот у LimitedReader, тот у strings.Reader; байты возвращаются обратно, TeeReader копирует их в буфер" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Цепочка обёрток io.Reader</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
    <marker id="arr-vio" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <text x="340" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.7">io.ReadAll(io.TeeReader(io.LimitReader(strings.NewReader("hello, world"), 5), &amp;buf))</text>

  <!-- boxes -->
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="8" y="72" width="136" height="56" rx="4"/>
    <rect x="184" y="72" width="136" height="56" rx="4"/>
    <rect x="360" y="72" width="136" height="56" rx="4"/>
  </g>
  <rect x="536" y="72" width="136" height="56" rx="4" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="76" y="96" font-weight="600">io.ReadAll</text>
    <text x="76" y="114" opacity="0.6" font-size="11">потребитель</text>
    <text x="252" y="96" font-weight="600">*teeReader</text>
    <text x="252" y="114" opacity="0.6" font-size="11">{r, w}</text>
    <text x="428" y="96" font-weight="600">*LimitedReader</text>
    <text x="428" y="114" opacity="0.6" font-size="11">{R, N: 5}</text>
    <text x="604" y="96" font-weight="600">*strings.Reader</text>
    <text x="604" y="114" opacity="0.6" font-size="11">"hello, world"</text>
  </g>

  <!-- calls -->
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <line x1="144" y1="84" x2="182" y2="84" marker-end="url(#arr)"/>
    <line x1="320" y1="84" x2="358" y2="84" marker-end="url(#arr)"/>
    <line x1="496" y1="84" x2="534" y2="84" marker-end="url(#arr)"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">
    <text x="164" y="60">Read(p)</text><text x="340" y="60">Read(p)</text><text x="516" y="60">Read(p[:5])</text>
  </g>

  <!-- data back -->
  <g stroke="#0891b2" stroke-width="1.4" fill="none">
    <line x1="182" y1="116" x2="146" y2="116" marker-end="url(#arr-acc)"/>
    <line x1="358" y1="116" x2="322" y2="116" marker-end="url(#arr-acc)"/>
    <line x1="534" y1="116" x2="498" y2="116" marker-end="url(#arr-acc)"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle" fill="#0891b2">
    <text x="164" y="146">"hello"</text><text x="340" y="146">"hello"</text><text x="516" y="146">"hello"</text>
  </g>

  <!-- tee to buf -->
  <line x1="252" y1="128" x2="252" y2="182" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-vio)"/>
  <text x="260" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7c3aed">w.Write(p[:n])</text>
  <rect x="184" y="184" width="136" height="32" rx="4" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="252" y="205" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">buf: "hello"</text>

  <!-- limit note -->
  <text x="392" y="170" font-size="11" opacity="0.6">после 5 байт N = 0,</text>
  <text x="392" y="186" font-size="11" opacity="0.6">дальше Read → 0, io.EOF</text>
</svg>
