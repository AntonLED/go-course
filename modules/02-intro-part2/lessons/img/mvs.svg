<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236" role="img" aria-label="Граф требований: A требует B v1.2 и C v1.2, B v1.2 требует D v1.3, C v1.2 требует D v1.4. Для D выбирается максимум из упомянутых, v1.4; v1.5 никто не требует, и она не выбирается" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Minimal Version Selection</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <!-- A -->
    <rect x="20" y="96" width="88" height="36" rx="4" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
    <text x="64" y="119" font-weight="600">A</text>
    <!-- B, C -->
    <rect x="168" y="36" width="96" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="216" y="59">B v1.2</text>
    <rect x="168" y="156" width="96" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="216" y="179">C v1.2</text>
    <!-- D versions -->
    <rect x="336" y="36" width="96" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="384" y="59">D v1.3</text>
    <rect x="336" y="96" width="96" height="36" rx="4" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="1.6"/>
    <text x="384" y="119" font-weight="600">D v1.4</text>
    <rect x="336" y="156" width="96" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5"/>
    <text x="384" y="179" opacity="0.5">D v1.5</text>
  </g>

  <!-- edges -->
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <path d="M108,108 L166,60" marker-end="url(#arr)"/>
    <path d="M108,120 L166,168" marker-end="url(#arr)"/>
    <path d="M264,54 H334" marker-end="url(#arr)"/>
    <path d="M264,168 L334,120" marker-end="url(#arr)"/>
  </g>
  <g font-size="11" opacity="0.6">
    <text x="384" y="24" text-anchor="middle">упомянута, но меньше</text>
    <text x="384" y="212" text-anchor="middle">вышла, но никто</text>
    <text x="384" y="226" text-anchor="middle">не требует</text>
  </g>
  <text x="64" y="150" text-anchor="middle" font-size="11" opacity="0.6">главный модуль</text>
  <text x="440" y="119" font-size="12" fill="#16a34a">← max(v1.3, v1.4)</text>

  <!-- build list -->
  <rect x="560" y="36" width="110" height="156" rx="4" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="615" y="58" text-anchor="middle" font-size="11" opacity="0.7">сборка</text>
  <line x1="560" y1="68" x2="670" y2="68" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="576" y="92">A</text>
    <text x="576" y="118">B v1.2</text>
    <text x="576" y="144">C v1.2</text>
    <text x="576" y="170" fill="#16a34a" font-weight="600">D v1.4</text>
  </g>
</svg>
