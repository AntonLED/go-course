<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 272" role="img" aria-label="errors.Is идёт по цепочке обёрток: на каждом звене сравнивает с целью через ==, пробует метод Is, затем вызывает Unwrap; на третьем звене ErrNotFound совпадает" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>errors.Is по цепочке Unwrap</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="20" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12"><tspan font-weight="600">errors.Is(err, ErrNotFound)</tspan></text>
  <text x="440" y="20" font-size="11" opacity="0.6">на каждом звене:</text>
  <text x="440" y="36" font-size="11" opacity="0.6">== цель? → метод Is? → Unwrap()</text>

  <!-- node 1 -->
  <rect x="20" y="48" width="380" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="32" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">err  <tspan font-weight="400" opacity="0.6">*fmt.wrapError</tspan></text>
  <text x="32" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">"profile: find user 42: not found"</text>
  <text x="440" y="77" font-size="12" fill="#d97706">≠ ErrNotFound, Is нет</text>

  <line x1="80" y1="96" x2="80" y2="126" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="92" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" opacity="0.7">Unwrap()</text>

  <!-- node 2 -->
  <rect x="20" y="128" width="380" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="32" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.6">*fmt.wrapError</text>
  <text x="32" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">"find user 42: not found"</text>
  <text x="440" y="157" font-size="12" fill="#d97706">≠ ErrNotFound, Is нет</text>

  <line x1="80" y1="176" x2="80" y2="206" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="92" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" opacity="0.7">Unwrap()</text>

  <!-- node 3 -->
  <rect x="20" y="208" width="380" height="48" rx="4" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.2"/>
  <text x="32" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">ErrNotFound  <tspan font-weight="400" opacity="0.6">*errors.errorString</tspan></text>
  <text x="32" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">"not found"</text>
  <text x="440" y="237" font-size="12" fill="#16a34a" font-weight="600">== ErrNotFound → true</text>

  <g stroke="currentColor" stroke-width="1" opacity="0.35">
    <line x1="400" y1="72" x2="432" y2="72"/><line x1="400" y1="152" x2="432" y2="152"/><line x1="400" y1="232" x2="432" y2="232"/>
  </g>
</svg>
