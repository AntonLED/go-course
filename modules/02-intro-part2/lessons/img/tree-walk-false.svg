<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 278" role="img" aria-label="Обход BST по возрастанию с break на 3: yield(1) и yield(2) возвращают true, yield(3) — false; false пробрасывается вверх через walk(3), walk(2), walk(4), и узлы 4, 5, 6, 7 не посещаются" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Проброс false в рекурсивном обходе</title>
  <defs>
    <marker id="arr-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.7"><text x="20" y="18">seq := func(yield func(int) bool) { root.walk(yield) }</text><text x="20" y="36">for v := range seq { if v == 3 { break } }</text></g>
  <g transform="translate(0,20)">

  <!-- edges -->
  <g stroke="currentColor" stroke-width="1.2" opacity="0.5">
    <line x1="228" y1="78" x2="152" y2="130"/>
    <line x1="130" y1="160" x2="100" y2="202"/>
    <line x1="150" y1="160" x2="180" y2="202"/>
  </g>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.25" stroke-dasharray="3 3">
    <line x1="252" y1="78" x2="328" y2="130"/>
    <line x1="330" y1="160" x2="300" y2="202"/>
    <line x1="350" y1="160" x2="380" y2="202"/>
  </g>

  <!-- nodes -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">
    <circle cx="240" cy="64" r="18" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5"/>
    <text x="240" y="69" opacity="0.5">4</text>
    <circle cx="140" cy="144" r="18" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="1.4"/>
    <text x="140" y="149">2</text>
    <circle cx="340" cy="144" r="18" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5"/>
    <text x="340" y="149" opacity="0.5">6</text>
    <circle cx="90" cy="218" r="18" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="1.4"/>
    <text x="90" y="223">1</text>
    <circle cx="190" cy="218" r="18" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-width="1.4"/>
    <text x="190" y="223">3</text>
    <circle cx="290" cy="218" r="18" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5"/>
    <text x="290" y="223" opacity="0.5">5</text>
    <circle cx="390" cy="218" r="18" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5"/>
    <text x="390" y="223" opacity="0.5">7</text>
  </g>

  <!-- false propagation -->
  <path d="M206,206 C226,186 196,160 162,148" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr-red)"/>
  <path d="M150,126 C162,96 196,72 220,66" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr-red)"/>
  <text x="216" y="176" font-size="11" fill="#dc2626">false</text>
  <text x="170" y="96" font-size="11" fill="#dc2626" text-anchor="end">false</text>
  <text x="340" y="96" font-size="11" opacity="0.6" text-anchor="middle">yield не вызван</text>

  <!-- log -->
  <line x1="448" y1="40" x2="448" y2="244" stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="464" y="52">yield(1) <tspan fill="#16a34a">→ true</tspan></text>
    <text x="464" y="76">yield(2) <tspan fill="#16a34a">→ true</tspan></text>
    <text x="464" y="100">yield(3) <tspan fill="#dc2626" font-weight="600">→ false</tspan></text>
    <text x="464" y="136">walk(3) <tspan fill="#dc2626">→ false</tspan></text>
    <text x="464" y="160">walk(2) <tspan fill="#dc2626">→ false</tspan></text>
    <text x="464" y="184">walk(4) <tspan fill="#dc2626">→ false</tspan></text>
  </g>
  <text x="464" y="216" font-size="11" opacity="0.7"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">&amp;&amp;</tspan> обрывает цепочку:</text>
  <text x="464" y="232" font-size="11" opacity="0.7">правое поддерево не трогаем</text>
  </g>
</svg>
