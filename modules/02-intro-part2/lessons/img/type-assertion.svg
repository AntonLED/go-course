<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 256" role="img" aria-label="Проверка на конкретный тип сравнивает itab._type с описанием *Circle; проверка на интерфейс ищет itab для пары (Scaler, *Circle) в кэше или строит его по методам типа" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Как работает type assertion</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- s -->
  <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12"><tspan font-weight="600">s</tspan><tspan opacity="0.6"> = &amp;Circle{R: 1}</tspan></text>
  <rect x="20" y="40" width="180" height="32" rx="4" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <line x1="110" y1="40" x2="110" y2="72" stroke="#0891b2" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="65" y="61">tab</text><text x="155" y="61">data</text>
  </g>
  <line x1="65" y1="72" x2="65" y2="110" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <g fill="none" stroke="#0891b2" stroke-width="1.2">
    <rect x="20" y="112" width="180" height="96" rx="4"/>
    <line x1="20" y1="144" x2="200" y2="144"/><line x1="20" y1="176" x2="200" y2="176"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="32" y="133">inter: Shape</text>
    <text x="32" y="165" font-weight="600" fill="#0891b2">_type: *Circle</text>
    <text x="32" y="197" opacity="0.7">hash, fun[…]</text>
  </g>
  <text x="20" y="230" font-size="11" opacity="0.6">itab (Shape, *Circle)</text>

  <!-- checks -->
  <line x1="200" y1="160" x2="236" y2="160" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <line x1="236" y1="44" x2="236" y2="220" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <line x1="236" y1="60" x2="258" y2="60" marker-end="url(#arr)"/>
    <line x1="236" y1="132" x2="258" y2="132" marker-end="url(#arr)"/>
    <line x1="236" y1="204" x2="258" y2="204" marker-end="url(#arr)"/>
  </g>

  <!-- 1: concrete -->
  <rect x="260" y="36" width="410" height="48" rx="4" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-width="1.2"/>
  <text x="272" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">s.(*Circle)</text>
  <text x="400" y="56" font-size="12">_type == *Circle? — одно сравнение</text>
  <text x="272" y="75" font-size="12" fill="#16a34a">да → c = (*Circle)(data)</text>

  <!-- 2: interface -->
  <rect x="260" y="108" width="410" height="48" rx="4" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-width="1.2"/>
  <text x="272" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">s.(Scaler)</text>
  <text x="400" y="128" font-size="12">itab(Scaler, *Circle): кэш или сборка</text>
  <text x="272" y="147" font-size="12" fill="#16a34a">есть Scale → новый iface{tab: этот itab, data}</text>

  <!-- 3: mismatch -->
  <rect x="260" y="180" width="410" height="48" rx="4" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-width="1.2"/>
  <text x="272" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">s.(Rect)</text>
  <text x="400" y="200" font-size="12">_type == Rect? — нет</text>
  <text x="272" y="219" font-size="12" fill="#dc2626">паника, а в форме v, ok — ok = false</text>
</svg>
