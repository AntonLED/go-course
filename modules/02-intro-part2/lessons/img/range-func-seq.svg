<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-label="Диаграмма последовательности для for v := range Count(5): итератор вызывает yield(0), yield(1), yield(2) — тело печатает и возвращает true; на yield(3) тело делает break, yield возвращает false, итератор выходит через return, и цикл завершается" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>range-over-func: кто кого вызывает</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <g transform="translate(24,0)">
  <!-- heads -->
  <rect x="100" y="12" width="160" height="36" rx="4" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <text x="180" y="35" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Count(5) — итератор</text>
  <rect x="400" y="12" width="160" height="36" rx="4" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="480" y="35" text-anchor="middle" font-size="12">тело цикла = <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">yield</tspan></text>

  <!-- lifelines -->
  <g stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.4">
    <line x1="180" y1="48" x2="180" y2="286"/>
    <line x1="480" y1="48" x2="480" y2="268"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <!-- iteration 0 -->
    <line x1="180" y1="72" x2="476" y2="72" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="196" y="66">yield(0)</text>
    <text x="492" y="76">Println(0)</text>
    <line x1="480" y1="92" x2="184" y2="92" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr-ok)"/>
    <text x="464" y="86" text-anchor="end" fill="#16a34a" font-size="11">true</text>
    <!-- iteration 1 -->
    <line x1="180" y1="124" x2="476" y2="124" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="196" y="118">yield(1)</text>
    <text x="492" y="128">Println(1)</text>
    <line x1="480" y1="144" x2="184" y2="144" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr-ok)"/>
    <text x="464" y="138" text-anchor="end" fill="#16a34a" font-size="11">true</text>
    <!-- iteration 2 -->
    <line x1="180" y1="176" x2="476" y2="176" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="196" y="170">yield(2)</text>
    <text x="492" y="180">Println(2)</text>
    <line x1="480" y1="196" x2="184" y2="196" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr-ok)"/>
    <text x="464" y="190" text-anchor="end" fill="#16a34a" font-size="11">true</text>
    <!-- iteration 3 -->
    <line x1="180" y1="228" x2="476" y2="228" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="196" y="222">yield(3)</text>
    <text x="492" y="232" fill="#dc2626" font-weight="600">break</text>
    <line x1="480" y1="248" x2="184" y2="248" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr-red)"/>
    <text x="464" y="242" text-anchor="end" fill="#dc2626" font-size="11">false</text>
    <!-- return -->
    <text x="164" y="272" text-anchor="end" fill="#dc2626">!yield → return</text>
  </g>

  <g font-size="11" opacity="0.6">
    <text x="164" y="76" text-anchor="end">i = 0</text>
    <text x="164" y="128" text-anchor="end">i = 1</text>
    <text x="164" y="180" text-anchor="end">i = 2</text>
    <text x="164" y="232" text-anchor="end">i = 3</text>
  </g>

  <rect x="100" y="288" width="400" height="30" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1" opacity="0.8"/>
  <text x="300" y="308" text-anchor="middle" font-size="12">Count(5)(…) вернулся → код после цикла</text>
  </g>
</svg>
