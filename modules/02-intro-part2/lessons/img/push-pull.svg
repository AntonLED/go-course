<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-label="Слева push: seq сам вызывает тело цикла через yield. Справа pull: iter.Pull запускает seq в корутине; каждый next переключает управление в корутину до следующего yield и возвращает значение; stop заставляет yield вернуть false, seq выходит и выполняет defer" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Push и pull итераторы</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- PUSH -->
  <text x="20" y="20" font-weight="600">push</text>
  <text x="20" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.7">for v := range seq</text>
  <rect x="20" y="60" width="180" height="40" rx="4" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <text x="110" y="85" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">seq(yield)</text>
  <rect x="20" y="164" width="180" height="40" rx="4" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="110" y="189" text-anchor="middle" font-size="12">тело цикла</text>
  <line x1="90" y1="100" x2="90" y2="162" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="84" y="136" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">yield(v)</text>
  <line x1="130" y1="164" x2="130" y2="102" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="138" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#16a34a">true</text>
  <text x="20" y="232" font-size="11" opacity="0.7">источник управляет циклом,</text>
  <text x="20" y="248" font-size="11" opacity="0.7">одна горутина, один стек</text>

  <line x1="232" y1="12" x2="232" y2="330" stroke="currentColor" stroke-width="1" opacity="0.25"/>

  <!-- PULL -->
  <text x="256" y="20" font-weight="600">pull</text>
  <text x="256" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.7">next, stop := iter.Pull(seq)</text>

  <rect x="256" y="52" width="160" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="336" y="73" text-anchor="middle" font-size="12">вызывающая горутина</text>
  <rect x="464" y="52" width="192" height="32" rx="4" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <text x="560" y="73" text-anchor="middle" font-size="12">корутина: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">seq(yield)</tspan></text>

  <g stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.4">
    <line x1="336" y1="84" x2="336" y2="312"/>
    <line x1="560" y1="84" x2="560" y2="292"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <!-- next 1 -->
    <line x1="336" y1="108" x2="556" y2="108" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="344" y="102">next()</text>
    <text x="568" y="128" fill="#0891b2">yield(v1)</text>
    <line x1="560" y1="132" x2="340" y2="132" stroke="#0891b2" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr-acc)"/>
    <text x="344" y="148" fill="#0891b2">v1, true</text>
    <!-- next 2 -->
    <line x1="336" y1="176" x2="556" y2="176" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="344" y="170">next()</text>
    <text x="568" y="196" fill="#0891b2">yield(v2)</text>
    <line x1="560" y1="200" x2="340" y2="200" stroke="#0891b2" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr-acc)"/>
    <text x="344" y="216" fill="#0891b2">v2, true</text>
    <!-- stop -->
    <line x1="336" y1="244" x2="556" y2="244" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-red)"/>
    <text x="344" y="238" fill="#dc2626">stop()</text>
    <text x="568" y="260" fill="#dc2626">yield → false</text>
    <text x="568" y="276" fill="#dc2626">return + defer</text>
    <line x1="560" y1="288" x2="340" y2="288" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)"/>
    <text x="344" y="304">корутина завершена</text>
  </g>
  <text x="344" y="328" font-size="11" opacity="0.6">прямая передача управления — дешевле канала</text>
</svg>
