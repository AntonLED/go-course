<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="Последовательность: горутина вызывает After(5m) и засыпает, тест ждёт этого через BlockUntil(1), затем Advance(1h) сдвигает время, фейк отправляет в канал, горутина просыпается; без BlockUntil Advance может случиться раньше After" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>FakeClock: тест управляет временем</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- участники -->
  <g text-anchor="middle">
    <rect x="40" y="12" width="120" height="30" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="100" y="32">тест</text>
    <rect x="272" y="12" width="136" height="30" rx="6" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
    <text x="340" y="32" fill="#0891b2" font-weight="600">FakeClock</text>
    <rect x="512" y="12" width="136" height="30" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="580" y="32">горутина кода</text>
  </g>
  <g stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.5">
    <line x1="100" y1="42" x2="100" y2="288"/>
    <line x1="340" y1="42" x2="340" y2="288"/>
    <line x1="580" y1="42" x2="580" y2="288"/>
  </g>

  <!-- сообщения -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <line x1="100" y1="66" x2="574" y2="66" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arr)"/>
    <text x="104" y="60">go Poll(…, 5*time.Minute, …)</text>

    <line x1="580" y1="96" x2="346" y2="96" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="460" y="90" text-anchor="middle">After(5 * time.Minute)</text>

    <line x1="100" y1="128" x2="334" y2="128" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="216" y="122" text-anchor="middle">BlockUntil(1)</text>
    <line x1="340" y1="148" x2="106" y2="148" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)" opacity="0.7"/>
    <text x="216" y="164" text-anchor="middle" font-size="11" opacity="0.7">ждущих ≥ 1 → вернулся</text>

    <line x1="100" y1="192" x2="334" y2="192" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
    <text x="216" y="186" text-anchor="middle" fill="#0891b2" font-weight="600">Advance(time.Hour)</text>

    <line x1="340" y1="236" x2="574" y2="236" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
    <text x="460" y="230" text-anchor="middle" fill="#0891b2">ch &lt;- now</text>

    <line x1="580" y1="276" x2="106" y2="276" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <text x="460" y="270" text-anchor="middle" font-size="11">результат по каналу</text><text x="220" y="270" text-anchor="middle" font-size="11">тест проверяет</text>
  </g>

  <!-- состояние фейка -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <rect x="346" y="102" width="116" height="20" rx="3" fill="#0891b2" fill-opacity="0.1"/>
    <text x="352" y="116">ждёт: now+5m</text>
    <rect x="192" y="200" width="140" height="20" rx="3" fill="#0891b2" fill-opacity="0.1"/>
    <text x="198" y="214">now += 1h ≥ дедлайн</text>
  </g>

  <!-- горутина спит -->
  <rect x="574" y="100" width="12" height="132" rx="2" fill="#d97706" fill-opacity="0.18" stroke="#d97706" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="596" y="160" font-size="11" fill="#d97706">&lt;-ch</text>
  <text x="596" y="174" font-size="11" fill="#d97706">спит</text>
  <rect x="574" y="240" width="12" height="30" rx="2" fill="#16a34a" fill-opacity="0.25" stroke="#16a34a" stroke-width="1"/>
  <text x="596" y="259" font-size="11" fill="#16a34a">работа</text>

  <!-- без BlockUntil -->
  <rect x="16" y="304" width="648" height="48" rx="6" fill="#dc2626" fill-opacity="0.08" stroke="#dc2626" stroke-width="1.2"/>
  <text x="28" y="324" font-size="12"><tspan fill="#dc2626" font-weight="600">Без BlockUntil:</tspan> Advance может выполниться раньше, чем горутина дошла до After.</text>
  <text x="28" y="342" font-size="12">Тогда дедлайн = уже сдвинутое now + 5m — таймер не сработает, тест зависнет.</text>
</svg>
