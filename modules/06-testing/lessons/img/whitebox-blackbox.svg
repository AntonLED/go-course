<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 358" role="img" aria-label="В каталоге foo два пакета: package foo с white-box тестами видит всё, package foo_test импортирует foo и видит только экспортированное, включая то, что открыл export_test.go; внешний тестовый пакет может импортировать пакет b, который сам импортирует foo" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>package foo против package foo_test</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="16" y="18" font-size="12" opacity="0.6">каталог foo/</text>

  <!-- package foo -->
  <rect x="16" y="28" width="336" height="224" rx="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="28" y="50" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">package foo</text>
  <text x="340" y="50" text-anchor="end" font-size="11" opacity="0.6">white-box: видит всё</text>

  <rect x="28" y="62" width="312" height="80" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="332" y="78" text-anchor="end" font-size="11" opacity="0.6">foo.go</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="40" y="84">func <tspan font-weight="600">Parse</tspan>(s string)</text>
    <text x="40" y="106">func parseInternal(s string)</text>
    <text x="40" y="128">type state struct{…}</text>
  </g>

  <rect x="28" y="152" width="312" height="34" rx="4" fill="#0891b2" fill-opacity="0.08" stroke="#0891b2" stroke-opacity="0.8"/>
  <text x="332" y="173" text-anchor="end" font-size="11" opacity="0.6">foo_test.go</text>
  <text x="40" y="173" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">parseInternal(…), state{}</text>

  <rect x="28" y="196" width="312" height="46" rx="4" fill="#7c3aed" fill-opacity="0.1" stroke="#7c3aed" stroke-opacity="0.9"/>
  <text x="332" y="210" text-anchor="end" font-size="11" opacity="0.6">export_test.go</text>
  <text x="40" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">var <tspan fill="#7c3aed" font-weight="600">ParseInternal</tspan> = parseInternal</text>

  <!-- package foo_test -->
  <rect x="408" y="28" width="256" height="224" rx="8" fill="#0891b2" fill-opacity="0.06" stroke="#0891b2" stroke-width="1.2"/>
  <text x="420" y="50" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">package foo_test</text>
  <text x="420" y="68" font-size="11" opacity="0.7">black-box: как пользователь</text>
  <text x="652" y="88" text-anchor="end" font-size="11" opacity="0.6">x_test.go</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="420" y="108">import ".../foo"</text>
    <text x="420" y="140">foo.Parse(s)</text>
    <text x="420" y="172">foo.ParseInternal(s)</text>
    <text x="420" y="206" opacity="0.6" text-decoration="line-through">foo.parseInternal</text>
    <text x="420" y="232" opacity="0.6" text-decoration="line-through">foo.state{}</text>
  </g>
  <g font-size="12" font-weight="600">
    <text x="640" y="140" fill="#16a34a">✓</text>
    <text x="640" y="172" fill="#16a34a">✓</text>
    <text x="640" y="206" fill="#dc2626">✗</text>
    <text x="640" y="232" fill="#dc2626">✗</text>
  </g>

  <!-- импорт -->
  <line x1="408" y1="104" x2="344" y2="104" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <text x="376" y="96" text-anchor="middle" font-size="11" fill="#0891b2">import</text>

  <!-- циклы импорта -->
  <text x="16" y="284" font-size="12" opacity="0.6">разрыв цикла: пакет b сам импортирует foo</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <rect x="16" y="300" width="120" height="30" rx="4" fill="none" stroke="currentColor"/>
    <text x="76" y="320">package foo</text>
    <rect x="272" y="300" width="120" height="30" rx="4" fill="none" stroke="currentColor"/>
    <text x="332" y="320">package b</text>
    <rect x="528" y="300" width="136" height="30" rx="4" fill="#0891b2" fill-opacity="0.08" stroke="#0891b2"/>
    <text x="596" y="320">package foo_test</text>
  </g>
  <line x1="272" y1="310" x2="140" y2="310" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="204" y="303" text-anchor="middle" font-size="11">import</text>
  <path d="M76,330 V348 H332 V334" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-bad)"/>
  <text x="204" y="344" text-anchor="middle" font-size="11" fill="#dc2626">тест в package foo: цикл ✗</text>
  <line x1="528" y1="315" x2="396" y2="315" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-ok)"/>
  <text x="462" y="308" text-anchor="middle" font-size="11" fill="#16a34a">import ✓</text>
</svg>
