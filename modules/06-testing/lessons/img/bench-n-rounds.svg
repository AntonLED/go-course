<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="Подбор b.N для операции 954 нс: вызовы с N = 1, 100, 10 000, 1 000 000 и 1 257 597; рост ограничен 100 разами за шаг, последний вызов длится 1,2 с и превышает benchtime 1 с" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Как фреймворк подбирает b.N</title>

  <!-- заголовки -->
  <g font-size="11" opacity="0.7">
    <text x="16" y="20">вызов BenchmarkJoin(b)</text>
    <text x="160" y="20">время с таймером (лог. шкала)</text>
    <text x="480" y="20">откуда этот N</text>
  </g>

  <!-- сетка -->
  <g stroke="currentColor" stroke-opacity="0.15">
    <line x1="200" y1="32" x2="200" y2="196"/><line x1="240" y1="32" x2="240" y2="196"/>
    <line x1="280" y1="32" x2="280" y2="196"/><line x1="320" y1="32" x2="320" y2="196"/>
    <line x1="360" y1="32" x2="360" y2="196"/><line x1="400" y1="32" x2="400" y2="196"/>
  </g>
  <line x1="440" y1="28" x2="440" y2="200" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="440" y="210" text-anchor="middle" font-size="10" fill="#d97706" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1s</text>
  <text x="440" y="226" text-anchor="middle" font-size="11" fill="#d97706">-benchtime (по умолчанию)</text>
  <line x1="160" y1="196" x2="440" y2="196" stroke="currentColor" stroke-opacity="0.6"/>
  <g font-size="10" opacity="0.7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="200" y="210">1µs</text><text x="240" y="210">10µs</text><text x="280" y="210">100µs</text>
    <text x="320" y="210">1ms</text><text x="360" y="210">10ms</text><text x="400" y="210">100ms</text>
  </g>

  <!-- строки -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="16" y="50">N = 1</text>
    <text x="16" y="82">N = 100</text>
    <text x="16" y="114">N = 10 000</text>
    <text x="16" y="146">N = 1 000 000</text>
    <text x="16" y="178" font-weight="600" fill="#0891b2">N = 1 257 597</text>
  </g>
  <!-- подготовка: вне таймера -->
  <g fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-opacity="0.5">
    <rect x="128" y="38" width="20" height="18" rx="2"/>
    <rect x="128" y="70" width="20" height="18" rx="2"/>
    <rect x="128" y="102" width="20" height="18" rx="2"/>
    <rect x="128" y="134" width="20" height="18" rx="2"/>
    <rect x="128" y="166" width="20" height="18" rx="2"/>
  </g>
  <!-- цикл: под таймером -->
  <g fill="#0891b2" fill-opacity="0.2" stroke="#0891b2">
    <rect x="160" y="38" width="39" height="18" rx="2"/>
    <rect x="160" y="70" width="119" height="18" rx="2"/>
    <rect x="160" y="102" width="199" height="18" rx="2"/>
    <rect x="160" y="134" width="279" height="18" rx="2"/>
    <rect x="160" y="166" width="283" height="18" rx="2" fill-opacity="0.35"/>
  </g>
  <g font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="206" y="51">954ns</text>
    <text x="286" y="83">95µs</text>
    <text x="366" y="115">9.5ms</text>
    <text x="428" y="147" text-anchor="end">0.954s &lt; 1s</text>
    <text x="428" y="179" text-anchor="end">1.2s ≥ 1s — стоп</text>
  </g>

  <!-- пояснение N -->
  <g font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="480" y="51">первый вызов</text>
    <text x="480" y="83">min(1.26e6, 100·1)</text>
    <text x="480" y="115">min(1.26e6, 100·100)</text>
    <text x="480" y="147">min(1.26e6, 100·10⁴)</text>
    <text x="480" y="179" fill="#0891b2">1e9·10⁶/0.954e9 ·1.2</text>
  </g>

  <!-- легенда и формула -->
  <g font-size="11">
    <rect x="16" y="238" width="16" height="12" rx="2" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-opacity="0.5"/>
    <text x="38" y="248">подготовка до ResetTimer — каждый вызов, не в замере</text>
    <rect x="16" y="256" width="16" height="12" rx="2" fill="#0891b2" fill-opacity="0.2" stroke="#0891b2"/>
    <text x="38" y="266">цикл for i &lt; b.N — в замере</text>
  </g>
  <text x="16" y="290" font-size="12">predictN: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">n = 1s·N/время ·1.2;  n ≤ 100·N;  n ≤ 1e9</tspan>  <tspan font-size="11" opacity="0.7">(N, время — прошлого вызова)</tspan></text>
  <text x="664" y="266" text-anchor="end" font-size="11" opacity="0.8">ns/op = 1.2s / 1 257 597 ≈ 954</text>
</svg>
