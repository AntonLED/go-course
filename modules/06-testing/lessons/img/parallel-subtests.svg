<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img" aria-label="Временная шкала: подтесты с t.Parallel встают на паузу, пока функция родителя не вернётся, затем идут одновременно; родитель завершается после всех подтестов и своих Cleanup" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>t.Run + t.Parallel во времени</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- подписи дорожек -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="end">
    <text x="100" y="60">TestX</text>
    <text x="100" y="108">TestX/a</text>
    <text x="100" y="148">TestX/b</text>
    <text x="100" y="188">TestX/c</text>
  </g>

  <!-- вехи -->
  <g stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.6">
    <line x1="352" y1="28" x2="352" y2="204"/>
    <line x1="584" y1="28" x2="584" y2="204"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="352" y="22">функция TestX вернулась</text>
    <text x="584" y="22">все подтесты готовы</text>
  </g>

  <!-- TestX: работает кусками, пока t.Run ждёт подтест до t.Parallel -->
  <g fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1">
    <rect x="112" y="44" width="32" height="24" rx="3"/>
    <rect x="168" y="44" width="40" height="24" rx="3"/>
    <rect x="232" y="44" width="40" height="24" rx="3"/>
    <rect x="296" y="44" width="56" height="24" rx="3"/>
  </g>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.6">
    <line x1="144" y1="56" x2="168" y2="56"/><line x1="208" y1="56" x2="232" y2="56"/><line x1="272" y1="56" x2="296" y2="56"/>
  </g>
  <rect x="352" y="44" width="232" height="24" rx="3" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="468" y="61" text-anchor="middle" font-size="12" fill="#d97706">ждёт подтесты</text>
  <rect x="584" y="44" width="56" height="24" rx="3" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1"/>
  <text x="612" y="61" text-anchor="middle" font-size="11" fill="#7c3aed">Cleanup</text>
  <text x="646" y="61" font-size="11" font-weight="600" fill="#16a34a">PASS</text>

  <!-- вызовы t.Run -->
  <line x1="152" y1="68" x2="152" y2="88" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- a -->
  <rect x="144" y="92" width="24" height="24" rx="3" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1"/>
  <rect x="168" y="92" width="184" height="24" rx="3" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="352" y="92" width="152" height="24" rx="3" fill="#0891b2" fill-opacity="0.18" stroke="#0891b2" stroke-width="1"/>
  <!-- b -->
  <line x1="216" y1="68" x2="216" y2="128" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="208" y="132" width="24" height="24" rx="3" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1"/>
  <rect x="232" y="132" width="120" height="24" rx="3" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="352" y="132" width="232" height="24" rx="3" fill="#0891b2" fill-opacity="0.18" stroke="#0891b2" stroke-width="1"/>
  <!-- c -->
  <line x1="280" y1="68" x2="280" y2="168" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="272" y="172" width="24" height="24" rx="3" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1"/>
  <rect x="296" y="172" width="56" height="24" rx="3" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="352" y="172" width="112" height="24" rx="3" fill="#0891b2" fill-opacity="0.18" stroke="#0891b2" stroke-width="1"/>

  <g font-size="11" fill="#0891b2" text-anchor="middle">
    <text x="428" y="109">check(t, a)</text>
    <text x="468" y="149">check(t, b)</text>
    <text x="408" y="189">check(t, c)</text>
  </g>

  <!-- ось времени -->
  <line x1="112" y1="216" x2="660" y2="216" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)" opacity="0.6"/>
  <text x="660" y="232" text-anchor="end" font-size="11" opacity="0.6">время</text>

  <!-- легенда -->
  <g font-size="11">
    <rect x="16" y="244" width="16" height="12" rx="2" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1"/>
    <text x="38" y="254">выполняется код теста</text>
    <line x1="224" y1="250" x2="240" y2="250" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
    <text x="246" y="254">t.Run ждёт, пока подтест дойдёт до t.Parallel()</text>
    <line x1="24" y1="266" x2="24" y2="280" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="38" y="278">t.Run(name, f)</text>
    <rect x="224" y="268" width="16" height="12" rx="2" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="246" y="278">пауза</text>
    <rect x="344" y="268" width="16" height="12" rx="2" fill="#0891b2" fill-opacity="0.18" stroke="#0891b2" stroke-width="1"/>
    <text x="366" y="278">вместе, не больше -parallel одновременно</text>
  </g>
</svg>
