<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 308" role="img" aria-label="Фаззинг: go test прогоняет только корпус; go test -fuzz мутирует входы, входы с новым покрытием добавляет в кэш, падающий вход минимизирует и записывает в testdata/fuzz, откуда он становится регрессионным тестом" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Цикл фаззинга</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- корпус -->
  <rect x="16" y="16" width="256" height="68" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="28" y="36" font-weight="600">seed-корпус</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="28" y="56">f.Add("key=value")</text>
    <text x="28" y="74">testdata/fuzz/FuzzParse/*</text>
  </g>

  <!-- обычный go test -->
  <line x1="272" y1="50" x2="332" y2="50" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="302" y="42" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">go test</text>
  <rect x="336" y="16" width="328" height="68" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.2"/>
  <text x="348" y="42">каждый вход — один вызов f.Fuzz</text>
  <text x="348" y="66" font-size="12" opacity="0.7">как обычный тест, без мутаций</text>

  <!-- режим -fuzz -->
  <text x="16" y="118" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0891b2">go test -fuzz=FuzzParse</text>
  <line x1="200" y1="84" x2="200" y2="132" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>

  <rect x="120" y="136" width="152" height="48" rx="6" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <text x="196" y="157" text-anchor="middle">мутация входа</text>
  <text x="196" y="174" text-anchor="middle" font-size="11" opacity="0.7">воркеры, GOMAXPROCS</text>

  <line x1="272" y1="160" x2="308" y2="160" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="312" y="136" width="160" height="48" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="392" y="157" text-anchor="middle">вызов f.Fuzz(…)</text>
  <text x="392" y="174" text-anchor="middle" font-size="11" opacity="0.7">+ замер покрытия</text>

  <line x1="472" y1="160" x2="508" y2="160" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-ok)"/>
  <rect x="512" y="136" width="152" height="48" rx="6" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.2"/>
  <text x="588" y="157" text-anchor="middle">новое покрытие?</text>
  <text x="588" y="174" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity="0.8">→ $GOCACHE/fuzz</text>

  <!-- петля -->
  <path d="M588,184 V204 H196 V188" fill="none" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <text x="212" y="200" font-size="11" fill="#0891b2">в корпус, мутировать дальше</text>

  <!-- падение -->
  <path d="M440,184 V236 H476" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-bad)"/>
  <text x="432" y="232" text-anchor="end" font-size="11" fill="#dc2626">panic / t.Fatal</text>
  <rect x="480" y="212" width="184" height="48" rx="6" fill="#dc2626" fill-opacity="0.1" stroke="#dc2626" stroke-width="1.2"/>
  <text x="572" y="233" text-anchor="middle">минимизация входа</text>
  <text x="572" y="250" text-anchor="middle" font-size="11" opacity="0.7">затем фаззинг — стоп</text>
  <path d="M572,260 V284 H460" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-bad)"/>
  <rect x="16" y="268" width="440" height="32" rx="6" fill="#dc2626" fill-opacity="0.1" stroke="#dc2626" stroke-width="1.2"/>
  <text x="28" y="289" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">testdata/fuzz/FuzzParse/…</text>
  <text x="444" y="289" text-anchor="end" font-size="11" opacity="0.8">→ seed для go test (регрессия)</text>
</svg>
