<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236" role="img" aria-label="Один набор контрактных проверок вызывается из двух тестов: с фейком MemStore и с настоящим PostgresStore; второй пропускается под -short" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Контрактный тест на две реализации</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- два теста -->
  <rect x="16" y="16" width="272" height="56" rx="6" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="28" y="38" font-weight="600">TestMemStore</text>
    <text x="28" y="60">newStore → NewMem()</text>
  </g>
  <text x="276" y="38" text-anchor="end" font-size="11" opacity="0.7">фейк, всегда</text>

  <rect x="392" y="16" width="272" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="404" y="38" font-weight="600">TestPostgresStore</text>
    <text x="404" y="60">newStore → newPG</text>
  </g>
  <text x="652" y="38" text-anchor="end" font-size="11" opacity="0.7">настоящая БД</text>

  <!-- вызовы -->
  <path d="M152,72 V92 H296 V108" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M528,72 V92 H384 V108" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="600" y1="72" x2="600" y2="108" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-warn)"/>
  <rect x="544" y="112" width="120" height="32" rx="6" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="604" y="133" text-anchor="middle" font-size="12"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">-short</tspan> → SKIP</text>

  <!-- контракт -->
  <rect x="160" y="112" width="360" height="112" rx="8" fill="#0891b2" fill-opacity="0.1" stroke="#0891b2" stroke-width="1.4"/>
  <text x="340" y="134" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0891b2">testStoreContract(t, newStore)</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="180" y="160">t.Run("GetMissing") → ErrNotFound</text>
    <text x="180" y="182">t.Run("PutThenGet") → то же значение</text>
    <text x="180" y="204">t.Run(…)</text>
  </g>
  <text x="508" y="214" text-anchor="end" font-size="11" opacity="0.7">одни проверки для всех</text>

  <text x="16" y="160" font-size="11" opacity="0.7">если фейк</text>
  <text x="16" y="176" font-size="11" opacity="0.7">разошёлся с БД —</text>
  <text x="16" y="192" font-size="11" opacity="0.7">упадёт один из двух</text>
</svg>
