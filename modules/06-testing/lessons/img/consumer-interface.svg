<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" role="img" aria-label="Интерфейс UserStore объявлен в пакете service; Service хранит поле этого типа; PGStore из пакета postgres и fakeStore из теста реализуют его неявно, ничего не зная о service" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Интерфейс у потребителя</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="none" stroke="#0891b2" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- package service -->
  <rect x="136" y="16" width="408" height="120" rx="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="148" y="36" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">package service</text>
  <text x="532" y="36" text-anchor="end" font-size="11" opacity="0.6">потребитель</text>

  <rect x="148" y="48" width="208" height="76" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="160" y="68">type Service struct</text>
    <text x="172" y="90">store <tspan fill="#0891b2">UserStore</tspan></text>
    <text x="172" y="112">clock func() time.Time</text>
  </g>

  <rect x="400" y="48" width="132" height="76" rx="4" fill="#0891b2" fill-opacity="0.14" stroke="#0891b2" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="412" y="68" font-size="11" opacity="0.7">interface</text>
    <text x="412" y="88" font-weight="600" fill="#0891b2">UserStore</text>
    <text x="412" y="110">Get(ctx, id)</text>
  </g>
  <line x1="296" y1="86" x2="396" y2="86" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- package postgres -->
  <rect x="16" y="196" width="264" height="112" rx="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="28" y="216" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">package postgres</text>
  <text x="268" y="216" text-anchor="end" font-size="11" opacity="0.6">поставщик</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="28" y="240">type PGStore struct{ db }</text>
    <text x="40" y="260" fill="#0891b2">Get</text>
    <text x="72" y="260" opacity="0.6">Put  Delete  List</text>
    <text x="40" y="280" opacity="0.6">Migrate  Close  …</text>
  </g>
  <text x="28" y="300" font-size="11" opacity="0.6">про service ничего не знает</text>

  <!-- test -->
  <rect x="400" y="196" width="264" height="112" rx="8" fill="#16a34a" fill-opacity="0.08" stroke="#16a34a" stroke-width="1.2"/>
  <text x="412" y="216" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">service_test.go</text>
  <text x="652" y="216" text-anchor="end" font-size="11" opacity="0.6">тест</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="412" y="240">type fakeStore struct</text>
    <text x="424" y="260">users map[int64]User</text>
    <text x="424" y="280"><tspan fill="#0891b2">Get</tspan> — чтение из map</text>
  </g>
  <text x="412" y="300" font-size="11" opacity="0.6">без БД, микросекунды</text>

  <!-- реализует неявно -->
  <path d="M232,196 L420,128" fill="none" stroke="#0891b2" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#tri)"/>
  <path d="M500,196 L476,128" fill="none" stroke="#0891b2" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#tri)"/>
  <g font-size="11" fill="#0891b2">
    <text x="416" y="176" text-anchor="middle">реализуют неявно</text>
  </g>

  <!-- подстановка -->
  <g font-size="11" opacity="0.75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="16" y="164">main:</text>
    <text x="16" y="180">store = postgres.New(db)</text>
    <text x="664" y="164" text-anchor="end">тест:</text>
    <text x="664" y="180" text-anchor="end">store = &amp;fakeStore{…}</text>
  </g>
</svg>
