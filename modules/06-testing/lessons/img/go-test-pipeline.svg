<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="go test для каждого пакета: vet, сборка тестового бинаря, проверка кэша результатов; при промахе — запуск бинаря в каталоге пакета, успешный результат сохраняется в кэш" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Что делает go test с одним пакетом</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- каталог пакета -->
  <rect x="16" y="16" width="208" height="120" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="28" y="38" font-weight="600">каталог пакета foo</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="28" y="64">foo.go</text>
    <text x="28" y="88">foo_test.go</text>
    <text x="28" y="116">x_test.go</text>
  </g>
  <g font-size="11" opacity="0.6">
    <text x="212" y="88" text-anchor="end">package foo</text>
    <text x="212" y="116" text-anchor="end">package foo_test</text>
  </g>

  <!-- vet + сборка -->
  <rect x="256" y="16" width="176" height="36" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="344" y="39" text-anchor="middle">go vet (часть проверок)</text>
  <line x1="344" y1="52" x2="344" y2="68" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="256" y="72" width="176" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="344" y="93" text-anchor="middle">сборка <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">foo.test</tspan></text>
  <text x="344" y="111" text-anchor="middle" font-size="11" opacity="0.6">пакет + *_test.go</text>
  <text x="344" y="126" text-anchor="middle" font-size="11" opacity="0.6">+ сгенерированный main</text>
  <line x1="224" y1="76" x2="252" y2="76" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- кэш -->
  <rect x="456" y="16" width="208" height="120" rx="6" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <text x="468" y="38" font-weight="600" fill="#0891b2">результат в кэше?</text>
  <g font-size="12">
    <text x="468" y="60" opacity="0.7">ключ:</text>
    <text x="468" y="78">· хеш бинаря foo.test</text>
    <text x="468" y="96">· флаги запуска</text>
    <text x="468" y="114">· env и файлы,</text>
    <text x="477" y="128">прочитанные тестом</text>
  </g>
  <line x1="432" y1="104" x2="452" y2="104" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- да: из кэша -->
  <line x1="600" y1="136" x2="600" y2="180" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-ok)"/>
  <text x="608" y="162" font-size="12" fill="#16a34a">да</text>
  <rect x="496" y="184" width="168" height="52" rx="6" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.2"/>
  <text x="580" y="206" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ok foo (cached)</text>
  <text x="580" y="225" text-anchor="middle" font-size="11" opacity="0.7">вывод из кэша, без запуска</text>

  <!-- нет: запуск -->
  <path d="M472,136 V210 H436" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="480" y="162" font-size="12">нет</text>
  <rect x="256" y="184" width="176" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="344" y="206" text-anchor="middle">запуск <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">./foo.test</tspan></text>
  <text x="344" y="225" text-anchor="middle" font-size="11" opacity="0.6">cwd = каталог пакета</text>

  <!-- итоги -->
  <line x1="312" y1="236" x2="248" y2="260" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-ok)"/>
  <line x1="376" y1="236" x2="440" y2="260" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-bad)"/>
  <rect x="96" y="264" width="232" height="32" rx="6" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.2"/>
  <text x="212" y="285" text-anchor="middle" font-size="12"><tspan font-weight="600" fill="#16a34a">PASS</tspan> → ok, результат в кэш</text>
  <rect x="360" y="264" width="232" height="32" rx="6" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="1.2"/>
  <text x="476" y="285" text-anchor="middle" font-size="12"><tspan font-weight="600" fill="#dc2626">FAIL</tspan> → полный вывод, не в кэш</text>

  <!-- примечание -->
  <g font-size="11" opacity="0.7">
    <text x="16" y="172">кэш не используется:</text>
    <text x="16" y="190">· go test без аргументов</text>
    <text x="16" y="208">· -count=1 или другой</text>
    <text x="24" y="224">некэшируемый флаг</text>
  </g>
</svg>
