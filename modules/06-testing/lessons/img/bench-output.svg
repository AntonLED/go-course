<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 196" role="img" aria-label="Разбор строки результата бенчмарка: имя с суффиксом GOMAXPROCS, b.N последнего вызова, наносекунды на итерацию, байты и число аллокаций в куче на итерацию" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Строка результата бенчмарка</title>

  <rect x="16" y="56" width="648" height="36" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <text x="32" y="79">BenchmarkJoin-8</text>
    <text x="200" y="79">1234567</text>
    <text x="304" y="79" fill="#0891b2" font-weight="600">954.2 ns/op</text>
    <text x="440" y="79" fill="#7c3aed">896 B/op</text>
    <text x="544" y="79" fill="#7c3aed">1 allocs/op</text>
  </g>

  <!-- скобки сверху: поля 2 и 4 -->
  <g fill="none" stroke-width="1.2">
    <path d="M200,52 v-6 h55 v6" stroke="currentColor"/>
    <path d="M440,52 v-6 h63 v6" stroke="#7c3aed"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="228" y="22">b.N последнего вызова</text>
    <text x="228" y="37" opacity="0.7">(из раунда подбора)</text>
    <text x="472" y="22" fill="#7c3aed">байт в куче ÷ b.N</text>
    <text x="472" y="37" opacity="0.7">-benchmem / ReportAllocs</text>
  </g>

  <!-- скобки снизу: поля 1, 3, 5 -->
  <g fill="none" stroke-width="1.2">
    <path d="M32,96 v6 h117 v-6" stroke="currentColor"/>
    <path d="M304,96 v6 h86 v-6" stroke="#0891b2"/>
    <path d="M544,96 v6 h86 v-6" stroke="#7c3aed"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="90" y="120">имя-GOMAXPROCS</text>
    <text x="90" y="135" opacity="0.7">-cpu 1,4 → -1, -4</text>
    <text x="347" y="120" fill="#0891b2">время под таймером ÷ b.N</text>
    <text x="347" y="135" opacity="0.7">среднее, не медиана</text>
    <text x="587" y="120" fill="#7c3aed">аллокаций ÷ b.N</text>
    <text x="587" y="135" opacity="0.7">целое, округлено вниз</text>
  </g>

  <line x1="16" y1="156" x2="664" y2="156" stroke="currentColor" stroke-opacity="0.2"/>
  <text x="16" y="178" font-size="12">Память считается по <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">runtime.MemStats</tspan> только пока таймер включён — как и время.</text>
</svg>
