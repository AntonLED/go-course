<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262" role="img" aria-label="Порядок выполнения: defer — при возврате функции теста, затем параллельный подтест и его Cleanup, затем Cleanup родителя в обратном порядке регистрации" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Порядок defer и t.Cleanup</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- код -->
  <text x="16" y="20" font-size="12" opacity="0.6">порядок в коде</text>
  <rect x="16" y="30" width="360" height="222" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.35" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="28" y="54">func TestX(t *testing.T) {</text>
    <text x="57" y="78">defer log("defer")</text>
    <text x="57" y="102">t.Cleanup(func() { log("C1") })</text>
    <text x="57" y="126">t.Cleanup(func() { log("C2") })</text>
    <text x="57" y="150">t.Run("sub", func(t *testing.T) {</text>
    <text x="86" y="174">t.Parallel()</text>
    <text x="86" y="198">t.Cleanup(func() { log("S") })</text>
    <text x="57" y="222">})</text>
    <text x="28" y="244">}</text>
  </g>
  <!-- номера исполнения -->
  <g font-size="11" font-weight="600" text-anchor="middle">
    <circle cx="356" cy="74" r="9" fill="#0891b2" fill-opacity="0.18" stroke="#0891b2"/><text x="356" y="78" fill="#0891b2">1</text>
    <circle cx="356" cy="98" r="9" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed"/><text x="356" y="102" fill="#7c3aed">5</text>
    <circle cx="356" cy="122" r="9" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed"/><text x="356" y="126" fill="#7c3aed">4</text>
    <circle cx="356" cy="170" r="9" fill="currentColor" fill-opacity="0.12" stroke="currentColor"/><text x="356" y="174">2</text>
    <circle cx="356" cy="194" r="9" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed"/><text x="356" y="198" fill="#7c3aed">3</text>
  </g>

  <!-- порядок исполнения -->
  <text x="416" y="20" font-size="12" opacity="0.6">порядок выполнения</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <rect x="416" y="30" width="248" height="34" rx="6" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2"/>
    <text x="428" y="52"><tspan fill="#0891b2" font-weight="600">1</tspan>  defer</text>
    <rect x="416" y="76" width="248" height="34" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.6"/>
    <text x="428" y="98"><tspan font-weight="600">2</tspan>  тело sub</text>
    <rect x="416" y="122" width="248" height="34" rx="6" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed"/>
    <text x="428" y="144"><tspan fill="#7c3aed" font-weight="600">3</tspan>  S</text>
    <rect x="416" y="168" width="248" height="34" rx="6" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed"/>
    <text x="428" y="190"><tspan fill="#7c3aed" font-weight="600">4</tspan>  C2</text>
    <rect x="416" y="214" width="248" height="34" rx="6" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed"/>
    <text x="428" y="236"><tspan fill="#7c3aed" font-weight="600">5</tspan>  C1</text>
  </g>
  <g font-size="11" opacity="0.75" text-anchor="end">
    <text x="652" y="51">функция TestX вернулась</text>
    <text x="652" y="97">после t.Parallel()</text>
    <text x="652" y="143">Cleanup подтеста</text>
    <text x="652" y="189">Cleanup родителя</text>
    <text x="652" y="235">LIFO: последний — первым</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.6">
    <line x1="440" y1="64" x2="440" y2="75" marker-end="url(#arr)"/>
    <line x1="440" y1="110" x2="440" y2="121" marker-end="url(#arr)"/>
    <line x1="440" y1="156" x2="440" y2="167" marker-end="url(#arr)"/>
    <line x1="440" y1="202" x2="440" y2="213" marker-end="url(#arr)"/>
  </g>
</svg>
