<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 232" role="img" aria-label="Пять аллокаций во времени, три освобождены сборщиком мусора; alloc_space суммирует все выделения с запуска (8 МБ), inuse_space — только то, что было живо на последней сборке (2 МБ)" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>inuse_space против alloc_space</title>

  <!-- сборки мусора -->
  <g stroke="#d97706" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="208" y1="28" x2="208" y2="164"/>
    <line x1="320" y1="28" x2="320" y2="164"/>
    <line x1="424" y1="28" x2="424" y2="164"/>
  </g>
  <g font-size="11" fill="#d97706" text-anchor="middle">
    <text x="208" y="20">GC</text><text x="320" y="20">GC</text><text x="424" y="20">GC ← снимок</text>
  </g>

  <!-- объекты -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="16" y="47">A 2 MB</text>
    <text x="16" y="73">B 1 MB</text>
    <text x="16" y="99">C 1 MB</text>
    <text x="16" y="125">D 3 MB</text>
    <text x="16" y="151">E 1 MB</text>
  </g>
  <g fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.5">
    <rect x="88" y="34" width="120" height="18" rx="2"/>
    <rect x="120" y="60" width="200" height="18" rx="2"/>
    <rect x="232" y="112" width="88" height="18" rx="2"/>
  </g>
  <g fill="#0891b2" fill-opacity="0.22" stroke="#0891b2">
    <rect x="152" y="86" width="296" height="18" rx="2"/>
    <rect x="344" y="138" width="104" height="18" rx="2"/>
  </g>
  <g font-size="11" opacity="0.7">
    <text x="94" y="47">собран GC</text>
    <text x="126" y="73">собран GC</text>
    <text x="238" y="125">собран GC</text>
  </g>
  <g font-size="11" fill="#0891b2">
    <text x="158" y="99">жив</text>
    <text x="350" y="151">жив</text>
  </g>

  <!-- ось -->
  <line x1="88" y1="172" x2="456" y2="172" stroke="currentColor" stroke-opacity="0.6"/>
  <text x="456" y="188" text-anchor="end" font-size="11" opacity="0.6">время</text>

  <!-- счётчики -->
  <rect x="480" y="28" width="184" height="64" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="492" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">alloc_space = 8 MB</text>
  <text x="492" y="68" font-size="11" opacity="0.8">все выделения с запуска</text>
  <text x="492" y="83" font-size="11" opacity="0.8">→ давление на GC</text>

  <rect x="480" y="104" width="184" height="64" rx="6" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2"/>
  <text x="492" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0891b2">inuse_space = 2 MB</text>
  <text x="492" y="144" font-size="11" opacity="0.8">живое на последнем GC</text>
  <text x="492" y="159" font-size="11" opacity="0.8">→ утечки, объём памяти</text>

  <text x="16" y="212" font-size="11" opacity="0.8">Аллокации семплируются (в среднем раз на 512 КБ) и масштабируются до оценки полного объёма;</text>
  <text x="16" y="228" font-size="11" opacity="0.8">цифры — на момент последней сборки, поэтому перед WriteTo вызывают runtime.GC().</text>
</svg>
