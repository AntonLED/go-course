<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 268" role="img" aria-label="Без sink результат isPrime не используется: после инлайнинга вычисление можно выбросить, и бенчмарк меряет пустой цикл; с присваиванием в глобальную переменную sink вычисление остаётся" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Почему нужен sink</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <g font-weight="600" text-anchor="middle">
    <text x="172" y="20" fill="#dc2626">без sink</text>
    <text x="508" y="20" fill="#16a34a">с sink</text>
  </g>

  <!-- исходник -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <rect x="16" y="32" width="312" height="36" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.4"/>
    <text x="28" y="55">isPrime(1_000_003)</text>
    <rect x="352" y="32" width="312" height="36" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.4"/>
    <text x="364" y="55">sink = isPrime(1_000_003)</text>
  </g>

  <!-- инлайнинг -->
  <g stroke="currentColor" stroke-width="1.2">
    <line x1="172" y1="68" x2="172" y2="92" marker-end="url(#arr)"/>
    <line x1="508" y1="68" x2="508" y2="92" marker-end="url(#arr)"/>
  </g>
  <g font-size="11" opacity="0.7">
    <text x="180" y="84">инлайнинг</text>
    <text x="516" y="84">инлайнинг</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <rect x="16" y="96" width="312" height="36" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
    <text x="28" y="119">r := …тело isPrime…   <tspan fill="#dc2626">// r не нужен</tspan></text>
    <rect x="352" y="96" width="312" height="36" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
    <text x="364" y="119">r := …тело isPrime…; sink = r</text>
  </g>

  <!-- мёртвый код -->
  <g stroke="currentColor" stroke-width="1.2">
    <line x1="172" y1="132" x2="172" y2="156" marker-end="url(#arr)"/>
    <line x1="508" y1="132" x2="508" y2="156" marker-end="url(#arr)"/>
  </g>
  <g font-size="11" opacity="0.7">
    <text x="180" y="148">удаление мёртвого кода</text>
    <text x="516" y="148">запись в sink наблюдаема</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <rect x="16" y="160" width="312" height="36" rx="6" fill="#dc2626" fill-opacity="0.1" stroke="#dc2626"/>
    <text x="28" y="183">for i := 0; i &lt; b.N; i++ { }</text>
    <rect x="352" y="160" width="312" height="36" rx="6" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a"/>
    <text x="364" y="183">вычисление остаётся в цикле</text>
  </g>

  <!-- результат -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="28" y="224" fill="#dc2626" font-weight="600">0.25 ns/op</text>
    <text x="364" y="224" fill="#16a34a" font-weight="600">честные ns/op</text>
  </g>
  <g font-size="11" opacity="0.8">
    <text x="28" y="244">меряем пустой цикл (≈ такт на итерацию)</text>
    <text x="364" y="244">реальная стоимость isPrime</text>
    <text x="364" y="260" opacity="0.8"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">var sink bool</tspan> — на уровне пакета</text>
  </g>
</svg>
