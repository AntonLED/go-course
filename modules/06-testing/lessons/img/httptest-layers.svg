<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" role="img" aria-label="Какие слои HTTP реально работают: NewRecorder — только роутер и хендлер; NewServer — весь путь через TCP на localhost; фейковый RoundTripper — клиент без сети" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Три способа тестировать HTTP</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- заголовки колонок -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">
    <text x="264" y="24">NewRecorder</text>
    <text x="432" y="24">NewServer</text>
    <text x="600" y="24">RoundTripper</text>
  </g>
  <g font-size="11" opacity="0.7" text-anchor="middle">
    <text x="264" y="40">тест хендлера</text>
    <text x="432" y="40">тест клиента</text>
    <text x="600" y="40">тест клиента</text>
  </g>

  <!-- названия слоёв -->
  <g font-size="12" opacity="0.8">
    <text x="16" y="73">код клиента</text>
    <text x="16" y="109">http.Client</text>
    <text x="16" y="145">Transport</text>
    <text x="16" y="181">TCP 127.0.0.1:port</text>
    <text x="16" y="217">http.Server</text>
    <text x="16" y="253">ServeMux, {id}</text>
    <text x="16" y="289">handler</text>
  </g>

  <!-- пустые ячейки -->
  <g fill="none" stroke="currentColor" stroke-opacity="0.3" stroke-dasharray="3 3">
    <rect x="200" y="54" width="128" height="28" rx="4"/>
    <rect x="200" y="90" width="128" height="28" rx="4"/>
    <rect x="200" y="126" width="128" height="28" rx="4"/>
    <rect x="200" y="162" width="128" height="28" rx="4"/>
    <rect x="536" y="162" width="128" height="28" rx="4"/>
    <rect x="536" y="198" width="128" height="28" rx="4"/>
    <rect x="536" y="234" width="128" height="28" rx="4"/>
    <rect x="536" y="270" width="128" height="28" rx="4"/>
  </g>

  <!-- NewRecorder -->
  <g font-size="11" opacity="0.7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="264" y="180">без сети</text>
  </g>
  <rect x="200" y="234" width="128" height="28" rx="4" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2"/>
  <rect x="200" y="270" width="128" height="28" rx="4" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2"/>
  <g font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="264" y="252">mux</text>
    <text x="264" y="288">NewHandler(fake)</text>
    <text x="264" y="216" fill="#0891b2" font-size="11">ServeHTTP(rec, r)</text>
  </g>
  <rect x="200" y="198" width="128" height="28" rx="4" fill="none" stroke="#0891b2" stroke-width="1.4"/>
  <line x1="264" y1="226" x2="264" y2="234" stroke="currentColor" stroke-width="1.2"/>
  <line x1="264" y1="262" x2="264" y2="270" stroke="currentColor" stroke-width="1.2"/>

  <!-- NewServer -->
  <g fill="#0891b2" fill-opacity="0.15" stroke="#0891b2">
    <rect x="368" y="54" width="128" height="28" rx="4"/>
    <rect x="368" y="90" width="128" height="28" rx="4"/>
    <rect x="368" y="126" width="128" height="28" rx="4"/>
    <rect x="368" y="162" width="128" height="28" rx="4"/>
    <rect x="368" y="198" width="128" height="28" rx="4"/>
  </g>
  <rect x="368" y="234" width="128" height="28" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.3" stroke-dasharray="3 3"/>
  <rect x="368" y="270" width="128" height="28" rx="4" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a"/>
  <g font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="432" y="73">client.Get(…)</text>
    <text x="432" y="109">http.Client</text>
    <text x="432" y="145">реальный</text>
    <text x="432" y="181">srv.URL</text>
    <text x="432" y="217">httptest.Server</text>
    <text x="432" y="252" font-size="11" opacity="0.7">по желанию</text>
    <text x="432" y="289">HandlerFunc</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2">
    <line x1="432" y1="82" x2="432" y2="90"/><line x1="432" y1="118" x2="432" y2="126"/><line x1="432" y1="154" x2="432" y2="162"/>
    <line x1="432" y1="190" x2="432" y2="198"/><line x1="432" y1="226" x2="432" y2="234"/><line x1="432" y1="262" x2="432" y2="270"/>
  </g>

  <!-- RoundTripper -->
  <g fill="#0891b2" fill-opacity="0.15" stroke="#0891b2">
    <rect x="536" y="54" width="128" height="28" rx="4"/>
    <rect x="536" y="90" width="128" height="28" rx="4"/>
  </g>
  <rect x="536" y="126" width="128" height="28" rx="4" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a"/>
  <g font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="600" y="73">client.Get(…)</text>
    <text x="600" y="109">http.Client</text>
    <text x="600" y="145">rtFunc — фейк</text>
    <text x="600" y="180" font-size="11" opacity="0.7">без сети</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2">
    <line x1="600" y1="82" x2="600" y2="90"/><line x1="600" y1="118" x2="600" y2="126"/>
  </g>

  <!-- что проверяет -->
  <line x1="16" y1="312" x2="664" y2="312" stroke="currentColor" stroke-opacity="0.3"/>
  <g font-size="11" text-anchor="middle">
    <text x="264" y="330">статус, заголовки, тело,</text>
    <text x="264" y="345">роутинг — за микросекунды</text>
    <text x="432" y="330">URL, заголовки, JSON,</text>
    <text x="432" y="345">таймауты, коды ошибок</text>
    <text x="600" y="330">сетевые ошибки,</text>
    <text x="600" y="345">закрытие тела ответа</text>
  </g>
  <text x="16" y="336" font-size="12" opacity="0.8">проверяем</text>
</svg>
