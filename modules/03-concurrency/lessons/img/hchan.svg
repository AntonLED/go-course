<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-label="Устройство канала runtime.hchan на примере make(chan int, 4) в заполненном состоянии: поля qcount, dataqsiz, buf, sendx, recvx, recvq, sendq, lock; buf указывает на кольцевой буфер из 4 слотов, recvx и sendx совпадают, в sendq ждут две горутины-отправителя в виде sudog" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Устройство канала: hchan</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/></marker>
    <marker id="arr-warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker>
  </defs>
  <text x="16" y="18" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">runtime.hchan</text>
  <text x="136" y="18" font-size="11" opacity="0.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make(chan int, 4), буфер полон</text>
  <rect x="16" y="28" width="216" height="264" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="28" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">qcount</text>
  <text x="124" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">4</text>
  <line x1="16" y1="50" x2="232" y2="50" stroke="currentColor" stroke-opacity="0.25"/>
  <text x="28" y="65" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">dataqsiz</text>
  <text x="124" y="65" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">4</text>
  <line x1="16" y1="72" x2="232" y2="72" stroke="currentColor" stroke-opacity="0.25"/>
  <text x="28" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">buf</text>
  <text x="124" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">●</text>
  <line x1="16" y1="94" x2="232" y2="94" stroke="currentColor" stroke-opacity="0.25"/>
  <text x="28" y="109" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">elemsize</text>
  <text x="124" y="109" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">8</text>
  <line x1="16" y1="116" x2="232" y2="116" stroke="currentColor" stroke-opacity="0.25"/>
  <text x="28" y="131" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">closed</text>
  <text x="124" y="131" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0</text>
  <line x1="16" y1="138" x2="232" y2="138" stroke="currentColor" stroke-opacity="0.25"/>
  <text x="28" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">elemtype</text>
  <text x="124" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.6">●  *_type</text>
  <line x1="16" y1="160" x2="232" y2="160" stroke="currentColor" stroke-opacity="0.25"/>
  <text x="28" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">sendx</text>
  <text x="124" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">2</text>
  <line x1="16" y1="182" x2="232" y2="182" stroke="currentColor" stroke-opacity="0.25"/>
  <text x="28" y="197" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">recvx</text>
  <text x="124" y="197" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">2</text>
  <line x1="16" y1="204" x2="232" y2="204" stroke="currentColor" stroke-opacity="0.25"/>
  <text x="28" y="219" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">recvq</text>
  <text x="124" y="219" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.6">пусто</text>
  <line x1="16" y1="226" x2="232" y2="226" stroke="currentColor" stroke-opacity="0.25"/>
  <text x="28" y="241" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#d97706">sendq</text>
  <text x="124" y="241" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">●</text>
  <line x1="16" y1="248" x2="232" y2="248" stroke="currentColor" stroke-opacity="0.25"/>
  <text x="28" y="263" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">lock</text>
  <text x="124" y="263" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.6">mutex</text>
  <line x1="16" y1="270" x2="232" y2="270" stroke="currentColor" stroke-opacity="0.25"/>
  <text x="28" y="285" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor" opacity="0.6">…</text>
  <text x="124" y="285" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.6">timer и др.</text>
  <text x="300" y="36" font-size="12" font-weight="600">кольцевой буфер (buf)</text>
  <rect x="300" y="76" width="68" height="40" fill="#0891b2" fill-opacity="0.1" stroke="currentColor" stroke-width="1.2"/>
  <text x="305" y="88" font-size="10" opacity="0.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">[0]</text>
  <text x="334.0" y="102" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">v3</text>
  <rect x="368" y="76" width="68" height="40" fill="#0891b2" fill-opacity="0.1" stroke="currentColor" stroke-width="1.2"/>
  <text x="373" y="88" font-size="10" opacity="0.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">[1]</text>
  <text x="402.0" y="102" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">v4</text>
  <rect x="436" y="76" width="68" height="40" fill="#0891b2" fill-opacity="0.22" stroke="currentColor" stroke-width="1.2"/>
  <text x="441" y="88" font-size="10" opacity="0.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">[2]</text>
  <text x="470.0" y="102" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">v1</text>
  <rect x="504" y="76" width="68" height="40" fill="#0891b2" fill-opacity="0.1" stroke="currentColor" stroke-width="1.2"/>
  <text x="509" y="88" font-size="10" opacity="0.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">[3]</text>
  <text x="538.0" y="102" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">v2</text>
  <path d="M538.0,74 Q436.0,42 338.0,72" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="582" y="92" font-size="11" opacity="0.7">[3] → [0]:</text>
  <text x="582" y="106" font-size="11" opacity="0.7">по кругу</text>
  <path d="M138,83.0 H268 V96 H297" fill="none" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <line x1="470.0" y1="138" x2="470.0" y2="119" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <text x="470.0" y="152" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0891b2">recvx = sendx = 2</text>
  <text x="470.0" y="168" text-anchor="middle" font-size="11" opacity="0.7">v1 — старейший; qcount == dataqsiz</text>
  <text x="300" y="206" font-size="12" font-weight="600">sendq: ждущие отправители</text>
  <rect x="300" y="216" width="120" height="52" rx="5" fill="#d97706" fill-opacity="0.1" stroke="#d97706" stroke-width="1.2"/>
  <text x="310" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" opacity="0.7">sudog</text>
  <text x="310" y="247" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">g:    G7</text>
  <text x="310" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">elem: &amp;v5</text>
  <rect x="452" y="216" width="120" height="52" rx="5" fill="#d97706" fill-opacity="0.1" stroke="#d97706" stroke-width="1.2"/>
  <text x="462" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" opacity="0.7">sudog</text>
  <text x="462" y="247" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">g:    G8</text>
  <text x="462" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">elem: &amp;v6</text>
  <line x1="420" y1="242.0" x2="449" y2="242.0" stroke="#d97706" stroke-width="1.3" marker-end="url(#arr-warn)"/>
  <text x="436" y="236.0" text-anchor="middle" font-size="10" opacity="0.7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">next</text>
  <path d="M138,237.0 H268 V242.0 H297" fill="none" stroke="#d97706" stroke-width="1.4" marker-end="url(#arr-warn)"/>
  <text x="300" y="290" font-size="11" opacity="0.8">приём: забрать v1 из buf[2], записать туда v5 от G7,</text>
  <text x="300" y="305" font-size="11" opacity="0.8">recvx = sendx = 3, разбудить G7</text>
</svg>