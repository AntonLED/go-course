<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 212" role="img" aria-label="Pipeline gen → sq → print: стадии-горутины связаны каналами, значения 1, 2, 3 превращаются в 1, 4, 9; закрытие выхода каскадно завершает range следующей стадии; ctx.Done() позволяет любой стадии выйти досрочно" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Pipeline</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
    <marker id="arr-vio" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ctx -->
  <line x1="80" y1="22" x2="600" y2="22" stroke="#0891b2" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="16" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">ctx</text>
  <g stroke="#0891b2" stroke-width="1.2">
    <line x1="92" y1="22" x2="92" y2="41" marker-end="url(#arr-acc)"/>
    <line x1="340" y1="22" x2="340" y2="41" marker-end="url(#arr-acc)"/>
    <line x1="588" y1="22" x2="588" y2="41" marker-end="url(#arr-acc)"/>
  </g>
  <text x="608" y="26" font-size="11" fill="#0891b2">Done()</text>

  <!-- стадии -->
  <g fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2">
    <rect x="16" y="44" width="152" height="72" rx="6"/>
    <rect x="264" y="44" width="152" height="72" rx="6"/>
    <rect x="512" y="44" width="152" height="72" rx="6"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="28" y="64" font-weight="600">gen</text>
    <text x="28" y="84">out &lt;- n</text>
    <text x="28" y="104" opacity="0.6" font-size="11">defer close(out)</text>
    <text x="276" y="64" font-weight="600">sq</text>
    <text x="276" y="84">out &lt;- n*n</text>
    <text x="276" y="104" opacity="0.6" font-size="11">defer close(out)</text>
    <text x="524" y="64" font-weight="600">print</text>
    <text x="524" y="84">range c</text>
    <text x="524" y="104" opacity="0.6" font-size="11">fmt.Println(v)</text>
  </g>

  <!-- каналы со значениями -->
  <line x1="168" y1="80" x2="261" y2="80" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="416" y1="80" x2="509" y2="80" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">
    <circle cx="190" cy="80" r="9" fill="#0891b2" fill-opacity="0.2" stroke="#0891b2"/><text x="190" y="84">3</text>
    <circle cx="212" cy="80" r="9" fill="#0891b2" fill-opacity="0.2" stroke="#0891b2"/><text x="212" y="84">2</text>
    <circle cx="234" cy="80" r="9" fill="#0891b2" fill-opacity="0.2" stroke="#0891b2"/><text x="234" y="84">1</text>
    <circle cx="438" cy="80" r="9" fill="#16a34a" fill-opacity="0.2" stroke="#16a34a"/><text x="438" y="84">9</text>
    <circle cx="460" cy="80" r="9" fill="#16a34a" fill-opacity="0.2" stroke="#16a34a"/><text x="460" y="84">4</text>
    <circle cx="482" cy="80" r="9" fill="#16a34a" fill-opacity="0.2" stroke="#16a34a"/><text x="482" y="84">1</text>
  </g>
  <g font-size="11" opacity="0.6" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="216" y="104">&lt;-chan int</text><text x="464" y="104">&lt;-chan int</text>
  </g>

  <!-- каскад закрытия -->
  <g fill="#7c3aed" font-size="12">
    <text x="92" y="144" text-anchor="middle">1. отправил всё →</text>
    <text x="92" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">close(out)</text>
    <text x="340" y="144" text-anchor="middle">2. range in кончился →</text>
    <text x="340" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">close(out)</text>
    <text x="588" y="144" text-anchor="middle">3. range c кончился,</text>
    <text x="588" y="160" text-anchor="middle">стадия завершена</text>
  </g>
  <g stroke="#7c3aed" stroke-width="1.4" fill="none">
    <line x1="168" y1="152" x2="248" y2="152" marker-end="url(#arr-vio)"/>
    <line x1="432" y1="152" x2="500" y2="152" marker-end="url(#arr-vio)"/>
  </g>
  <text x="340" y="196" text-anchor="middle" font-size="12" opacity="0.7">каждая стадия читает вход до закрытия или до отмены и закрывает свой выход</text>
</svg>
