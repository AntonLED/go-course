<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" role="img" aria-label="WaitGroup во времени: правильно — main трижды делает Add(1) и go, счётчик 1, 2, 3, горутины вызывают Done, счётчик падает до 0, и в этот момент Wait возвращается; ошибка — Add внутри горутины: Wait видит счётчик 0 и возвращается раньше, чем горутины начали работу" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>sync.WaitGroup во времени</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- ===== Панель 1 ===== -->
  <text x="16" y="16" font-weight="600" fill="#16a34a">Правильно: Add(1) до go</text>
  <g font-size="12" opacity="0.7" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="88" y="48">main</text><text x="88" y="80">g1</text><text x="88" y="112">g2</text><text x="88" y="144">g3</text>
  </g>
  <text x="88" y="180" text-anchor="end" font-size="12" opacity="0.7">счётчик</text>

  <!-- main -->
  <rect x="100" y="37" width="160" height="14" rx="3" fill="currentColor" fill-opacity="0.12"/>
  <text x="104" y="31" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity="0.8">Add(1); go … ×3</text>
  <rect x="260" y="37" width="300" height="14" rx="3" fill="#d97706" fill-opacity="0.2" stroke="#d97706"/>
  <text x="410" y="48" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Wait() — блок</text>
  <rect x="560" y="37" width="104" height="14" rx="3" fill="#16a34a" fill-opacity="0.2" stroke="#16a34a"/>
  <text x="612" y="31" text-anchor="middle" font-size="11" fill="#16a34a">Wait вернулся</text>

  <!-- спавны -->
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="150" y1="51" x2="150" y2="67" marker-end="url(#arr)"/>
    <line x1="190" y1="51" x2="190" y2="99" marker-end="url(#arr)"/>
    <line x1="230" y1="51" x2="230" y2="131" marker-end="url(#arr)"/>
  </g>

  <!-- горутины -->
  <g fill="#0891b2" fill-opacity="0.18" stroke="#0891b2">
    <rect x="150" y="69" width="210" height="14" rx="3"/>
    <rect x="190" y="101" width="370" height="14" rx="3"/>
    <rect x="230" y="133" width="210" height="14" rx="3"/>
  </g>
  <g font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="366" y="80">Done()</text><text x="446" y="144">Done()</text><text x="566" y="112">Done()</text>
  </g>
  <path d="M560,101 V56" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-ok)"/>

  <!-- счётчик -->
  <rect x="100" y="164" width="564" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
  <g stroke="currentColor" stroke-opacity="0.5">
    <line x1="150" y1="164" x2="150" y2="188"/><line x1="190" y1="164" x2="190" y2="188"/><line x1="230" y1="164" x2="230" y2="188"/>
    <line x1="360" y1="164" x2="360" y2="188"/><line x1="440" y1="164" x2="440" y2="188"/><line x1="560" y1="164" x2="560" y2="188"/>
  </g>
  <rect x="560" y="164" width="104" height="24" fill="#16a34a" fill-opacity="0.15"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="125" y="181">0</text><text x="170" y="181">1</text><text x="210" y="181">2</text><text x="295" y="181">3</text>
    <text x="400" y="181">2</text><text x="500" y="181">1</text><text x="612" y="181" fill="#16a34a" font-weight="600">0</text>
  </g>

  <line x1="16" y1="206" x2="664" y2="206" stroke="currentColor" stroke-opacity="0.2"/>

  <!-- ===== Панель 2 ===== -->
  <text x="16" y="230" font-weight="600" fill="#dc2626">Ошибка: Add(1) внутри горутины</text>
  <g font-size="12" opacity="0.7" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="88" y="262">main</text><text x="88" y="294">g1..g3</text>
  </g>
  <text x="88" y="330" text-anchor="end" font-size="12" opacity="0.7">счётчик</text>
  <rect x="100" y="251" width="160" height="14" rx="3" fill="currentColor" fill-opacity="0.12"/>
  <text x="104" y="245" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity="0.8">go … ×3</text>
  <line x1="260" y1="246" x2="260" y2="270" stroke="#dc2626" stroke-width="2"/>
  <text x="268" y="249" font-size="11" fill="#dc2626">Wait(): счётчик 0 → вернулся сразу, main идёт дальше</text>
  <rect x="264" y="251" width="400" height="14" rx="3" fill="currentColor" fill-opacity="0.06"/>
  <rect x="300" y="283" width="240" height="14" rx="3" fill="#0891b2" fill-opacity="0.18" stroke="#0891b2"/>
  <text x="306" y="294" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Add(1) … работа … Done()</text>
  <text x="548" y="294" font-size="11" fill="#dc2626">никто не ждёт</text>

  <rect x="100" y="314" width="564" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
  <g stroke="currentColor" stroke-opacity="0.5"><line x1="300" y1="314" x2="300" y2="338"/><line x1="540" y1="314" x2="540" y2="338"/></g>
  <rect x="100" y="314" width="200" height="24" fill="#dc2626" fill-opacity="0.12"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="200" y="331" fill="#dc2626" font-weight="600">0</text><text x="420" y="331">1…3</text><text x="602" y="331">0</text>
  </g>
</svg>
