<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 268" role="img" aria-label="singleflight: пять одновременных вызовов Do с ключом user:42; первый становится лидером и выполняет fn — один запрос в базу; остальные четыре находят call в map, увеличивают dups и ждут на wg.Wait; результат получают все пятеро, shared = true" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>singleflight: один вызов на ключ</title>
  <defs>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
    <marker id="arr-warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d97706"/>
    </marker>
  </defs>

  <text x="80" y="16" text-anchor="middle" font-size="12" opacity="0.7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Do("user:42", fn)</text>

  <!-- вызывающие -->
  <rect x="16" y="28" width="128" height="32" rx="5" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <g fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2">
    <rect x="16" y="72" width="128" height="32" rx="5"/>
    <rect x="16" y="116" width="128" height="32" rx="5"/>
    <rect x="16" y="160" width="128" height="32" rx="5"/>
    <rect x="16" y="204" width="128" height="32" rx="5"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="28" y="48">G1</text><text x="28" y="92">G2</text><text x="28" y="136">G3</text><text x="28" y="180">G4</text><text x="28" y="224">G5</text>
  </g>
  <text x="136" y="48" text-anchor="end" font-size="11" fill="#0891b2">лидер</text>
  <g font-size="11" fill="#d97706" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="136" y="92">wg.Wait()</text><text x="136" y="136">wg.Wait()</text><text x="136" y="180">wg.Wait()</text><text x="136" y="224">wg.Wait()</text>
  </g>

  <!-- стрелки -->
  <path d="M144,44 H196 V112 H241" fill="none" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <g fill="none" stroke="#d97706" stroke-width="1.3" stroke-dasharray="4 3">
    <path d="M144,88 H176"/><path d="M144,132 H176"/><path d="M144,176 H176"/><path d="M144,220 H176"/>
    <path d="M176,88 V220"/>
    <path d="M176,172 H241" marker-end="url(#arr-warn)"/>
  </g>
  <text x="180" y="166" font-size="10" fill="#d97706">dups++</text>

  <!-- Group -->
  <rect x="228" y="28" width="212" height="208" rx="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="240" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">singleflight.Group</text>
  <text x="240" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" opacity="0.7">mu sync.Mutex</text>
  <text x="240" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" opacity="0.7">m["user:42"] →</text>
  <rect x="244" y="98" width="184" height="96" rx="6" fill="#0891b2" fill-opacity="0.08" stroke="#0891b2" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <text x="256" y="116" font-weight="600">*call</text>
    <text x="256" y="136">wg   Add(1) лидером</text>
    <text x="256" y="156">dups 4</text>
    <text x="256" y="176">val, err ← fn()</text>
  </g>
  <text x="330" y="214" text-anchor="middle" font-size="11" opacity="0.7">затем wg.Done(), ключ удаляется</text>

  <!-- fn и БД -->
  <path d="M428,112 H477" fill="none" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <text x="446" y="104" font-size="10" fill="#0891b2">1 раз</text>
  <rect x="480" y="94" width="72" height="36" rx="6" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <text x="516" y="117" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">fn()</text>
  <path d="M552,112 H589" fill="none" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <path d="M596,100 v28 a28,8 0 0 0 56,0 v-28" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.2"/>
  <ellipse cx="624" cy="100" rx="28" ry="8" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.2"/>
  <text x="624" y="126" text-anchor="middle" font-size="12">БД</text>
  <text x="624" y="158" text-anchor="middle" font-size="11" opacity="0.8">1 запрос</text>
  <text x="624" y="172" text-anchor="middle" font-size="11" opacity="0.8">вместо 5</text>

  <text x="16" y="258" font-size="12" fill="#16a34a">Все пятеро получают один и тот же v, err (shared = true). Результат не кэшируется.</text>
</svg>
