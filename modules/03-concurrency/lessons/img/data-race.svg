<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" role="img" aria-label="Потерянное обновление: две горутины выполняют counter++ как load, add, store; обе читают 0, обе вычисляют 1, обе записывают 1 — после двух инкрементов counter равен 1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Data race: потерянное обновление</title>
  <defs>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/></marker>
    <marker id="arr-vio" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker>
    <marker id="arr-bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
  </defs>
  <text x="152" y="20" text-anchor="middle" font-weight="600" fill="#0891b2">G1: counter++</text>
  <text x="340" y="20" text-anchor="middle" font-weight="600">память</text>
  <text x="528" y="20" text-anchor="middle" font-weight="600" fill="#7c3aed">G2: counter++</text>
  <text x="16" y="20" font-size="11" opacity="0.6">шаг</text>
  <text x="24" y="53.0" text-anchor="middle" font-size="11" opacity="0.6">1</text>
  <rect x="40" y="32" width="624" height="34" fill="currentColor" fill-opacity="0.04"/>
  <text x="56" y="53.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">load  counter → r1 = 0</text>
  <rect x="316" y="37" width="48" height="24" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="340" y="53.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor" font-weight="400">0</text>
  <line x1="312" y1="49.0" x2="252" y2="49.0" stroke="#0891b2" stroke-width="1.3" marker-end="url(#arr-acc)"/>
  <text x="24" y="87.0" text-anchor="middle" font-size="11" opacity="0.6">2</text>
  <text x="424" y="87.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7c3aed">load  counter → r2 = 0</text>
  <rect x="316" y="71" width="48" height="24" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="340" y="87.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor" font-weight="400">0</text>
  <line x1="368" y1="83.0" x2="418" y2="83.0" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arr-vio)"/>
  <text x="24" y="121.0" text-anchor="middle" font-size="11" opacity="0.6">3</text>
  <rect x="40" y="100" width="624" height="34" fill="currentColor" fill-opacity="0.04"/>
  <text x="56" y="121.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">r1 = r1 + 1   → r1 = 1</text>
  <rect x="316" y="105" width="48" height="24" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="340" y="121.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor" font-weight="400">0</text>
  <text x="24" y="155.0" text-anchor="middle" font-size="11" opacity="0.6">4</text>
  <text x="424" y="155.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7c3aed">r2 = r2 + 1   → r2 = 1</text>
  <rect x="316" y="139" width="48" height="24" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="340" y="155.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor" font-weight="400">0</text>
  <text x="24" y="189.0" text-anchor="middle" font-size="11" opacity="0.6">5</text>
  <rect x="40" y="168" width="624" height="34" fill="currentColor" fill-opacity="0.04"/>
  <text x="56" y="189.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">store r1 → counter</text>
  <rect x="316" y="173" width="48" height="24" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="340" y="189.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor" font-weight="400">1</text>
  <line x1="200" y1="185.0" x2="312" y2="185.0" stroke="#0891b2" stroke-width="1.3" marker-end="url(#arr-acc)"/>
  <text x="24" y="223.0" text-anchor="middle" font-size="11" opacity="0.6">6</text>
  <text x="424" y="223.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#dc2626">store r2 → counter</text>
  <rect x="316" y="207" width="48" height="24" rx="3" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-opacity="1"/>
  <text x="340" y="223.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#dc2626" font-weight="600">1</text>
  <line x1="418" y1="219.0" x2="368" y2="219.0" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-bad)"/>
  <rect x="40" y="250" width="624" height="52" rx="6" fill="#dc2626" fill-opacity="0.08" stroke="#dc2626" stroke-width="1.2"/>
  <text x="56" y="272" font-size="13" fill="#dc2626" font-weight="600">Два инкремента, а counter = 1: обновление G1 потеряно</text>
  <text x="56" y="290" font-size="12" opacity="0.8">Итог зависит от чередования шагов; у 1000 горутин итог часто меньше 1000.</text>
</svg>