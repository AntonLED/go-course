<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 312" role="img" aria-label="Машина состояний горутины: _Grunnable, _Grunning, _Gwaiting, _Gsyscall, _Gdead и переходы между ними: execute, Gosched и вытеснение, gopark и goready, entersyscall и exitsyscall, goexit и newproc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Состояния горутины</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
    <marker id="arr-warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d97706"/>
    </marker>
    <marker id="arr-vio" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- состояния -->
  <g stroke-width="1.4">
    <rect x="56" y="120" width="128" height="40" rx="20" fill="#0891b2" fill-opacity="0.14" stroke="#0891b2"/>
    <rect x="376" y="120" width="128" height="40" rx="20" fill="#16a34a" fill-opacity="0.14" stroke="#16a34a"/>
    <rect x="216" y="20" width="128" height="40" rx="20" fill="#d97706" fill-opacity="0.14" stroke="#d97706"/>
    <rect x="216" y="230" width="128" height="40" rx="20" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed"/>
    <rect x="564" y="120" width="104" height="40" rx="20" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.6"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">
    <text x="120" y="145">_Grunnable</text>
    <text x="440" y="145">_Grunning</text>
    <text x="280" y="45">_Gwaiting</text>
    <text x="280" y="255">_Gsyscall</text>
    <text x="616" y="145">_Gdead</text>
  </g>
  <g font-size="11" opacity="0.6" text-anchor="middle">
    <text x="120" y="176">в runq</text>
    <text x="440" y="176">на M с P</text>
    <text x="616" y="176">в gFree</text>
  </g>

  <!-- runnable ⇄ running -->
  <line x1="186" y1="132" x2="373" y2="132" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">execute</text>
  <line x1="374" y1="150" x2="187" y2="150" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="280" y="166" text-anchor="middle" font-size="12">Gosched, вытеснение</text>

  <!-- running → waiting → runnable -->
  <line x1="400" y1="120" x2="336" y2="63" stroke="#d97706" stroke-width="1.4" marker-end="url(#arr-warn)"/>
  <text x="388" y="84" font-size="12" fill="#d97706"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">gopark</tspan>: канал, мьютекс,</text>
  <text x="394" y="100" font-size="12" fill="#d97706">sleep, сетевой I/O</text>
  <line x1="224" y1="60" x2="152" y2="117" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <text x="176" y="80" text-anchor="end" font-size="12" fill="#0891b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">goready</text>

  <!-- syscall -->
  <line x1="410" y1="160" x2="324" y2="227" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-vio)"/>
  <text x="356" y="200" text-anchor="end" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7c3aed">entersyscall</text>
  <path d="M346,250 H488 V164" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="496" y="206" font-size="12"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">exitsyscall</tspan>:</text>
  <text x="496" y="222" font-size="12">свой/свободный P есть</text>
  <line x1="232" y1="230" x2="154" y2="163" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="186" y="212" text-anchor="end" font-size="12">P нет →</text>
  <text x="186" y="228" text-anchor="end" font-size="12">global runq</text>

  <!-- dead -->
  <line x1="506" y1="140" x2="561" y2="140" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="534" y="132" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">goexit</text>
  <path d="M616,184 V296 H24 V140 H53" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="340" y="290" text-anchor="middle" font-size="12" opacity="0.8"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">go f()</tspan> → newproc: G берётся из gFree (или создаётся) и становится runnable</text>
</svg>
