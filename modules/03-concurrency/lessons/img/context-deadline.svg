<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 196" role="img" aria-label="Дедлайны на временной шкале: родитель WithTimeout 5 секунд; потомок с таймаутом 1 секунда истекает через 1 секунду; потомок с таймаутом в час всё равно отменяется через 5 секунд вместе с родителем" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Дедлайн потомка не позже родителя</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="end">
    <text x="164" y="36">ctx5s := WithTimeout(</text><text x="164" y="49">  bg, 5*time.Second)</text>
    <text x="164" y="84">WithTimeout(ctx5s,</text><text x="164" y="97">  time.Second)</text>
    <text x="164" y="132">WithTimeout(ctx5s,</text><text x="164" y="145">  time.Hour)</text>
  </g>

  <!-- родитель -->
  <rect x="176" y="30" width="400" height="20" rx="3" fill="#0891b2" fill-opacity="0.18" stroke="#0891b2"/>
  <text x="584" y="45" font-size="12" fill="#0891b2">5 с</text>
  <!-- 1s -->
  <rect x="176" y="78" width="80" height="20" rx="3" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed"/>
  <text x="264" y="93" font-size="12" fill="#7c3aed">1 с: раньше родителя — свой таймер</text>
  <!-- 1h -->
  <rect x="176" y="126" width="400" height="20" rx="3" fill="#d97706" fill-opacity="0.18" stroke="#d97706"/>
  <path d="M576,136 H664" stroke="#d97706" stroke-width="1.4" stroke-dasharray="3 4" opacity="0.6"/>
  <text x="584" y="154" font-size="11" opacity="0.7">1 ч: не наступит</text>

  <!-- линия дедлайна родителя -->
  <line x1="576" y1="22" x2="576" y2="160" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="376" y="140" text-anchor="middle" font-size="11">Deadline() = 5 с: отменится вместе с родителем</text>

  <!-- ось -->
  <line x1="176" y1="164" x2="668" y2="164" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/>
  <g font-size="11" opacity="0.7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="176" y="180">0</text><text x="256" y="180">1 с</text><text x="336" y="180">2 с</text><text x="416" y="180">3 с</text><text x="496" y="180">4 с</text><text x="576" y="180">5 с</text><text x="656" y="180">6 с</text>
  </g>
  <g stroke="currentColor" stroke-opacity="0.6"><line x1="176" y1="160" x2="176" y2="168"/><line x1="256" y1="160" x2="256" y2="168"/><line x1="336" y1="160" x2="336" y2="168"/><line x1="416" y1="160" x2="416" y2="168"/><line x1="496" y1="160" x2="496" y2="168"/><line x1="656" y1="160" x2="656" y2="168"/></g>
</svg>
