<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 264" role="img" aria-label="Fan-out и fan-in: два воркера sq читают один входной канал, каждое значение достаётся одному из них; merge запускает по пересылающей горутине на каждый вход, они пишут в общий out; отдельная горутина после wg.Wait закрывает out" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Fan-out / fan-in</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-vio" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <text x="148" y="16" text-anchor="middle" font-weight="600" fill="#0891b2">fan-out</text>
  <text x="484" y="16" text-anchor="middle" font-weight="600" fill="#16a34a">fan-in: merge</text>

  <!-- gen -->
  <rect x="16" y="92" width="72" height="40" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="52" y="117" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">gen</text>

  <!-- in -->
  <line x1="88" y1="112" x2="120" y2="112" stroke="#0891b2" stroke-width="1.4"/>
  <text x="104" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0891b2">in</text>
  <path d="M120,112 V56 H181" fill="none" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <path d="M120,112 V168 H181" fill="none" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>

  <!-- воркеры -->
  <g fill="#0891b2" fill-opacity="0.1" stroke="#0891b2" stroke-width="1.2">
    <rect x="184" y="36" width="96" height="40" rx="6"/>
    <rect x="184" y="148" width="96" height="40" rx="6"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="232" y="61">sq → c1</text><text x="232" y="173">sq → c2</text>
  </g>
  <text x="232" y="112" text-anchor="middle" font-size="11" opacity="0.7">каждое значение —</text>
  <text x="232" y="126" text-anchor="middle" font-size="11" opacity="0.7">одному воркеру</text>

  <!-- merge контейнер -->
  <rect x="320" y="24" width="248" height="232" rx="8" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="6 4"/>
  <line x1="280" y1="56" x2="349" y2="56" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="280" y1="168" x2="349" y2="168" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" opacity="0.7"><text x="292" y="50">c1</text><text x="292" y="162">c2</text></g>
  <g fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2">
    <rect x="352" y="36" width="136" height="40" rx="6"/>
    <rect x="352" y="148" width="136" height="40" rx="6"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <text x="362" y="53">range c1:</text><text x="362" y="68">out &lt;- v</text>
    <text x="362" y="165">range c2:</text><text x="362" y="180">out &lt;- v</text>
  </g>

  <!-- out -->
  <path d="M488,56 H528 V104" fill="none" stroke="#16a34a" stroke-width="1.4"/>
  <path d="M488,168 H528 V120" fill="none" stroke="#16a34a" stroke-width="1.4"/>
  <line x1="528" y1="112" x2="597" y2="112" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr-ok)"/>
  <path d="M528,104 V120" stroke="#16a34a" stroke-width="1.4"/>
  <text x="544" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#16a34a">out</text>
  <rect x="600" y="92" width="64" height="40" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="632" y="110" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">range</text>
  <text x="632" y="124" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">out</text>

  <!-- closer -->
  <rect x="352" y="212" width="176" height="32" rx="6" fill="#7c3aed" fill-opacity="0.1" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="440" y="232" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">wg.Wait(); close(out)</text>
  <g stroke="currentColor" stroke-width="1.1" stroke-dasharray="3 3" opacity="0.6" fill="none">
    <path d="M388,188 V209" marker-end="url(#arr)"/>
  </g>
  <text x="396" y="204" font-size="10" opacity="0.7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">wg.Done() в каждой</text>
  <path d="M528,228 H584 V117" fill="none" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arr-vio)"/>
  <text x="590" y="176" font-size="11" fill="#7c3aed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">close</text>
</svg>
