<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 292" role="img" aria-label="Рандеву на небуферизованном канале: отправитель G1 не находит получателя и паркуется в sendq; получатель G2 находит G1, копирует значение прямо со стека G1 на свой стек и будит G1; обе горутины продолжают работу" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Небуферизованный канал: рандеву</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/></marker>
    <marker id="arr-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
    <marker id="arr-bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
    <marker id="arr-warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker>
    <marker id="arr-vio" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker>
  </defs>
  <line x1="110" y1="46" x2="110" y2="248" stroke="currentColor" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 3"/>
  <rect x="66" y="16" width="88" height="30" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="110" y="29" text-anchor="middle" font-weight="600">G1</text>
  <text x="110" y="42" text-anchor="middle" font-size="11" opacity="0.6">отправитель</text>
  <line x1="340" y1="46" x2="340" y2="155" stroke="currentColor" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 3"/>
  <line x1="340" y1="170" x2="340" y2="191" stroke="currentColor" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 3"/>
  <line x1="340" y1="206" x2="340" y2="248" stroke="currentColor" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 3"/>
  <rect x="296" y="16" width="88" height="30" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="340" y="29" text-anchor="middle" font-weight="600">ch</text>
  <text x="340" y="42" text-anchor="middle" font-size="11" opacity="0.6">make(chan T)</text>
  <line x1="570" y1="46" x2="570" y2="248" stroke="currentColor" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 3"/>
  <rect x="529" y="16" width="82" height="30" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="570" y="29" text-anchor="middle" font-weight="600">G2</text>
  <text x="570" y="42" text-anchor="middle" font-size="11" opacity="0.6">получатель</text>
  <rect x="104" y="82" width="12" height="118" rx="3" fill="#d97706" fill-opacity="0.18" stroke="#d97706" stroke-width="1.2"/>
  <text x="96" y="128" text-anchor="end" font-size="11" fill="#d97706">паркуется</text>
  <text x="96" y="142" text-anchor="end" font-size="11" fill="#d97706">в sendq</text>
  <rect x="104" y="214" width="12" height="28" rx="3" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="564" y="214" width="12" height="28" rx="3" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="1.2"/>
  <text x="96" y="232" text-anchor="end" font-size="11" fill="#16a34a">дальше</text>
  <text x="584" y="232" font-size="11" fill="#16a34a">v получено</text>
  <text x="340" y="268" text-anchor="middle" font-size="11" opacity="0.7">Если первым пришёл получатель — симметрично: он ждёт в recvq, а отправитель</text>
  <text x="340" y="283" text-anchor="middle" font-size="11" opacity="0.7">пишет прямо в его стек (sendDirect). Буфер не участвует: cap = 0.</text>

  <line x1="114" y1="76" x2="337" y2="76" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-warn)"/>
  <text x="225" y="70" text-anchor="middle" font-size="12" fill="#d97706">ch &lt;- v: recvq пуст</text>
  <line x1="566" y1="132" x2="343" y2="132" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="455" y="126" text-anchor="middle" font-size="12" fill="currentColor">&lt;-ch: в sendq есть G1</text>
  <line x1="114" y1="172" x2="567" y2="172" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <text x="340" y="166" text-anchor="middle" font-size="12" fill="#0891b2">recvDirect: v копируется со стека G1 на стек G2</text>
  <line x1="566" y1="208" x2="113" y2="208" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-ok)"/>
  <text x="340" y="202" text-anchor="middle" font-size="12" fill="#16a34a">goready(G1)</text>
</svg>