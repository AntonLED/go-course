<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236" role="img" aria-label="Double submit cookie: страница bank.com читает CSRF-cookie и копирует её в заголовок, сервер сравнивает; evil.com не может прочитать cookie, поэтому заголовок не совпадает и запрос отклоняется" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Double submit cookie</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker>
  </defs>
  <g font-size="11" opacity="0.6">
    <text x="100" y="16" text-anchor="middle">кто отправляет</text>
    <text x="340" y="16" text-anchor="middle">что приходит на bank.com</text>
    <text x="580" y="16" text-anchor="middle">проверка сервера</text>
  </g>

  <!-- легитимный -->
  <rect x="20" y="28" width="160" height="72" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="100" y="52" text-anchor="middle" font-weight="600">bank.com (JS)</text>
  <text x="100" y="70" text-anchor="middle" font-size="11" opacity="0.7">читает cookie</text>
  <text x="100" y="85" text-anchor="middle" font-size="11" opacity="0.7">(она не HttpOnly)</text>
  <line x1="180" y1="64" x2="218" y2="64" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="220" y="28" width="240" height="72" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <text x="232" y="48">POST /transfer</text>
    <text x="232" y="68">Cookie: __Host-csrf=T7f…</text>
    <text x="232" y="88" fill="#16a34a">X-CSRF-Token: T7f…</text>
  </g>
  <line x1="460" y1="64" x2="498" y2="64" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="500" y="28" width="160" height="72" rx="4" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.2"/>
  <text x="580" y="56" text-anchor="middle" font-size="12">cookie == заголовок</text>
  <text x="580" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">пропустить</text>

  <!-- атака -->
  <rect x="20" y="124" width="160" height="72" rx="4" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="1.2"/>
  <text x="100" y="148" text-anchor="middle" font-weight="600" fill="#dc2626">evil.com</text>
  <text x="100" y="166" text-anchor="middle" font-size="11" opacity="0.7">чужую cookie</text>
  <text x="100" y="181" text-anchor="middle" font-size="11" opacity="0.7">прочитать не может</text>
  <line x1="180" y1="160" x2="218" y2="160" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="220" y="124" width="240" height="72" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <text x="232" y="144">POST /transfer</text>
    <text x="232" y="164">Cookie: __Host-csrf=T7f…</text>
    <text x="232" y="184" fill="#dc2626">X-CSRF-Token: ???</text>
  </g>
  <line x1="460" y1="160" x2="498" y2="160" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="500" y="124" width="160" height="72" rx="4" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="1.2"/>
  <text x="580" y="152" text-anchor="middle" font-size="12">не совпало</text>
  <text x="580" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">403</text>

  <text x="340" y="220" text-anchor="middle" font-size="11" opacity="0.7">cookie браузер прикладывает в обоих случаях — решает только копия в заголовке или поле формы</text>
</svg>
