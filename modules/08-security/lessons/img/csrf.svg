<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 304" role="img" aria-label="CSRF: страница evil.com отправляет форму на bank.com, браузер сам прикладывает cookie сессии, и банк выполняет перевод; ниже три защиты: SameSite, CSRF-токен, проверка Origin и Sec-Fetch-Site" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>CSRF-атака и защита</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker>
    <marker id="arr-r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
  </defs>

  <text x="90" y="20" text-anchor="middle" font-weight="600" fill="#dc2626">evil.com</text>
  <text x="340" y="20" text-anchor="middle" font-weight="600">Браузер жертвы</text>
  <text x="590" y="20" text-anchor="middle" font-weight="600">bank.com</text>
  <g stroke="currentColor" stroke-width="1" opacity="0.4">
    <line x1="90" y1="30" x2="90" y2="200"/><line x1="340" y1="66" x2="340" y2="200"/><line x1="590" y1="30" x2="590" y2="200"/>
  </g>
  <rect x="236" y="32" width="208" height="30" rx="4" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
  <text x="340" y="52" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">bank.com: session=abc</text>

  <text x="215" y="86" text-anchor="middle" font-size="11">1. открывает evil.com</text>
  <line x1="340" y1="94" x2="92" y2="94" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="215" y="118" text-anchor="middle" font-size="11">2. скрытая форма + submit()</text>
  <line x1="90" y1="126" x2="338" y2="126" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-r)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">
    <text x="465" y="140">3. POST /transfer to=evil</text>
    <text x="465" y="156" fill="#d97706">Cookie: session=abc</text>
  </g>
  <line x1="340" y1="164" x2="588" y2="164" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-r)"/>
  <text x="580" y="184" text-anchor="end" font-size="11" fill="#dc2626">сессия валидна → перевод выполнен</text>
  <text x="330" y="184" text-anchor="end" font-size="11" fill="#d97706">cookie браузер приложил сам</text>

  <line x1="20" y1="208" x2="660" y2="208" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <text x="20" y="226" font-size="11" opacity="0.6">что ломает шаг 3:</text>

  <g font-size="11">
    <rect x="20" y="234" width="204" height="62" rx="4" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.2"/>
    <text x="32" y="252" font-size="12" font-weight="600" fill="#16a34a">SameSite=Lax / Strict</text>
    <text x="32" y="270">кросс-сайтовый POST</text>
    <text x="32" y="285">уходит без cookie</text>

    <rect x="238" y="234" width="204" height="62" rx="4" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.2"/>
    <text x="250" y="252" font-size="12" font-weight="600" fill="#16a34a">CSRF-токен</text>
    <text x="250" y="270">в запросе нет токена —</text>
    <text x="250" y="285">evil.com его не знает</text>

    <rect x="456" y="234" width="204" height="62" rx="4" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.2"/>
    <text x="468" y="252" font-size="12" font-weight="600" fill="#16a34a">Origin / Sec-Fetch-Site</text>
    <text x="468" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Origin: https://evil.com</text>
    <text x="468" y="285">→ отказ для POST</text>
  </g>
</svg>
