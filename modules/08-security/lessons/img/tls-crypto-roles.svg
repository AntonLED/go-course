<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 0 694 448" role="img" aria-label="Роли криптографии в TLS 1.3: эфемерные ключи ECDHE дают общий секрет, HKDF выводит из него симметричные ключи для AEAD, а подпись ключом сертификата в CertificateVerify аутентифицирует сервер" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Асимметричная и симметричная криптография в TLS</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
  </defs>

  <text x="110" y="20" text-anchor="middle" font-weight="600">Клиент</text>
  <text x="570" y="20" text-anchor="middle" font-weight="600">Сервер</text>

  <!-- эфемерные пары -->
  <rect x="20" y="32" width="180" height="44" rx="4" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="110" y="50" text-anchor="middle" font-size="12">эфемерная пара ECDHE</text>
  <text x="110" y="67" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">priv a, pub A</text>
  <rect x="480" y="32" width="180" height="44" rx="4" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="570" y="50" text-anchor="middle" font-size="12">эфемерная пара ECDHE</text>
  <text x="570" y="67" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">priv b, pub B</text>

  <line x1="200" y1="46" x2="478" y2="46" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="340" y="39" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ClientHello: key_share = A</text>
  <line x1="480" y1="64" x2="202" y2="64" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="340" y="82" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ServerHello: key_share = B</text>

  <!-- общий секрет -->
  <path d="M110,76 V126 H216" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-p)"/>
  <path d="M570,76 V126 H464" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-p)"/>
  <rect x="220" y="104" width="240" height="44" rx="4" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="340" y="122" text-anchor="middle" font-size="12">общий секрет</text>
  <text x="340" y="139" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ECDH(a, B) = ECDH(b, A)</text>
  <text x="104" y="104" text-anchor="end" font-size="11" opacity="0.6">a, b стираются</text>
  <text x="104" y="118" text-anchor="end" font-size="11" opacity="0.6">после рукопожатия</text>

  <!-- HKDF -->
  <line x1="340" y1="148" x2="340" y2="170" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <rect x="220" y="172" width="240" height="36" rx="4" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <text x="340" y="195" text-anchor="middle" font-size="12">HKDF + хеш рукопожатия</text>

  <line x1="278" y1="208" x2="278" y2="226" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <line x1="402" y1="208" x2="402" y2="226" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <rect x="220" y="228" width="116" height="40" rx="4" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <text x="278" y="244" text-anchor="middle" font-size="12">ключи</text>
  <text x="278" y="259" text-anchor="middle" font-size="12">рукопожатия</text>
  <rect x="344" y="228" width="116" height="40" rx="4" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <text x="402" y="244" text-anchor="middle" font-size="12">ключи</text>
  <text x="402" y="259" text-anchor="middle" font-size="12">трафика</text>
  <text x="208" y="244" text-anchor="end" font-size="11" opacity="0.7">шифруют Certificate,</text>
  <text x="208" y="259" text-anchor="end" font-size="11" opacity="0.7">CertificateVerify, Finished</text>
  <text x="472" y="244" font-size="11" opacity="0.7">шифруют данные</text>
  <text x="472" y="259" font-size="11" opacity="0.7">приложения</text>

  <line x1="278" y1="268" x2="278" y2="290" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <line x1="402" y1="268" x2="402" y2="290" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <rect x="220" y="292" width="240" height="44" rx="4" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <text x="340" y="310" text-anchor="middle" font-size="12">AEAD-шифрование записей</text>
  <text x="340" y="327" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">AES-GCM · ChaCha20-Poly1305</text>

  <!-- аутентификация -->
  <line x1="20" y1="352" x2="660" y2="352" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <rect x="20" y="364" width="220" height="44" rx="4" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="130" y="382" text-anchor="middle" font-size="12">проверяет подпись</text>
  <text x="130" y="399" text-anchor="middle" font-size="12">открытым ключом из Certificate</text>
  <rect x="440" y="364" width="220" height="44" rx="4" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="550" y="382" text-anchor="middle" font-size="12">подписывает хеш рукопожатия</text>
  <text x="550" y="399" text-anchor="middle" font-size="12">закрытым ключом сертификата</text>
  <line x1="440" y1="386" x2="242" y2="386" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-p)"/>
  <text x="340" y="379" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">CertificateVerify</text>

  <!-- легенда -->
  <rect x="20" y="424" width="12" height="12" rx="2" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed"/>
  <text x="38" y="434" font-size="12">асимметрично: обмен ключами и подпись</text>
  <rect x="340" y="424" width="12" height="12" rx="2" fill="#0891b2" fill-opacity="0.18" stroke="#0891b2"/>
  <text x="358" y="434" font-size="12">симметрично: всё шифрование</text>
</svg>
