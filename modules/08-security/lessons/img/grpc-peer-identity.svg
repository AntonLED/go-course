<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336" role="img" aria-label="Как достать идентичность клиента mTLS в gRPC: ctx → peer.Peer → AuthInfo как credentials.TLSInfo → State.VerifiedChains[0][0] → URI SAN со SPIFFE ID или CommonName; PeerCertificates не проверены" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Идентичность клиента из peer</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker>
    <marker id="arr-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
  </defs>

  <!-- ctx -> peer -->
  <rect x="20" y="24" width="64" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="52" y="45" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ctx</text>
  <line x1="84" y1="40" x2="226" y2="40" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="155" y="33" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">peer.FromContext</text>

  <rect x="228" y="16" width="220" height="64" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="240" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">*peer.Peer</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <text x="252" y="52">Addr</text>
    <text x="252" y="70">AuthInfo</text>
  </g>
  <line x1="264" y1="74" x2="264" y2="110" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="274" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">.(credentials.TLSInfo)</text>

  <!-- TLSInfo -->
  <rect x="228" y="112" width="432" height="140" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="240" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">credentials.TLSInfo<tspan font-weight="400" opacity="0.7">.State (tls.ConnectionState)</tspan></text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <text x="252" y="154" fill="#dc2626">PeerCertificates</text>
    <text x="400" y="154" font-family="ui-sans-serif, system-ui, sans-serif" fill="#dc2626">как прислал клиент — не проверены</text>
    <text x="252" y="180" fill="#16a34a">VerifiedChains</text>
    <text x="400" y="180" font-family="ui-sans-serif, system-ui, sans-serif" fill="#16a34a">прошли проверку по ClientCAs</text>
    <text x="252" y="208" opacity="0.6">[0]</text>
    <text x="252" y="238" opacity="0.6">[1]…</text>
  </g>
  <g font-size="11" text-anchor="middle">
    <rect x="280" y="192" width="100" height="24" rx="3" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="1.2"/>
    <text x="330" y="208" font-weight="600">leaf  [0][0]</text>
    <rect x="384" y="192" width="100" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="434" y="208">intermediate</text>
    <rect x="488" y="192" width="100" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="538" y="208">root</text>
    <text x="384" y="238" text-anchor="start" opacity="0.5">другие пути, если есть</text>
  </g>

  <!-- ошибки слева -->
  <g font-size="11" fill="#dc2626">
    <text x="20" y="100">нет peer →</text>
    <text x="20" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Unauthenticated</text>
    <text x="20" y="176">не TLSInfo или</text>
    <text x="20" y="190">VerifiedChains пуст →</text>
    <text x="20" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Unauthenticated</text>
  </g>

  <!-- identity -->
  <path d="M330,216 V272" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-g)"/>
  <rect x="228" y="274" width="432" height="52" rx="4" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <text x="240" y="294">leaf.URIs: spiffe://shop.local/ns/prod/sa/orders</text>
    <text x="240" y="314" opacity="0.7">нет spiffe:// → leaf.Subject.CommonName</text>
  </g>
</svg>
