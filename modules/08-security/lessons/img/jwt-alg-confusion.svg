<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318" role="img" aria-label="Атака подмены алгоритма: атакующий подписывает токен HS256, используя публичный RSA-ключ сервера как HMAC-секрет; наивный сервер берёт alg из заголовка и принимает токен, правильный сервер разрешает только RS256 и отказывает" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Подмена алгоритма RS256 → HS256</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker>
    <marker id="arr-r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
  </defs>

  <!-- публичный ключ -->
  <rect x="400" y="20" width="260" height="52" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="412" y="41" font-size="12" font-weight="600">открытый ключ сервера (RS256)</text>
  <text x="412" y="60" font-size="11" opacity="0.7">опубликован в JWKS — есть у всех</text>
  <line x1="400" y1="46" x2="342" y2="46" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="371" y="38" text-anchor="middle" font-size="11" opacity="0.7">скачал</text>

  <!-- атакующий -->
  <rect x="20" y="12" width="320" height="104" rx="4" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-width="1.2"/>
  <text x="32" y="32" font-size="12" font-weight="600" fill="#dc2626">Атакующий подделывает токен</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <text x="32" y="54">header:  {"alg":"HS256"}</text>
    <text x="32" y="72">payload: {"sub":"admin"}</text>
    <text x="32" y="90">sig = HMAC-SHA256(</text>
    <text x="56" y="106"><tspan fill="#dc2626">key = байты открытого ключа</tspan>, …)</text>
  </g>

  <!-- токен к серверам -->
  <line x1="180" y1="116" x2="180" y2="164" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-r)"/>
  <path d="M180,140 H510 V164" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-r)"/>
  <text x="345" y="134" text-anchor="middle" font-size="11" fill="#dc2626">поддельный токен</text>

  <!-- наивный -->
  <rect x="20" y="166" width="300" height="144" rx="4" fill="none" stroke="#dc2626" stroke-width="1.2"/>
  <text x="32" y="186" font-size="12" font-weight="600" fill="#dc2626">наивный verify(token, key)</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <text x="32" y="210">alg := header["alg"] // "HS256"</text>
    <text x="32" y="228">key — тот же открытый ключ,</text>
    <text x="32" y="244">  но как []byte для HMAC</text>
    <text x="32" y="262">HMAC-SHA256(key, …) == sig</text>
  </g>
  <rect x="32" y="274" width="276" height="26" rx="3" fill="#dc2626" fill-opacity="0.14"/>
  <text x="44" y="292" font-size="12" fill="#dc2626" font-weight="600">подпись сошлась → вход как admin</text>

  <!-- правильный -->
  <rect x="360" y="166" width="300" height="144" rx="4" fill="none" stroke="#16a34a" stroke-width="1.2"/>
  <text x="372" y="186" font-size="12" font-weight="600" fill="#16a34a">сервер со списком алгоритмов</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <text x="372" y="210">WithValidMethods(["RS256"])</text>
    <text x="372" y="228">"HS256" не в списке</text>
    <text x="372" y="246">Keyfunc отдаёт *rsa.PublicKey —</text>
    <text x="372" y="262">  для HMAC он не подходит</text>
  </g>
  <rect x="372" y="274" width="276" height="26" rx="3" fill="#16a34a" fill-opacity="0.14"/>
  <text x="384" y="292" font-size="12" fill="#16a34a" font-weight="600">отказ</text>
</svg>
