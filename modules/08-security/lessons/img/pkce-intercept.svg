<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262" role="img" aria-label="Зачем PKCE: перехваченный код бесполезен без code_verifier, который не покидал клиента; AS сравнивает SHA-256 от verifier с challenge, сохранённым при /authorize" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>PKCE против перехвата кода</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker>
  </defs>

  <!-- что видно в URL -->
  <rect x="20" y="12" width="640" height="44" rx="4" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="32" y="30" font-size="12" fill="#d97706" font-weight="600">прошло через браузер и могло утечь</text>
  <text x="32" y="47" font-size="11"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">code</tspan>, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">state</tspan>, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">code_challenge</tspan> — через логи, Referer, чужое приложение с той же URL-схемой</text>

  <g font-size="11" opacity="0.6">
    <text x="110" y="80" text-anchor="middle">кто меняет код</text>
    <text x="340" y="80" text-anchor="middle">POST /token</text>
    <text x="570" y="80" text-anchor="middle">проверка на AS</text>
  </g>

  <!-- клиент -->
  <rect x="20" y="90" width="180" height="64" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="110" y="114" text-anchor="middle" font-weight="600">Клиент</text>
  <text x="110" y="134" text-anchor="middle" font-size="11" opacity="0.7">verifier хранит у себя</text>
  <line x1="200" y1="122" x2="228" y2="122" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="230" y="90" width="220" height="64" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <text x="242" y="114">code=SplxlOBe…</text>
    <text x="242" y="134" fill="#16a34a">code_verifier=dBjftJeZ…</text>
  </g>
  <line x1="450" y1="122" x2="478" y2="122" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="480" y="90" width="180" height="64" rx="4" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.2"/>
  <text x="570" y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">S256(verifier) ==</text>
  <text x="570" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">challenge</text>
  <text x="570" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">токены</text>

  <!-- атакующий -->
  <rect x="20" y="170" width="180" height="64" rx="4" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="1.2"/>
  <text x="110" y="194" text-anchor="middle" font-weight="600" fill="#dc2626">Атакующий</text>
  <text x="110" y="214" text-anchor="middle" font-size="11" opacity="0.7">знает code и challenge</text>
  <line x1="200" y1="202" x2="228" y2="202" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="230" y="170" width="220" height="64" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <text x="242" y="194">code=SplxlOBe…</text>
    <text x="242" y="214" fill="#dc2626">code_verifier=???</text>
  </g>
  <line x1="450" y1="202" x2="478" y2="202" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="480" y="170" width="180" height="64" rx="4" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="1.2"/>
  <text x="570" y="194" text-anchor="middle" font-size="11">хеш не совпал</text>
  <text x="570" y="214" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#dc2626">invalid_grant</text>

  <text x="340" y="254" text-anchor="middle" font-size="11" opacity="0.7">из challenge verifier не восстановить: SHA-256 необратим</text>
</svg>
