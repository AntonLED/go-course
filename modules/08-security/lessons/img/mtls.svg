<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-label="mTLS в TLS 1.3: сервер отправляет CertificateRequest и свой сертификат, клиент проверяет его по RootCAs и отвечает своим сертификатом, сервер проверяет его по ClientCAs; сверху — какие поля tls.Config за что отвечают" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>mTLS: кто чей сертификат проверяет</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker>
  </defs>

  <text x="135" y="18" text-anchor="middle" font-weight="600">Клиент</text>
  <text x="525" y="18" text-anchor="middle" font-weight="600">Сервер</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <rect x="20" y="28" width="230" height="88" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="32" y="48" opacity="0.7">tls.Config{</text>
    <text x="44" y="66" fill="#7c3aed">Certificates: clientCert</text>
    <text x="44" y="84" fill="#0891b2">RootCAs:      caPool</text>
    <text x="32" y="104" opacity="0.7">}</text>

    <rect x="372" y="28" width="296" height="88" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="384" y="44" opacity="0.7">tls.Config{</text>
    <text x="396" y="60" fill="#0891b2">Certificates: serverCert</text>
    <text x="396" y="76">ClientAuth: RequireAndVerifyClientCert</text>
    <text x="396" y="92" fill="#7c3aed">ClientCAs:    caPool</text>
    <text x="384" y="108" opacity="0.7">}</text>
  </g>

  <g stroke="currentColor" stroke-width="1" opacity="0.4">
    <line x1="135" y1="116" x2="135" y2="306"/><line x1="525" y1="116" x2="525" y2="306"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">
    <text x="330" y="140">ClientHello + key_share</text>
    <text x="330" y="170">ServerHello + key_share</text>
    <text x="330" y="185">{EncryptedExtensions, <tspan fill="#7c3aed">CertificateRequest</tspan>,</text>
    <text x="330" y="200"><tspan fill="#0891b2">Certificate, CertificateVerify</tspan>, Finished}</text>
    <text x="330" y="256"><tspan fill="#7c3aed">{Certificate, CertificateVerify</tspan>, Finished}</text>
  </g>
  <g stroke="currentColor" stroke-width="1.4">
    <line x1="135" y1="148" x2="523" y2="148" marker-end="url(#arr)"/>
    <line x1="525" y1="208" x2="137" y2="208" marker-end="url(#arr)"/>
    <line x1="135" y1="264" x2="523" y2="264" marker-end="url(#arr)"/>
  </g>

  <text x="145" y="228" font-size="11" fill="#0891b2">клиент проверяет цепочку сервера по RootCAs (+ имя)</text>
  <text x="515" y="284" text-anchor="end" font-size="11" fill="#7c3aed">сервер проверяет цепочку клиента по ClientCAs</text>
  <text x="515" y="300" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">→ r.TLS.VerifiedChains[0][0]</text>
</svg>
