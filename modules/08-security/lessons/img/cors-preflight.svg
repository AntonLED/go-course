<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 447" role="img" aria-label="CORS с preflight: браузер отправляет OPTIONS с Origin и Access-Control-Request-*, сервер отвечает разрешающими заголовками, затем браузер отправляет PUT и отдаёт ответ скрипту, только если Access-Control-Allow-Origin совпал" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>CORS: preflight и основной запрос</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker>
  </defs>
  <text x="96" y="18" text-anchor="middle" font-weight="600">Браузер</text>
  <text x="96" y="34" text-anchor="middle" font-size="11" opacity="0.6">страница app.example.com</text>
  <text x="600" y="18" text-anchor="middle" font-weight="600">api.example.com</text>
  <g stroke="currentColor" stroke-width="1" opacity="0.4"><line x1="96" y1="42" x2="96" y2="441"/><line x1="600" y1="26" x2="600" y2="441"/></g>
  <text x="116" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">fetch(url, {method: "PUT", credentials: "include"})</text>
  <text x="116" y="74" font-size="11" fill="#d97706">метод не GET/HEAD/POST → сначала preflight</text>
  <text x="116" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">OPTIONS /orders</text>
  <text x="116" y="115" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0891b2">Origin: https://app.example.com</text>
  <text x="116" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0891b2">Access-Control-Request-Method: PUT</text>
  <text x="116" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0891b2">Access-Control-Request-Headers: content-type</text>
  <line x1="96" y1="155" x2="598" y2="155" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="116" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">204 No Content</text>
  <text x="116" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0891b2">Access-Control-Allow-Origin: https://app.example.com</text>
  <text x="116" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0891b2">Access-Control-Allow-Methods: PUT</text>
  <text x="116" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0891b2">Access-Control-Allow-Headers: content-type</text>
  <text x="116" y="241" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0891b2">Access-Control-Allow-Credentials: true</text>
  <text x="116" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0891b2">Vary: Origin</text>
  <line x1="600" y1="266" x2="98" y2="266" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="116" y="284" font-size="11" fill="#16a34a">браузер: Origin совпал, PUT разрешён → шлёт настоящий запрос</text>
  <text x="116" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">PUT /orders   (+ Cookie)</text>
  <text x="116" y="325" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0891b2">Origin: https://app.example.com</text>
  <line x1="96" y1="335" x2="598" y2="335" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="116" y="361" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">200 OK</text>
  <text x="116" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0891b2">Access-Control-Allow-Origin: https://app.example.com</text>
  <text x="116" y="391" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0891b2">Access-Control-Allow-Credentials: true</text>
  <line x1="600" y1="401" x2="98" y2="401" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="116" y="419" font-size="11" fill="#16a34a">заголовки совпали → ответ отдаётся в JS</text>
  <text x="116" y="435" font-size="11" fill="#dc2626">иначе JS получит ошибку — но сервер запрос уже выполнил</text>
</svg>
