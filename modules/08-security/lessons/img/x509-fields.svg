<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 424" role="img" aria-label="Структура сертификата X.509: tbsCertificate с полями и расширениями, алгоритм подписи и подпись издателя над tbsCertificate; справа соответствующие поля x509.Certificate в Go" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Что внутри сертификата X.509</title>
  <defs>
    <marker id="arr-p" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect x="56" y="56" width="604" height="306" rx="4" fill="#0891b2" fill-opacity="0.05" stroke="#0891b2" stroke-width="1.2"/>
  <text x="652" y="70" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0891b2">tbsCertificate</text>
  <text x="68" y="20" font-size="11" opacity="0.6">поле (RFC 5280)</text>
  <text x="222" y="20" font-size="11" opacity="0.6">пример</text>
  <text x="392" y="20" font-size="11" opacity="0.6">поле x509.Certificate в Go</text>
  <rect x="48" y="30" width="620" height="388" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="60" y="47" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Certificate</text>
  <text x="68" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">version</text>
  <text x="222" y="90" font-size="11" opacity="0.75">v3</text>
  <text x="392" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Version</text>
  <text x="68" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">serialNumber</text>
  <text x="222" y="110" font-size="11" opacity="0.75">≥ 64 бит случайности</text>
  <text x="392" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">SerialNumber</text>
  <text x="68" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">signature</text>
  <text x="222" y="130" font-size="11" opacity="0.75">ecdsa-with-SHA256</text>
  <text x="392" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">SignatureAlgorithm</text>
  <text x="68" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">issuer</text>
  <text x="222" y="150" font-size="11" opacity="0.75">CN=Example Issuing CA</text>
  <text x="392" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Issuer</text>
  <text x="68" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">validity</text>
  <text x="222" y="170" font-size="11" opacity="0.75">notBefore … notAfter</text>
  <text x="392" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">NotBefore, NotAfter</text>
  <text x="68" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">subject</text>
  <text x="222" y="190" font-size="11" opacity="0.75">CN=api.example.com</text>
  <text x="392" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Subject</text>
  <text x="68" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">subjectPublicKeyInfo</text>
  <text x="222" y="210" font-size="11" opacity="0.75">EC P-256 + открытый ключ</text>
  <text x="392" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">PublicKey</text>
  <text x="68" y="230" font-size="11" opacity="0.6">extensions (v3):</text>
  <rect x="64" y="237" width="588" height="18" rx="3" fill="#0891b2" fill-opacity="0.14"/>
  <text x="80" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0891b2">subjectAltName</text>
  <text x="222" y="250" font-size="11" opacity="0.75">DNS:api.example.com</text>
  <text x="392" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">DNSNames, IPAddresses, URIs</text>
  <rect x="64" y="257" width="588" height="18" rx="3" fill="#0891b2" fill-opacity="0.14"/>
  <text x="80" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0891b2">basicConstraints</text>
  <text x="222" y="270" font-size="11" opacity="0.75">CA:FALSE</text>
  <text x="392" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">IsCA, MaxPathLen</text>
  <text x="80" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">keyUsage</text>
  <text x="222" y="290" font-size="11" opacity="0.75">digitalSignature</text>
  <text x="392" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">KeyUsage</text>
  <rect x="64" y="297" width="588" height="18" rx="3" fill="#0891b2" fill-opacity="0.14"/>
  <text x="80" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0891b2">extKeyUsage</text>
  <text x="222" y="310" font-size="11" opacity="0.75">serverAuth</text>
  <text x="392" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">ExtKeyUsage</text>
  <text x="80" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">AKI / SKI</text>
  <text x="222" y="330" font-size="11" opacity="0.75">идентификаторы ключей</text>
  <text x="392" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">AuthorityKeyId, SubjectKeyId</text>
  <text x="80" y="350" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">CRL DP / AIA</text>
  <text x="222" y="350" font-size="11" opacity="0.75">где проверить отзыв</text>
  <text x="392" y="350" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">CRLDistributionPoints, OCSPServer</text>
  <text x="68" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">signatureAlgorithm</text><text x="222" y="384" font-size="11" opacity="0.75">ecdsa-with-SHA256</text><text x="392" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">SignatureAlgorithm</text>
  <text x="68" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7c3aed">signatureValue</text><text x="222" y="404" font-size="11" opacity="0.75">подпись издателя</text><text x="392" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Signature</text>
  <path d="M64,400 H20 V209 H54" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-p)"/><text x="14" y="289" transform="rotate(-90 14 289)" font-size="11" fill="#7c3aed">ключ издателя подписывает DER(tbs)</text>
</svg>
