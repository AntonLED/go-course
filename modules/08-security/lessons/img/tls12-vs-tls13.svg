<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 308" role="img" aria-label="Сравнение рукопожатий: TLS 1.2 тратит два круга до отправки данных, TLS 1.3 — один; в TLS 1.3 всё после ServerHello зашифровано, включая сертификат" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>TLS 1.2 (2 RTT) и TLS 1.3 (1 RTT)</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- ===== TLS 1.2 ===== -->
  <text x="181" y="18" text-anchor="middle" font-weight="600">TLS 1.2 — 2 RTT до данных</text>
  <text x="56" y="42" text-anchor="middle" font-size="12" opacity="0.7">клиент</text>
  <text x="306" y="42" text-anchor="middle" font-size="12" opacity="0.7">сервер</text>
  <g stroke="currentColor" stroke-width="1" opacity="0.4">
    <line x1="56" y1="50" x2="56" y2="260"/><line x1="306" y1="50" x2="306" y2="260"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">
    <text x="181" y="70">ClientHello</text>
    <text x="181" y="100">ServerHello, Certificate,</text>
    <text x="181" y="115">ServerKeyExchange, ServerHelloDone</text>
    <text x="181" y="152">ClientKeyExchange,</text>
    <text x="181" y="167">ChangeCipherSpec, Finished</text>
    <text x="181" y="203">ChangeCipherSpec, Finished</text>
  </g>
  <g stroke="currentColor" stroke-width="1.4">
    <line x1="56" y1="76" x2="304" y2="76" marker-end="url(#arr)"/>
    <line x1="306" y1="124" x2="58" y2="124" marker-end="url(#arr)"/>
    <line x1="56" y1="176" x2="304" y2="176" marker-end="url(#arr)"/>
    <line x1="306" y1="212" x2="58" y2="212" marker-end="url(#arr)"/>
  </g>
  <text x="181" y="241" text-anchor="middle" font-size="12" fill="#16a34a">данные</text>
  <line x1="56" y1="248" x2="304" y2="248" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-g)"/>
  <g fill="none" stroke="#d97706" stroke-width="1.4">
    <path d="M46,76 h-6 v48 h6"/><path d="M46,176 h-6 v36 h6"/>
  </g>
  <g font-size="11" fill="#d97706" text-anchor="end">
    <text x="34" y="104">RTT 1</text><text x="34" y="198">RTT 2</text>
  </g>
  <text x="181" y="292" text-anchor="middle" font-size="12" fill="#dc2626">Certificate идёт открытым текстом</text>

  <!-- ===== TLS 1.3 ===== -->
  <text x="531" y="18" text-anchor="middle" font-weight="600">TLS 1.3 — 1 RTT до данных</text>
  <text x="406" y="42" text-anchor="middle" font-size="12" opacity="0.7">клиент</text>
  <text x="656" y="42" text-anchor="middle" font-size="12" opacity="0.7">сервер</text>
  <g stroke="currentColor" stroke-width="1" opacity="0.4">
    <line x1="406" y1="50" x2="406" y2="260"/><line x1="656" y1="50" x2="656" y2="260"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">
    <text x="531" y="70">ClientHello + key_share</text>
    <text x="531" y="100">ServerHello + key_share</text>
    <text x="531" y="118" fill="#0891b2">{EncryptedExtensions, Certificate,</text>
    <text x="531" y="133" fill="#0891b2">CertificateVerify, Finished}</text>
    <text x="531" y="178"><tspan fill="#0891b2">{Finished}</tspan> + <tspan fill="#16a34a">[данные]</tspan></text>
  </g>
  <g stroke="currentColor" stroke-width="1.4">
    <line x1="406" y1="76" x2="654" y2="76" marker-end="url(#arr)"/>
    <line x1="656" y1="142" x2="408" y2="142" marker-end="url(#arr)"/>
  </g>
  <line x1="406" y1="186" x2="654" y2="186" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-g)"/>
  <path d="M396,76 h-6 v66 h6" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <text x="384" y="113" text-anchor="end" font-size="11" fill="#d97706">RTT 1</text>
  <g font-size="11" opacity="0.7">
    <text x="416" y="222">{…} — ключи рукопожатия</text>
    <text x="416" y="238">[…] — ключи трафика</text>
  </g>
  <text x="531" y="292" text-anchor="middle" font-size="12" fill="#16a34a">Certificate зашифрован</text>
</svg>
