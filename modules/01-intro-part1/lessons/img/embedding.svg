<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 256" role="img" aria-label="Dog содержит встроенное поле Animal целиком; d.Name и d.Describe() продвигаются и работают с d.Animal, а собственный метод Dog.Sound затеняет Animal.Sound" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Встраивание: продвижение полей и методов</title>
  <defs>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
    <marker id="arr-vio" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- память -->
  <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">*d — значение Dog</text>
  <rect x="20" y="38" width="216" height="148" rx="5" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="32" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7c3aed" font-weight="600">Dog</text>
  <rect x="36" y="68" width="184" height="60" rx="4" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.4"/>
  <text x="48" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2" font-weight="600">Animal</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="48" y="114" opacity="0.7">Name</text><text x="120" y="114">"Rex"</text>
  </g>
  <rect x="36" y="140" width="184" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="48" y="161" opacity="0.7">Breed</text><text x="120" y="161">""</text>
  </g>

  <!-- вызовы -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="312" y="48" font-size="12" font-weight="600">d.Name</text>
    <text x="312" y="64" font-size="11" opacity="0.7">= d.Animal.Name → "Rex"</text>
    <text x="312" y="96" font-size="12" font-weight="600">d.Describe()</text>
    <text x="312" y="112" font-size="11" opacity="0.7">= (&amp;d.Animal).Describe() → "I am Rex"</text>
    <text x="312" y="144" font-size="12" font-weight="600">d.Animal.Sound()</text>
    <text x="312" y="160" font-size="11" opacity="0.7">явный вызов → "..."</text>
    <text x="312" y="192" font-size="12" font-weight="600" fill="#7c3aed">d.Sound()</text>
    <text x="312" y="208" font-size="11" opacity="0.7">(*Dog).Sound затеняет → "Woof"</text>
  </g>
  <g stroke="#0891b2" stroke-width="1.3" fill="none">
    <path d="M304,52 C270,52 256,78 226,82" marker-end="url(#arr-acc)"/>
    <line x1="304" y1="100" x2="226" y2="98" marker-end="url(#arr-acc)"/>
    <path d="M304,148 C270,148 256,118 226,114" marker-end="url(#arr-acc)"/>
  </g>
  <path d="M304,196 C276,196 262,180 242,174" fill="none" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arr-vio)"/>

  <text x="20" y="236" font-size="12">Внутри <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Describe</tspan> получатель — <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">*Animal</tspan>: про <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Dog</tspan> он не знает,</text>
  <text x="20" y="252" font-size="12">вызов <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">a.Sound()</tspan> из него попал бы в <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Animal.Sound</tspan> — виртуальных методов нет.</text>
</svg>
