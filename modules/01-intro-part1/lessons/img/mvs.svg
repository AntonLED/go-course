<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 212" role="img" aria-label="MVS: A требует C v1.3, B требует C v1.4; выбирается C v1.4 — максимальная из минимальных, а не самая свежая v1.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Minimal version selection</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
  </defs>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <!-- main -->
    <rect x="20" y="84" width="84" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <text x="62" y="106" font-weight="600">myapp</text>

    <!-- A, B -->
    <rect x="176" y="40" width="96" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="224" y="62">A v1.2</text>
    <rect x="176" y="128" width="96" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="224" y="150">B v1.2</text>

    <!-- C versions -->
    <rect x="360" y="24" width="96" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
    <text x="408" y="46" opacity="0.6">C v1.3</text>
    <rect x="360" y="84" width="96" height="36" rx="4" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.6"/>
    <text x="408" y="106" fill="#0891b2" font-weight="600">C v1.4</text>
    <rect x="360" y="144" width="96" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6"/>
    <text x="408" y="166" opacity="0.6">C v1.5</text>
  </g>
  <text x="408" y="198" text-anchor="middle" font-size="11" opacity="0.6">новейшая — не берётся</text>

  <!-- рёбра require -->
  <g stroke="currentColor" stroke-width="1.3" fill="none">
    <line x1="104" y1="96" x2="172" y2="64" marker-end="url(#arr)"/>
    <line x1="104" y1="108" x2="172" y2="140" marker-end="url(#arr)"/>
    <line x1="272" y1="54" x2="356" y2="44" marker-end="url(#arr)" opacity="0.6"/>
  </g>
  <line x1="272" y1="140" x2="356" y2="108" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <g font-size="11" opacity="0.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="112" y="68">require</text>
    <text x="112" y="146">require</text>
    <text x="290" y="38">require</text>
  </g>
  <text x="290" y="144" font-size="11" fill="#0891b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">require</text>

  <!-- итог -->
  <line x1="468" y1="102" x2="512" y2="102" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="516" y="44" width="148" height="116" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="590" y="66" text-anchor="middle" font-size="12" font-weight="600">список сборки</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="590" y="92">A v1.2</text>
    <text x="590" y="112">B v1.2</text>
    <text x="590" y="132" fill="#0891b2" font-weight="600">C v1.4</text>
  </g>
  <text x="590" y="152" text-anchor="middle" font-size="11" opacity="0.6">max(v1.3, v1.4)</text>
</svg>
