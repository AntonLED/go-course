<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 232" role="img" aria-label="Три заголовка среза: nil-срез с нулевым указателем; пустой срез с ненулевым указателем на объект нулевого размера; make([]int, 0, 10) с указателем на массив из 10 элементов" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>nil-срез, пустой срез и make с ёмкостью</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
  </defs>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="20" y="41">var s []int</text>
    <text x="20" y="117">e := []int{}</text>
    <text x="20" y="193">make([]int, 0, 10)</text>
  </g>
  <g font-size="11" opacity="0.7">
    <text x="20" y="60">s == nil, JSON null</text>
    <text x="20" y="136">e != nil, JSON []</text>
    <text x="20" y="212">len 0, место на 10</text>
  </g>

  <!-- заголовки -->
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="200" y="20" width="156" height="32" rx="3"/>
    <line x1="252" y1="20" x2="252" y2="52"/><line x1="304" y1="20" x2="304" y2="52"/>
    <rect x="200" y="96" width="156" height="32" rx="3"/>
    <line x1="252" y1="96" x2="252" y2="128"/><line x1="304" y1="96" x2="304" y2="128"/>
    <rect x="200" y="172" width="156" height="32" rx="3"/>
    <line x1="252" y1="172" x2="252" y2="204"/><line x1="304" y1="172" x2="304" y2="204"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="226" y="41" fill="#dc2626">nil</text><text x="278" y="41">len 0</text><text x="330" y="41">cap 0</text>
    <text x="278" y="117">len 0</text><text x="330" y="117">cap 0</text>
    <text x="278" y="193">len 0</text><text x="330" y="193" fill="#0891b2">cap 10</text>
  </g>
  <circle cx="226" cy="112" r="3"/>
  <circle cx="226" cy="188" r="3" fill="#0891b2"/>

  <text x="392" y="41" font-size="12" opacity="0.6">указатель пуст — массива нет</text>

  <!-- пустой: объект нулевого размера -->
  <path d="M226,112 C226,80 330,80 388,104" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="392" y="100" width="20" height="24" rx="2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="422" y="117" font-size="12" opacity="0.7">объект размера 0 (не nil)</text>

  <!-- make: массив на 10 -->
  <path d="M226,188 C226,152 330,150 388,178" fill="none" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <rect x="392" y="172" width="260" height="32" rx="3" fill="#0891b2" fill-opacity="0.08" stroke="#0891b2" stroke-width="1.2"/>
  <g stroke="#0891b2" stroke-width="1" opacity="0.6">
    <line x1="418" y1="172" x2="418" y2="204"/><line x1="444" y1="172" x2="444" y2="204"/><line x1="470" y1="172" x2="470" y2="204"/>
    <line x1="496" y1="172" x2="496" y2="204"/><line x1="522" y1="172" x2="522" y2="204"/><line x1="548" y1="172" x2="548" y2="204"/>
    <line x1="574" y1="172" x2="574" y2="204"/><line x1="600" y1="172" x2="600" y2="204"/><line x1="626" y1="172" x2="626" y2="204"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle" opacity="0.5">
    <text x="405" y="192">0</text><text x="431" y="192">0</text><text x="457" y="192">0</text><text x="483" y="192">0</text><text x="509" y="192">0</text>
    <text x="535" y="192">0</text><text x="561" y="192">0</text><text x="587" y="192">0</text><text x="613" y="192">0</text><text x="639" y="192">0</text>
  </g>
  <text x="522" y="224" text-anchor="middle" font-size="11" opacity="0.7">10 слотов выделено, видно 0</text>
</svg>
