<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 216" role="img" aria-label="До Go 1.22 все три замыкания ссылаются на одну переменную i, которая к моменту вызова равна 3; с Go 1.22 у каждой итерации своя i со значениями 0, 1, 2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Переменная цикла до и после Go 1.22</title>
  <defs>
    <marker id="arr-bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
  </defs>

  <line x1="340" y1="12" x2="340" y2="204" stroke="currentColor" stroke-width="1" stroke-dasharray="2 4" opacity="0.4"/>

  <!-- ЛЕВО: go ≤ 1.21 -->
  <text x="20" y="24" font-weight="600">go ≤ 1.21</text>
  <text x="96" y="24" font-size="12" opacity="0.7">одна i на весь цикл</text>

  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="44" width="112" height="28" rx="3"/>
    <rect x="20" y="92" width="112" height="28" rx="3"/>
    <rect x="20" y="140" width="112" height="28" rx="3"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="30" y="63">fs[0]</text><text x="30" y="111">fs[1]</text><text x="30" y="159">fs[2]</text>
    <text x="90" y="63">&amp;i</text><text x="90" y="111">&amp;i</text><text x="90" y="159">&amp;i</text>
  </g>
  <g fill="none" stroke="#dc2626" stroke-width="1.4">
    <path d="M132,58 C180,58 190,98 224,102" marker-end="url(#arr-bad)"/>
    <line x1="132" y1="106" x2="224" y2="106" marker-end="url(#arr-bad)"/>
    <path d="M132,154 C180,154 190,114 224,110" marker-end="url(#arr-bad)"/>
  </g>
  <rect x="228" y="90" width="88" height="32" rx="3" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="1.4"/>
  <text x="272" y="111" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#dc2626">i = 3</text>
  <text x="272" y="140" text-anchor="middle" font-size="11" opacity="0.6">значение после</text>
  <text x="272" y="154" text-anchor="middle" font-size="11" opacity="0.6">выхода из цикла</text>

  <text x="20" y="200" font-size="12">вывод: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#dc2626" font-weight="600">333</tspan></text>

  <!-- ПРАВО: go ≥ 1.22 -->
  <text x="364" y="24" font-weight="600">go ≥ 1.22</text>
  <text x="440" y="24" font-size="12" opacity="0.7">своя i на итерацию</text>

  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="364" y="44" width="112" height="28" rx="3"/>
    <rect x="364" y="92" width="112" height="28" rx="3"/>
    <rect x="364" y="140" width="112" height="28" rx="3"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="374" y="63">fs[0]</text><text x="374" y="111">fs[1]</text><text x="374" y="159">fs[2]</text>
    <text x="434" y="63">&amp;i</text><text x="434" y="111">&amp;i</text><text x="434" y="159">&amp;i</text>
  </g>
  <g stroke="#16a34a" stroke-width="1.4">
    <line x1="476" y1="58" x2="568" y2="58" marker-end="url(#arr-ok)"/>
    <line x1="476" y1="106" x2="568" y2="106" marker-end="url(#arr-ok)"/>
    <line x1="476" y1="154" x2="568" y2="154" marker-end="url(#arr-ok)"/>
  </g>
  <g fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.4">
    <rect x="572" y="42" width="88" height="32" rx="3"/>
    <rect x="572" y="90" width="88" height="32" rx="3"/>
    <rect x="572" y="138" width="88" height="32" rx="3"/>
  </g>
  <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#16a34a">
    <text x="616" y="63">i = 0</text><text x="616" y="111">i = 1</text><text x="616" y="159">i = 2</text>
  </g>

  <text x="364" y="200" font-size="12">вывод: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#16a34a" font-weight="600">012</tspan></text>
</svg>
