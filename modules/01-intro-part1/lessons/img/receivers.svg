<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 196" role="img" aria-label="Value receiver получает копию структуры Counter; pointer receiver получает адрес исходной переменной, поэтому c.n++ в Inc меняет оригинал" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Value receiver и pointer receiver</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
  </defs>

  <line x1="340" y1="8" x2="340" y2="188" stroke="currentColor" stroke-width="1" stroke-dasharray="2 4" opacity="0.4"/>

  <!-- ЛЕВО -->
  <text x="20" y="22" font-weight="600">value receiver</text>
  <text x="20" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" opacity="0.7">func (c Counter) Value() int</text>

  <text x="20" y="72" font-size="11" opacity="0.6">c в вызывающем</text>
  <rect x="20" y="80" width="112" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <line x1="56" y1="80" x2="56" y2="112" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="30" y="101" opacity="0.6">n</text><text x="94" y="101" text-anchor="middle">5</text>
  </g>

  <text x="196" y="72" font-size="11" opacity="0.6">c внутри Value</text>
  <rect x="196" y="80" width="112" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="232" y1="80" x2="232" y2="112" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="206" y="101" opacity="0.6">n</text><text x="270" y="101" text-anchor="middle">5</text>
  </g>
  <line x1="132" y1="96" x2="192" y2="96" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="162" y="130" text-anchor="middle" font-size="11" opacity="0.7">копия всей структуры</text>
  <text x="20" y="178" font-size="12">изменения внутри не видны снаружи</text>

  <!-- ПРАВО -->
  <text x="360" y="22" font-weight="600">pointer receiver</text>
  <text x="360" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" opacity="0.7">func (c *Counter) Inc() { c.n++ }</text>

  <text x="360" y="72" font-size="11" opacity="0.6">c в вызывающем</text>
  <rect x="360" y="80" width="112" height="32" rx="3" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.4"/>
  <line x1="396" y1="80" x2="396" y2="112" stroke="#0891b2" stroke-width="1" opacity="0.6"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="370" y="101" opacity="0.6">n</text><text x="434" y="101" text-anchor="middle" fill="#0891b2" font-weight="600">5 → 6</text>
  </g>

  <text x="536" y="72" font-size="11" opacity="0.6">c внутри Inc</text>
  <rect x="536" y="80" width="112" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="560" y="101" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">&amp;c</text>
  <text x="610" y="101" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle" opacity="0.6">*Counter</text>
  <path d="M560,112 V136 H416 V116" fill="none" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <text x="488" y="152" text-anchor="middle" font-size="11" opacity="0.7">копируется только адрес</text>
  <text x="360" y="178" font-size="12"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">c.Inc()</tspan> ≡ <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">(&amp;c).Inc()</tspan> — меняет оригинал</text>
</svg>
