<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 184" role="img" aria-label="Строка &quot;aя€&quot; занимает 6 байт: a — 1 байт, я — 2, € — 3; range выдаёт три руны с байтовыми индексами 0, 1 и 3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>range по строке</title>

  <text x="20" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.7">for i, r := range "aя€"</text>

  <g transform="translate(40,0)">
  <!-- индексы -->
  <g font-size="11" text-anchor="middle" opacity="0.6">
    <text x="176" y="46">0</text><text x="248" y="46">1</text><text x="320" y="46">2</text>
    <text x="392" y="46">3</text><text x="464" y="46">4</text><text x="536" y="46">5</text>
  </g>
  <text x="128" y="75" text-anchor="end" font-size="11" opacity="0.7">байты</text>

  <!-- байты -->
  <rect x="212" y="54" width="144" height="34" fill="#0891b2" fill-opacity="0.15"/>
  <rect x="140" y="54" width="432" height="34" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <g stroke="currentColor" stroke-width="1" opacity="0.35">
    <line x1="284" y1="54" x2="284" y2="88"/><line x1="428" y1="54" x2="428" y2="88"/><line x1="500" y1="54" x2="500" y2="88"/>
  </g>
  <g stroke="currentColor" stroke-width="1.2">
    <line x1="212" y1="54" x2="212" y2="88"/><line x1="356" y1="54" x2="356" y2="88"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="176" y="76">61</text>
    <text x="248" y="76">D1</text><text x="320" y="76">8F</text>
    <text x="392" y="76">E2</text><text x="464" y="76">82</text><text x="536" y="76">AC</text>
  </g>

  <!-- скобки групп -->
  <g fill="none" stroke="currentColor" stroke-width="1.1" opacity="0.6">
    <path d="M144,96 v5 h64 v-5"/><path d="M216,96 v5 h136 v-5"/><path d="M360,96 v5 h208 v-5"/>
  </g>
  <g font-size="11" text-anchor="middle" opacity="0.6">
    <text x="176" y="116">1 байт</text><text x="284" y="116">2 байта</text><text x="464" y="116">3 байта</text>
  </g>

  <!-- итерации -->
  <text x="120" y="146" text-anchor="end" font-size="11" opacity="0.7">итерации</text>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="128" y="126" width="96" height="30" rx="4"/>
    <rect x="416" y="126" width="96" height="30" rx="4"/>
  </g>
  <rect x="236" y="126" width="96" height="30" rx="4" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="176" y="146">i=0 'a'</text>
    <text x="284" y="146" fill="#0891b2">i=1 'я'</text>
    <text x="464" y="146">i=3 '€'</text>
  </g>
  <text x="140" y="178" font-size="12" opacity="0.8">i — байтовый индекс начала руны: 0, 1, 3 (не подряд)</text>
  </g>
</svg>
