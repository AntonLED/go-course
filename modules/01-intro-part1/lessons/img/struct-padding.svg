<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 188" role="img" aria-label="struct{a bool; b int64; c bool} занимает 24 байта: 7 байт выравнивания перед b и 7 в конце; struct{b int64; a, c bool} — 16 байт, выравнивание только 6 байт в конце" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Выравнивание полей структуры</title>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- ряд 1 -->
  <text x="20" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">struct{ a bool; b int64; c bool }</text>
  <text x="644" y="20" text-anchor="end" font-size="12" font-weight="600" fill="#dc2626">24 байта</text>

  <rect x="20" y="28" width="26" height="30" fill="#0891b2" fill-opacity="0.2" stroke="#0891b2" stroke-width="1.2"/>
  <rect x="46" y="28" width="182" height="30" fill="url(#hatch)" stroke="#d97706" stroke-width="1.2"/>
  <rect x="228" y="28" width="208" height="30" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="436" y="28" width="26" height="30" fill="#0891b2" fill-opacity="0.2" stroke="#0891b2" stroke-width="1.2"/>
  <rect x="462" y="28" width="182" height="30" fill="url(#hatch)" stroke="#d97706" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="33" y="48">a</text><text x="332" y="48">b int64</text><text x="449" y="48">c</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#d97706" font-weight="600">
    <text x="137" y="47">7 байт padding</text><text x="553" y="47">7 байт padding</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle" opacity="0.6">
    <text x="20" y="74">0</text><text x="228" y="74">8</text><text x="436" y="74">16</text><text x="644" y="74">24</text>
  </g>

  <!-- ряд 2 -->
  <text x="20" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">struct{ b int64; a, c bool }</text>
  <text x="644" y="108" text-anchor="end" font-size="12" font-weight="600" fill="#16a34a">16 байт</text>

  <rect x="20" y="116" width="208" height="30" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="228" y="116" width="26" height="30" fill="#0891b2" fill-opacity="0.2" stroke="#0891b2" stroke-width="1.2"/>
  <rect x="254" y="116" width="26" height="30" fill="#0891b2" fill-opacity="0.2" stroke="#0891b2" stroke-width="1.2"/>
  <rect x="280" y="116" width="156" height="30" fill="url(#hatch)" stroke="#d97706" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="124" y="136">b int64</text><text x="241" y="136">a</text><text x="267" y="136">c</text>
  </g>
  <text x="358" y="135" font-size="11" text-anchor="middle" fill="#d97706" font-weight="600">6 байт padding</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle" opacity="0.6">
    <text x="20" y="162">0</text><text x="228" y="162">8</text><text x="436" y="162">16</text>
  </g>

  <text x="20" y="182" font-size="11" opacity="0.7">amd64: int64 выравнивается по 8 байт, размер структуры кратен 8</text>
</svg>
