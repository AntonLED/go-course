<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 246" role="img" aria-label="Строка &quot;Привет&quot; — заголовок (data, len 12) над 12 неизменяемыми байтами UTF-8, по 2 байта на букву; подстрока s[2:6] — второй заголовок над теми же байтами" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Строка: заголовок над байтами</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- заголовки -->
  <text x="20" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.7">s := "Привет"</text>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="26" width="144" height="30" rx="4"/>
    <line x1="92" y1="26" x2="92" y2="56"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="56" y="46">data</text><text x="128" y="46">len 12</text>
  </g>

  <text x="400" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">sub := s[2:6]</text>
  <rect x="400" y="26" width="144" height="30" rx="4" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <line x1="472" y1="26" x2="472" y2="56" stroke="#0891b2" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="436" y="46">data</text><text x="508" y="46">len 4</text>
  </g>
  <text x="556" y="46" font-size="11" opacity="0.7">без копии</text>

  <line x1="56" y1="56" x2="140" y2="104" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="436" y1="56" x2="242" y2="104" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>

  <!-- байты -->
  <rect x="216" y="108" width="176" height="34" fill="#0891b2" fill-opacity="0.15"/>
  <rect x="128" y="108" width="528" height="34" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <g stroke="currentColor" stroke-width="1" opacity="0.35">
    <line x1="172" y1="108" x2="172" y2="142"/><line x1="260" y1="108" x2="260" y2="142"/><line x1="348" y1="108" x2="348" y2="142"/>
    <line x1="436" y1="108" x2="436" y2="142"/><line x1="524" y1="108" x2="524" y2="142"/><line x1="612" y1="108" x2="612" y2="142"/>
  </g>
  <g stroke="currentColor" stroke-width="1.2">
    <line x1="216" y1="108" x2="216" y2="142"/><line x1="304" y1="108" x2="304" y2="142"/><line x1="392" y1="108" x2="392" y2="142"/>
    <line x1="480" y1="108" x2="480" y2="142"/><line x1="568" y1="108" x2="568" y2="142"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="150" y="130">D0</text><text x="194" y="130">9F</text>
    <text x="238" y="130">D1</text><text x="282" y="130">80</text>
    <text x="326" y="130">D0</text><text x="370" y="130">B8</text>
    <text x="414" y="130">D0</text><text x="458" y="130">B2</text>
    <text x="502" y="130">D0</text><text x="546" y="130">B5</text>
    <text x="590" y="130">D1</text><text x="634" y="130">82</text>
  </g>
  <g font-size="11" text-anchor="middle" opacity="0.6">
    <text x="150" y="158">0</text><text x="194" y="158">1</text><text x="238" y="158">2</text><text x="282" y="158">3</text>
    <text x="326" y="158">4</text><text x="370" y="158">5</text><text x="414" y="158">6</text><text x="458" y="158">7</text>
    <text x="502" y="158">8</text><text x="546" y="158">9</text><text x="590" y="158">10</text><text x="634" y="158">11</text>
  </g>
  <text x="116" y="122" text-anchor="end" font-size="11" opacity="0.7">байты</text>
  <text x="116" y="136" text-anchor="end" font-size="11" opacity="0.7">read-only</text>

  <!-- руны -->
  <g fill="none" stroke="currentColor" stroke-width="1.1" opacity="0.6">
    <path d="M132,166 v5 h80 v-5"/><path d="M220,166 v5 h80 v-5"/><path d="M308,166 v5 h80 v-5"/>
    <path d="M396,166 v5 h80 v-5"/><path d="M484,166 v5 h80 v-5"/><path d="M572,166 v5 h80 v-5"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <text x="172" y="192">П</text><text x="260" y="192" fill="#0891b2">р</text><text x="348" y="192" fill="#0891b2">и</text>
    <text x="436" y="192">в</text><text x="524" y="192">е</text><text x="612" y="192">т</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle" opacity="0.6">
    <text x="172" y="210">U+041F</text><text x="260" y="210">U+0440</text><text x="348" y="210">U+0438</text>
    <text x="436" y="210">U+0432</text><text x="524" y="210">U+0435</text><text x="612" y="210">U+0442</text>
  </g>
  <text x="116" y="196" text-anchor="end" font-size="11" opacity="0.7">руны</text>
  <text x="392" y="238" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">len(s) = 12 байт, RuneCountInString(s) = 6</text>
</svg>
