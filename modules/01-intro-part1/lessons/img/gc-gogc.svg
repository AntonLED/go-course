<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236" role="img" aria-label="Пила кучи при GOGC=100: после сборки живых данных 4 МБ, следующий цикл GC стартует, когда куча приближается к 8 МБ" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>GOGC: когда запускается сборка</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- оси -->
  <line x1="60" y1="200" x2="60" y2="28" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="60" y1="200" x2="664" y2="200" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="68" y="30" font-size="12" opacity="0.7">размер кучи</text>
  <text x="664" y="222" font-size="12" opacity="0.7" text-anchor="end">время</text>
  <g font-size="11" text-anchor="end" opacity="0.7">
    <text x="52" y="204">0</text>
    <text x="52" y="140">4 МБ</text>
    <text x="52" y="76">8 МБ</text>
  </g>

  <!-- фазы GC -->
  <g fill="#d97706" fill-opacity="0.15">
    <rect x="204" y="48" width="36" height="152"/>
    <rect x="384" y="48" width="36" height="152"/>
    <rect x="564" y="48" width="36" height="152"/>
  </g>
  <g font-size="11" fill="#d97706" text-anchor="middle" font-weight="600">
    <text x="222" y="44">GC</text><text x="402" y="44">GC</text><text x="582" y="44">GC</text>
  </g>

  <!-- уровни -->
  <line x1="60" y1="136" x2="650" y2="136" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="60" y1="72" x2="650" y2="72" stroke="#0891b2" stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- куча -->
  <path d="M60,136 L236,74 L240,136 L416,74 L420,136 L596,74 L600,136 L644,120" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>

  <!-- подписи уровней -->
  <text x="248" y="64" font-size="12" fill="#0891b2">цель = 4 МБ × (1 + GOGC/100) = 8 МБ</text>
  <text x="248" y="156" font-size="12" opacity="0.7">живые данные после сборки: 4 МБ</text>
</svg>
