<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" role="img" aria-label="Замыкание: значение-функция next указывает на объект в куче, который хранит адрес кода и указатель на переменную c; кадр counter() уже снят, а c живёт в куче" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Замыкание захватывает переменную</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- зоны -->
  <text x="20" y="20" font-size="11" opacity="0.6">стек</text>
  <text x="300" y="20" font-size="11" opacity="0.6">куча</text>
  <line x1="268" y1="12" x2="268" y2="188" stroke="currentColor" stroke-width="1" stroke-dasharray="2 4" opacity="0.4"/>

  <!-- кадр main -->
  <rect x="20" y="32" width="220" height="64" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="32" y="50" font-size="11" opacity="0.6">кадр main</text>
  <text x="32" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">next</text>
  <rect x="80" y="62" width="60" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="110" cy="74" r="3"/>

  <!-- кадр counter (снят) -->
  <rect x="20" y="112" width="220" height="64" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5"/>
  <text x="32" y="130" font-size="11" opacity="0.6">кадр counter() — снят после return</text>
  <text x="32" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.5">c := 0 → escape в кучу</text>

  <!-- next → объект замыкания -->
  <path d="M110,74 C190,74 230,60 296,60" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- объект замыкания -->
  <text x="300" y="96" font-size="11" opacity="0.6">объект замыкания</text>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="300" y="48" width="140" height="28" rx="3"/>
    <line x1="370" y1="48" x2="370" y2="76"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="326" y="67">fn</text><text x="396" y="67">&amp;c</text>
  </g>

  <!-- код -->
  <rect x="488" y="36" width="176" height="28" rx="3" fill="none" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <text x="576" y="55" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" opacity="0.8">func() int { c++ … }</text>
  <circle cx="352" cy="62" r="3" opacity="0.6"/><circle cx="422" cy="62" r="3" fill="#0891b2"/>
  <path d="M352,62 V36 H460 V50 H484" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6" marker-end="url(#arr)"/>

  <!-- c в куче -->
  <path d="M422,62 V132 H484" fill="none" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <rect x="488" y="116" width="88" height="32" rx="3" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.4"/>
  <text x="532" y="137" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">c = 2</text>
  <text x="532" y="170" text-anchor="middle" font-size="11" opacity="0.7">после next(); next()</text>
</svg>
