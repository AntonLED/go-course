<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 272" role="img" aria-label="Классическая map: hmap с B=2 указывает на массив из 4 бакетов; младшие B бит хеша выбирают бакет, старшие 8 бит сравниваются с tophash; бакет хранит 8 tophash, 8 ключей, 8 значений и указатель на overflow" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Устройство map до Go 1.24</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- хеш -->
  <text x="288" y="35" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">hash(k, hash0)</text>
  <rect x="300" y="16" width="72" height="28" fill="#7c3aed" fill-opacity="0.15"/>
  <rect x="612" y="16" width="48" height="28" fill="#0891b2" fill-opacity="0.18"/>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="300" y="16" width="360" height="28" rx="3"/>
    <line x1="372" y1="16" x2="372" y2="44"/><line x1="612" y1="16" x2="612" y2="44"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="336" y="35" fill="#7c3aed" font-weight="600">0x5C</text>
    <text x="492" y="35" opacity="0.5">64 бита</text>
    <text x="636" y="35" fill="#0891b2" font-weight="600">…10</text>
  </g>
  <text x="300" y="62" font-size="11" fill="#7c3aed">старшие 8 бит → tophash</text>
  <text x="660" y="62" font-size="11" fill="#0891b2" text-anchor="end">младшие B бит = 2 → бакет 2</text>

  <!-- hmap -->
  <text x="20" y="78" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">hmap</text>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="84" width="144" height="130" rx="3"/>
    <line x1="20" y1="110" x2="164" y2="110"/><line x1="20" y1="136" x2="164" y2="136"/>
    <line x1="20" y1="162" x2="164" y2="162"/><line x1="20" y1="188" x2="164" y2="188"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="30" y="102">count</text>
    <text x="30" y="128">B = 2</text>
    <text x="30" y="154">hash0</text>
    <text x="30" y="180">buckets</text>
    <text x="30" y="206" opacity="0.6">oldbuckets</text>
  </g>
  <circle cx="148" cy="175" r="3"/>
  <path d="M148,175 H186 V99 H206" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- массив бакетов -->
  <rect x="211" y="145" width="40" height="28" fill="#0891b2" fill-opacity="0.18"/>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="210" y="84" width="42" height="120" rx="3"/>
    <line x1="210" y1="114" x2="252" y2="114"/><line x1="210" y1="144" x2="252" y2="144"/><line x1="210" y1="174" x2="252" y2="174"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="231" y="104">0</text><text x="231" y="134">1</text><text x="231" y="164" fill="#0891b2" font-weight="600">2</text><text x="231" y="194">3</text>
  </g>
  <text x="231" y="222" text-anchor="middle" font-size="11" opacity="0.6">2^B = 4</text>

  <!-- лупа -->
  <g stroke="#0891b2" stroke-width="1" stroke-dasharray="3 3" opacity="0.7">
    <line x1="252" y1="144" x2="296" y2="80"/><line x1="252" y1="174" x2="296" y2="218"/>
  </g>

  <!-- бакет -->
  <rect x="296" y="80" width="372" height="138" rx="4" fill="none" stroke="#0891b2" stroke-width="1.4"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" opacity="0.7">
    <text x="304" y="106">tophash</text><text x="304" y="138">keys</text><text x="304" y="170">elems</text><text x="304" y="202">overflow</text>
  </g>
  <!-- ячейки 8×3 -->
  <rect x="480" y="90" width="36" height="26" fill="#7c3aed" fill-opacity="0.18"/>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="372" y="90" width="288" height="26"/>
    <rect x="372" y="122" width="288" height="26"/>
    <rect x="372" y="154" width="288" height="26"/>
  </g>
  <g stroke="currentColor" stroke-width="1" opacity="0.5">
    <path d="M408,90 v26 M444,90 v26 M480,90 v26 M516,90 v26 M552,90 v26 M588,90 v26 M624,90 v26"/>
    <path d="M408,122 v26 M444,122 v26 M480,122 v26 M516,122 v26 M552,122 v26 M588,122 v26 M624,122 v26"/>
    <path d="M408,154 v26 M444,154 v26 M480,154 v26 M516,154 v26 M552,154 v26 M588,154 v26 M624,154 v26"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">
    <text x="390" y="107">A1</text><text x="426" y="107">07</text><text x="462" y="107">E3</text>
    <text x="498" y="107" fill="#7c3aed" font-weight="600">5C</text>
    <g opacity="0.4"><text x="534" y="107">·</text><text x="570" y="107">·</text><text x="606" y="107">·</text><text x="642" y="107">·</text></g>
    <g opacity="0.5"><text x="390" y="139">…</text><text x="426" y="139">…</text><text x="462" y="139">…</text>
    <text x="390" y="171">…</text><text x="426" y="171">…</text><text x="462" y="171">…</text></g>
    <text x="498" y="139" font-weight="600">k</text>
    <text x="498" y="171" font-weight="600">v</text>
  </g>
  <rect x="372" y="188" width="72" height="22" fill="none" stroke="currentColor" stroke-width="1"/>
  <circle cx="408" cy="199" r="3"/>
  <path d="M408,210 V244 H468" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="472" y="232" width="152" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7"/>
  <text x="548" y="248" text-anchor="middle" font-size="11" opacity="0.8">overflow-бакет, ещё 8</text>
  <text x="560" y="204" text-anchor="middle" font-size="11" opacity="0.6">8 слотов, · — пусто</text>
</svg>
