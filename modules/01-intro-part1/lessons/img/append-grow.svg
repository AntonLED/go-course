<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 292" role="img" aria-label="append к полному срезу: выделяется новый массив удвоенной ёмкости, старые элементы копируются, дописывается 5; исходный срез s продолжает указывать на старый массив" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Рост среза при append</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
  </defs>

  <text x="20" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.7">s := []int{1, 2, 3, 4}   // len 4, cap 4</text>
  <text x="340" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.7">t := append(s, 5)</text>

  <!-- s -->
  <text x="32" y="51" text-anchor="end" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">s</text>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="40" y="32" width="156" height="30" rx="4"/>
    <line x1="92" y1="32" x2="92" y2="62"/><line x1="144" y1="32" x2="144" y2="62"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="66" y="52">ptr</text><text x="118" y="52">len 4</text><text x="170" y="52">cap 4</text>
  </g>
  <line x1="66" y1="62" x2="220" y2="94" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- старый массив -->
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="200" y="98" width="192" height="34" rx="3"/>
    <line x1="248" y1="98" x2="248" y2="132"/><line x1="296" y1="98" x2="296" y2="132"/><line x1="344" y1="98" x2="344" y2="132"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="224" y="120">1</text><text x="272" y="120">2</text><text x="320" y="120">3</text><text x="368" y="120">4</text>
  </g>
  <text x="200" y="150" font-size="11" opacity="0.7">старый массив: s по-прежнему указывает сюда</text>

  <!-- копирование -->
  <path d="M196,115 H172 V207 H192" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="164" y="158" text-anchor="end" font-size="11" opacity="0.7">копирование</text>
  <text x="164" y="172" text-anchor="end" font-size="11" opacity="0.7">4 элементов</text>

  <!-- t -->
  <text x="636" y="51" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0891b2">t</text>
  <rect x="472" y="32" width="156" height="30" rx="4" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <g stroke="#0891b2" stroke-width="1.2"><line x1="524" y1="32" x2="524" y2="62"/><line x1="576" y1="32" x2="576" y2="62"/></g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="498" y="52">ptr</text><text x="550" y="52">len 5</text><text x="602" y="52">cap 8</text>
  </g>
  <path d="M498,62 V166 H224 V184" fill="none" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>

  <!-- новый массив -->
  <rect x="392" y="190" width="48" height="34" fill="#0891b2" fill-opacity="0.18"/>
  <g fill="none" stroke="#0891b2" stroke-width="1.2">
    <rect x="200" y="190" width="384" height="34" rx="3"/>
  </g>
  <g stroke="#0891b2" stroke-width="1" opacity="0.7">
    <line x1="248" y1="190" x2="248" y2="224"/><line x1="296" y1="190" x2="296" y2="224"/><line x1="344" y1="190" x2="344" y2="224"/>
    <line x1="392" y1="190" x2="392" y2="224"/><line x1="440" y1="190" x2="440" y2="224"/><line x1="488" y1="190" x2="488" y2="224"/>
    <line x1="536" y1="190" x2="536" y2="224"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="224" y="212">1</text><text x="272" y="212">2</text><text x="320" y="212">3</text><text x="368" y="212">4</text>
    <text x="416" y="212" fill="#0891b2" font-weight="600">5</text>
    <text x="464" y="212" opacity="0.4">0</text><text x="512" y="212" opacity="0.4">0</text><text x="560" y="212" opacity="0.4">0</text>
  </g>

  <path d="M200,232 v6 h240 v-6" fill="none" stroke="#0891b2" stroke-width="1.4"/>
  <text x="320" y="254" text-anchor="middle" fill="#0891b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">len(t) = 5</text>
  <path d="M200,262 v6 h384 v-6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <text x="392" y="284" text-anchor="middle" opacity="0.7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">cap(t) = 8 — удвоение</text>
</svg>
