<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236" role="img" aria-label="x, y и z указывают на один массив ёмкостью 10; оба append пишут в элемент с индексом 3, и второй затирает первый: y[3] и z[3] равны 2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Два append к одному срезу</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- заголовки -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="20" y="18">x := make([]int, 3, 10)</text>
    <text x="256" y="18">y := append(x, 1)</text>
    <text x="492" y="18">z := append(x, 2)</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="28" width="168" height="30" rx="4"/>
    <line x1="76" y1="28" x2="76" y2="58"/><line x1="132" y1="28" x2="132" y2="58"/>
    <rect x="256" y="28" width="168" height="30" rx="4"/>
    <line x1="312" y1="28" x2="312" y2="58"/><line x1="368" y1="28" x2="368" y2="58"/>
    <rect x="492" y="28" width="168" height="30" rx="4"/>
    <line x1="548" y1="28" x2="548" y2="58"/><line x1="604" y1="28" x2="604" y2="58"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="48" y="48">ptr</text><text x="104" y="48">len 3</text><text x="160" y="48">cap 10</text>
    <text x="284" y="48">ptr</text><text x="340" y="48">len 4</text><text x="396" y="48">cap 10</text>
    <text x="520" y="48">ptr</text><text x="576" y="48">len 4</text><text x="632" y="48">cap 10</text>
  </g>

  <!-- указатели: все на [0] -->
  <g stroke="currentColor" stroke-width="1.3" fill="none">
    <path d="M48,58 C48,90 200,84 226,108" marker-end="url(#arr)"/>
    <line x1="284" y1="58" x2="242" y2="108" marker-end="url(#arr)"/>
    <path d="M520,58 C520,90 290,80 250,108" marker-end="url(#arr)"/>
  </g>

  <!-- массив на 10 -->
  <rect x="349" y="113" width="42" height="32" fill="#dc2626" fill-opacity="0.15"/>
  <rect x="216" y="112" width="440" height="34" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <g stroke="currentColor" stroke-width="1" opacity="0.7">
    <line x1="260" y1="112" x2="260" y2="146"/><line x1="304" y1="112" x2="304" y2="146"/><line x1="348" y1="112" x2="348" y2="146"/>
    <line x1="392" y1="112" x2="392" y2="146"/><line x1="436" y1="112" x2="436" y2="146"/><line x1="480" y1="112" x2="480" y2="146"/>
    <line x1="524" y1="112" x2="524" y2="146"/><line x1="568" y1="112" x2="568" y2="146"/><line x1="612" y1="112" x2="612" y2="146"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="238" y="134">0</text><text x="282" y="134">0</text><text x="326" y="134">0</text>
    <text x="370" y="134" fill="#dc2626" font-weight="600">2</text>
    <g opacity="0.4"><text x="414" y="134">0</text><text x="458" y="134">0</text><text x="502" y="134">0</text><text x="546" y="134">0</text><text x="590" y="134">0</text><text x="634" y="134">0</text></g>
  </g>
  <g font-size="11" text-anchor="middle" opacity="0.6">
    <text x="238" y="160">[0]</text><text x="282" y="160">[1]</text><text x="326" y="160">[2]</text><text x="370" y="160">[3]</text>
  </g>

  <!-- len -->
  <path d="M216,168 v6 h132 v-6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
  <text x="282" y="190" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.8">len(x) = 3</text>
  <path d="M216,198 v6 h176 v-6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
  <text x="304" y="220" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.8">len(y) = len(z) = 4</text>

  <!-- пояснение -->
  <line x1="424" y1="184" x2="396" y2="150" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-bad)"/>
  <text x="430" y="190" font-size="12" fill="#dc2626">y записал 1, z затёр на 2</text>
  <text x="430" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">y[3], z[3] → 2 2</text>
</svg>
