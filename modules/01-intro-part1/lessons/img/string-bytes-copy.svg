<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 244" role="img" aria-label="[]byte(s) выделяет новый изменяемый массив и копирует байты строки; изменение b[0] не трогает s; string(b) снова копирует байты в новую неизменяемую строку" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Конвертации string и []byte копируют</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- ряд s -->
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="120" y="40" width="200" height="32" rx="3"/>
    <line x1="160" y1="40" x2="160" y2="72"/><line x1="200" y1="40" x2="200" y2="72"/><line x1="240" y1="40" x2="240" y2="72"/><line x1="280" y1="40" x2="280" y2="72"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="140" y="61">h</text><text x="180" y="61">e</text><text x="220" y="61">l</text><text x="260" y="61">l</text><text x="300" y="61">o</text>
  </g>
  <text x="332" y="61" font-size="11" opacity="0.7">только чтение</text>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="448" y="40" width="120" height="32" rx="4"/>
    <line x1="508" y1="40" x2="508" y2="72"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="478" y="61">data</text><text x="538" y="61">len 5</text>
  </g>
  <text x="580" y="61" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">s</text>
  <path d="M478,40 V24 H140 V36" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- копия 1 -->
  <path d="M116,52 H104 V130 H116" fill="none" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <text x="92" y="92" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">[]byte(s)</text>
  <text x="92" y="108" text-anchor="end" font-size="11" opacity="0.7">аллокация</text>

  <!-- ряд b -->
  <rect x="121" y="121" width="38" height="30" fill="#0891b2" fill-opacity="0.18"/>
  <g fill="none" stroke="#0891b2" stroke-width="1.2">
    <rect x="120" y="120" width="200" height="32" rx="3"/>
    <line x1="160" y1="120" x2="160" y2="152"/><line x1="200" y1="120" x2="200" y2="152"/><line x1="240" y1="120" x2="240" y2="152"/><line x1="280" y1="120" x2="280" y2="152"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="140" y="141" fill="#0891b2" font-weight="600">H</text><text x="180" y="141">e</text><text x="220" y="141">l</text><text x="260" y="141">l</text><text x="300" y="141">o</text>
  </g>
  <text x="332" y="141" font-size="11" fill="#0891b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">b[0] = 'H'</text>
  <rect x="448" y="120" width="180" height="32" rx="4" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <g stroke="#0891b2" stroke-width="1.2"><line x1="508" y1="120" x2="508" y2="152"/><line x1="568" y1="120" x2="568" y2="152"/></g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="478" y="141">ptr</text><text x="538" y="141">len 5</text><text x="598" y="141">cap</text>
  </g>
  <text x="640" y="141" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0891b2">b</text>
  <path d="M478,120 V104 H140 V116" fill="none" stroke="#0891b2" stroke-width="1.3" marker-end="url(#arr-acc)"/>

  <!-- копия 2 -->
  <path d="M116,142 H104 V220 H116" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="92" y="172" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">string(b)</text>
  <text x="92" y="188" text-anchor="end" font-size="11" opacity="0.7">аллокация</text>

  <!-- ряд s2 -->
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="120" y="200" width="200" height="32" rx="3"/>
    <line x1="160" y1="200" x2="160" y2="232"/><line x1="200" y1="200" x2="200" y2="232"/><line x1="240" y1="200" x2="240" y2="232"/><line x1="280" y1="200" x2="280" y2="232"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="140" y="221">H</text><text x="180" y="221">e</text><text x="220" y="221">l</text><text x="260" y="221">l</text><text x="300" y="221">o</text>
  </g>
  <text x="332" y="221" font-size="11" opacity="0.7">новая строка</text>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="448" y="200" width="120" height="32" rx="4"/>
    <line x1="508" y1="200" x2="508" y2="232"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="478" y="221">data</text><text x="538" y="221">len 5</text>
  </g>
  <text x="580" y="221" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">s2</text>
  <path d="M478,200 V184 H140 V196" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
</svg>
