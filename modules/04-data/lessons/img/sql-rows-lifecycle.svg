<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 262" role="img" aria-label="Жизненный цикл Rows: Query берёт соединение; цикл Next/Scan; Next=false закрывает rows сам и возвращает соединение; при раннем выходе соединение вернёт только defer rows.Close(), без него — утечка" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Жизненный цикл sql.Rows</title>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker>
    <marker id="ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
  </defs>

  <!-- полоса «соединение занято» -->
  <rect x="16" y="8" width="360" height="20" rx="3" fill="#0891b2" fill-opacity="0.12"/>
  <text x="196" y="22" text-anchor="middle" font-size="11" fill="#0891b2">соединение из пула занято этими rows</text>

  <!-- Query -->
  <rect x="16" y="40" width="152" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="92" y="64" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">db.QueryContext</text>
  <line x1="168" y1="60" x2="214" y2="60" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Next -->
  <rect x="216" y="40" width="136" height="40" rx="20" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="284" y="64" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">rows.Next()</text>

  <!-- Scan -->
  <rect x="216" y="128" width="136" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="284" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">rows.Scan(&amp;…)</text>
  <line x1="264" y1="80" x2="264" y2="126" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="258" y="108" text-anchor="end" font-size="11">true</text>
  <line x1="304" y1="128" x2="304" y2="82" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="310" y="108" font-size="11" opacity="0.7">ещё строка</text>

  <!-- Next=false → автозакрытие -->
  <line x1="352" y1="60" x2="418" y2="60" stroke="#16a34a" stroke-width="1.4" marker-end="url(#ag)"/>
  <text x="385" y="52" text-anchor="middle" font-size="11" fill="#16a34a">false</text>
  <rect x="420" y="40" width="156" height="40" rx="4" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.2"/>
  <text x="498" y="57" text-anchor="middle" font-size="12">rows закрыт сам</text>
  <text x="498" y="72" text-anchor="middle" font-size="11" fill="#16a34a">conn → пул</text>
  <line x1="576" y1="60" x2="594" y2="60" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="596" y="40" width="88" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="640" y="57" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">rows.Err()</text>
  <text x="640" y="72" text-anchor="middle" font-size="11" opacity="0.7">обязательно</text>
  <text x="640" y="100" text-anchor="middle" font-size="11" opacity="0.7">false бывает</text>
  <text x="640" y="114" text-anchor="middle" font-size="11" opacity="0.7">и из-за ошибки</text>

  <!-- ранний выход -->
  <line x1="352" y1="148" x2="418" y2="148" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="385" y="140" text-anchor="middle" font-size="11">return err</text>
  <text x="385" y="166" text-anchor="middle" font-size="11" opacity="0.7">break</text>
  <rect x="420" y="128" width="156" height="40" rx="4" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.2"/>
  <text x="498" y="145" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">defer rows.Close()</text>
  <text x="498" y="160" text-anchor="middle" font-size="11" fill="#16a34a">conn → пул</text>
  <text x="592" y="145" font-size="11" opacity="0.7">повторный</text>
  <text x="592" y="159" font-size="11" opacity="0.7">Close безопасен</text>

  <!-- утечка -->
  <path d="M284,168 C 284,214 360,228 418,228" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="336" y="248" font-size="11" fill="#dc2626">без defer</text>
  <rect x="420" y="208" width="264" height="44" rx="4" fill="#dc2626" fill-opacity="0.1" stroke="#dc2626" stroke-width="1.2"/>
  <text x="552" y="226" text-anchor="middle" font-size="12" fill="#dc2626">conn не вернётся в пул — утечка</text>
  <text x="552" y="243" text-anchor="middle" font-size="11" fill="#dc2626">пул кончится → запросы ждут (WaitCount)</text>
</svg>
