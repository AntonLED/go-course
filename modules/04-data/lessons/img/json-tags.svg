<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-label="Как теги полей User превращаются в JSON: имена из тегов, omitempty пропускает пустой Email, минус скрывает Password, string кладёт число в кавычки, неэкспортируемое поле не видно" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Теги json: поле → ключ</title>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker>
    <marker id="ac" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/></marker>
  </defs>

  <g font-size="11" opacity="0.6">
    <text x="16" y="16">поле структуры User</text>
    <text x="290" y="16">значение u</text>
    <text x="400" y="16">ключ в json.Marshal(u)</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <!-- поля -->
    <text x="16" y="44">ID <tspan opacity="0.6">int64</tspan> <tspan fill="#0891b2">`json:"id"`</tspan></text>
    <text x="16" y="74">Name <tspan opacity="0.6">string</tspan> <tspan fill="#0891b2">`json:"name"`</tspan></text>
    <text x="16" y="104">Email <tspan fill="#0891b2">`json:"email,omitempty"`</tspan></text>
    <text x="16" y="134">Password <tspan fill="#0891b2">`json:"-"`</tspan></text>
    <text x="16" y="164">Balance <tspan fill="#0891b2">`json:"balance,string"`</tspan></text>
    <text x="16" y="194">CreatedAt <tspan fill="#0891b2">`json:"created_at"`</tspan></text>
    <text x="16" y="224">internal <tspan opacity="0.6">int</tspan></text>

    <!-- значения -->
    <g opacity="0.75">
      <text x="290" y="44">7</text>
      <text x="290" y="74">"Ann"</text>
      <text x="290" y="104">""</text>
      <text x="290" y="134">"s3cret"</text>
      <text x="290" y="164">100</text>
      <text x="290" y="194">t</text>
      <text x="290" y="224">1</text>
    </g>

    <!-- результат -->
    <text x="400" y="44">"id": 7</text>
    <text x="400" y="74">"name": "Ann"</text>
    <text x="400" y="164">"balance": <tspan fill="#0891b2">"100"</tspan></text>
    <text x="400" y="194">"created_at": "2024-05-01T10:00:00Z"</text>
  </g>

  <!-- стрелки: попали в JSON -->
  <g stroke="currentColor" stroke-width="1.3">
    <line x1="356" y1="40" x2="392" y2="40" marker-end="url(#a)"/>
    <line x1="356" y1="70" x2="392" y2="70" marker-end="url(#a)"/>
    <line x1="356" y1="190" x2="392" y2="190" marker-end="url(#a)"/>
  </g>
  <line x1="356" y1="160" x2="392" y2="160" stroke="#0891b2" stroke-width="1.3" marker-end="url(#ac)"/>

  <!-- не попали -->
  <g stroke="#dc2626" stroke-width="1.8">
    <path d="M368,94 l12,12 M380,94 l-12,12"/>
    <path d="M368,124 l12,12 M380,124 l-12,12"/>
    <path d="M368,214 l12,12 M380,214 l-12,12"/>
  </g>
  <g font-size="12" opacity="0.8">
    <text x="400" y="104">пропущено: нулевое значение (omitempty)</text>
    <text x="400" y="134">никогда не сериализуется</text>
    <text x="400" y="224">не видно: поле неэкспортируемое</text>
  </g>

  <!-- итог -->
  <rect x="16" y="244" width="668" height="44" rx="4" fill="#0891b2" fill-opacity="0.08" stroke="#0891b2" stroke-width="1" stroke-opacity="0.6"/>
  <text x="28" y="262" font-size="11" opacity="0.7">итог (t — 2024-05-01 10:00 UTC, time.Time кодируется в RFC 3339):</text>
  <text x="28" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">{"id":7,"name":"Ann","balance":"100","created_at":"2024-05-01T10:00:00Z"}</text>
</svg>
