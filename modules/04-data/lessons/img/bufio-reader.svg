<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 256" role="img" aria-label="bufio.Reader: буфер buf с индексами r и w; непрочитанное — buf[r:w]; чтение двигает r, fill читает из источника в buf[w:] и двигает w; Peek возвращает buf[r:r+n], не двигая r" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Буфер bufio.Reader</title>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker>
    <marker id="ac" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/></marker>
  </defs>

  <!-- Peek -->
  <path d="M304,24 v-6 h56 v6" fill="none" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="368" y="22" font-size="12" fill="#7c3aed"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Peek(2)</tspan> = buf[r:r+2], r не двигается</text>

  <!-- индексы -->
  <text x="304" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">r</text>
  <line x1="304" y1="44" x2="304" y2="54" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="480" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">w</text>
  <line x1="480" y1="44" x2="480" y2="54" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- буфер -->
  <text x="160" y="78" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">buf</text>
  <rect x="168" y="56" width="136" height="36" fill="currentColor" fill-opacity="0.08"/>
  <rect x="304" y="56" width="176" height="36" fill="#0891b2" fill-opacity="0.18"/>
  <rect x="168" y="56" width="496" height="36" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <line x1="304" y1="56" x2="304" y2="92" stroke="currentColor" stroke-width="1.2"/>
  <line x1="480" y1="56" x2="480" y2="92" stroke="currentColor" stroke-width="1.2"/>
  <text x="236" y="78" text-anchor="middle" font-size="12" opacity="0.6">уже отдано</text>
  <text x="392" y="78" text-anchor="middle" font-size="12" fill="#0891b2">непрочитано buf[r:w]</text>
  <text x="572" y="78" text-anchor="middle" font-size="12" opacity="0.6">свободно</text>
  <g font-size="11" opacity="0.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="168" y="108">0</text><text x="664" y="108">4096</text>
  </g>

  <!-- источник и fill -->
  <rect x="544" y="152" width="136" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="612" y="169" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">rd</text>
  <text x="612" y="184" text-anchor="middle" font-size="11" opacity="0.7">файл, сокет…</text>
  <line x1="572" y1="152" x2="572" y2="96" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="560" y="124" text-anchor="end" font-size="11"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">fill()</tspan>: rd.Read(buf[w:]),</text>
  <text x="560" y="139" text-anchor="end" font-size="11">w += n — крупным куском</text>

  <!-- потребитель -->
  <line x1="392" y1="92" x2="392" y2="170" stroke="#0891b2" stroke-width="1.4" marker-end="url(#ac)"/>
  <text x="384" y="124" text-anchor="end" font-size="11" fill="#0891b2">копия в p,</text>
  <text x="384" y="139" text-anchor="end" font-size="11" fill="#0891b2">r += n</text>
  <rect x="304" y="172" width="176" height="36" rx="4" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <text x="392" y="188" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ReadString('\n')</text>
  <text x="392" y="202" text-anchor="middle" font-size="11" opacity="0.7">ReadByte, ReadRune…</text>

  <!-- пояснения -->
  <text x="16" y="164" font-size="11" opacity="0.7">r == w → буфер пуст → fill()</text>
  <text x="16" y="180" font-size="11" opacity="0.7">перед fill() остаток buf[r:w]</text>
  <text x="16" y="196" font-size="11" opacity="0.7">сдвигается в начало</text>
  <text x="16" y="236" font-size="11" opacity="0.7">Системный вызов — только в fill(); мелкие чтения обслуживаются из памяти.</text>
  <text x="16" y="252" font-size="11" fill="#dc2626">Второй bufio.Reader над тем же rd не увидит байты, уже лежащие в buf[r:w] первого.</text>
</svg>
