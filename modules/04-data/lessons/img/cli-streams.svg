<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" role="img" aria-label="Процесс tool в конвейере shell: stdout идёт по трубе в jq и дальше в файл, stderr — на экран терминала, код возврата — в shell" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>stdin, stdout, stderr и код возврата</title>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker>
    <marker id="ac" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/></marker>
    <marker id="ao" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker>
    <marker id="ap" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker>
  </defs>

  <text x="16" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.7">$ ./tool report data.txt | jq . &gt; out.json</text>

  <!-- stdin -->
  <rect x="16" y="48" width="128" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="80" y="65" text-anchor="middle">терминал</text>
  <text x="80" y="80" text-anchor="middle" font-size="11" opacity="0.7">клавиатура</text>
  <line x1="144" y1="68" x2="198" y2="68" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- процесс -->
  <rect x="200" y="40" width="144" height="112" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.4"/>
  <text x="272" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">tool</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <text x="208" y="72">0 stdin</text>
    <text x="336" y="72" text-anchor="end" fill="#0891b2">1 stdout</text>
    <text x="208" y="144" fill="#d97706">2 stderr</text>
  </g>

  <!-- stdout → jq → файл -->
  <line x1="344" y1="68" x2="438" y2="68" stroke="#0891b2" stroke-width="1.6" marker-end="url(#ac)"/>
  <text x="391" y="60" text-anchor="middle" font-size="11" fill="#0891b2">труба |</text>
  <text x="391" y="84" text-anchor="middle" font-size="11" opacity="0.7">результат</text>
  <rect x="440" y="48" width="96" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="488" y="72" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">jq .</text>
  <line x1="536" y1="68" x2="578" y2="68" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="557" y="60" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">&gt;</text>
  <rect x="580" y="48" width="100" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="630" y="72" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">out.json</text>

  <!-- stderr → экран -->
  <line x1="216" y1="152" x2="140" y2="206" stroke="#d97706" stroke-width="1.6" marker-end="url(#ao)"/>
  <text x="16" y="164" font-size="11" fill="#d97706">ошибки, прогресс,</text>
  <text x="16" y="178" font-size="11" fill="#d97706">справка по ошибке</text>
  <rect x="16" y="208" width="232" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="132" y="225" text-anchor="middle">экран терминала</text>
  <text x="132" y="240" text-anchor="middle" font-size="11" opacity="0.7">виден, даже если stdout в файле</text>

  <!-- код возврата -->
  <line x1="320" y1="152" x2="320" y2="206" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#ap)"/>
  <text x="328" y="184" font-size="11" fill="#7c3aed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">os.Exit(code)</text>
  <rect x="264" y="208" width="112" height="40" rx="4" fill="#7c3aed" fill-opacity="0.1" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="320" y="232" text-anchor="middle">shell</text>
  <g font-size="12">
    <text x="392" y="222"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#16a34a">0</tspan> — успех</text>
    <text x="392" y="238"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#dc2626">1</tspan> — ошибка выполнения</text>
    <text x="392" y="254"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#d97706">2</tspan> — неправильное использование</text>
  </g>
  <text x="16" y="282" font-size="11" opacity="0.7">В конвейере <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">$?</tspan> — код последней команды (jq); с <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">set -o pipefail</tspan> — код последней упавшей.</text>
</svg>
