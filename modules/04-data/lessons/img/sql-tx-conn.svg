<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 272" role="img" aria-label="Транзакция занимает одно соединение до Commit. Запрос через db внутри транзакции уходит на другое соединение и не видит её изменений; при MaxOpenConns(1) он ждёт соединение, которое освободит только Commit, — дедлок" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Транзакция и соединения пула</title>
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker>
  </defs>

  <!-- ===== панель A ===== -->
  <text x="16" y="16" font-weight="600">MaxOpenConns ≥ 2</text>
  <g font-size="11" opacity="0.6" text-anchor="middle">
    <text x="96" y="38">conn 1</text><text x="256" y="38">conn 2</text>
  </g>
  <!-- скобка транзакции -->
  <rect x="20" y="48" width="152" height="164" rx="6" fill="#0891b2" fill-opacity="0.07" stroke="#0891b2" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="96" y="230" text-anchor="middle" font-size="11" fill="#0891b2">транзакция tx</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <rect x="32" y="56" width="128" height="30" rx="4" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2"/>
    <text x="96" y="76">db.BeginTx</text>
    <rect x="32" y="96" width="128" height="30" rx="4" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2"/>
    <text x="96" y="116">tx.Exec(…)</text>
    <rect x="192" y="136" width="128" height="30" rx="4" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626"/>
    <text x="256" y="156" fill="#dc2626">db.Query(…)</text>
    <rect x="32" y="176" width="128" height="30" rx="4" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a"/>
    <text x="96" y="196">tx.Commit()</text>
  </g>
  <text x="256" y="184" text-anchor="middle" font-size="11" fill="#dc2626">вне транзакции:</text>
  <text x="256" y="198" text-anchor="middle" font-size="11" fill="#dc2626">не видит изменений tx</text>

  <!-- разделитель -->
  <line x1="350" y1="8" x2="350" y2="250" stroke="currentColor" stroke-width="1" opacity="0.3"/>

  <!-- ===== панель B ===== -->
  <text x="368" y="16" font-weight="600">MaxOpenConns(1)</text>
  <g font-size="11" opacity="0.6" text-anchor="middle">
    <text x="448" y="38">conn 1 (единственное)</text><text x="608" y="38">очередь пула</text>
  </g>
  <rect x="372" y="48" width="152" height="164" rx="6" fill="#0891b2" fill-opacity="0.07" stroke="#0891b2" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="448" y="230" text-anchor="middle" font-size="11" fill="#0891b2">занято tx до Commit</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <rect x="384" y="56" width="128" height="30" rx="4" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2"/>
    <text x="448" y="76">db.BeginTx</text>
    <rect x="384" y="96" width="128" height="30" rx="4" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2"/>
    <text x="448" y="116">tx.Exec(…)</text>
    <rect x="544" y="136" width="128" height="30" rx="4" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-dasharray="4 3"/>
    <text x="608" y="156" fill="#d97706">db.Query(…)</text>
    <rect x="384" y="176" width="128" height="30" rx="4" fill="none" stroke="currentColor" stroke-dasharray="4 3" opacity="0.5"/>
    <text x="448" y="196" opacity="0.5">tx.Commit()</text>
  </g>
  <!-- цикл ожидания -->
  <path d="M544,146 H528" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M608,166 C 608,196 560,192 516,191" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="552" y="128" font-size="11" fill="#dc2626">ждёт conn 1</text>
  <text x="536" y="214" font-size="11" fill="#dc2626">горутина висит в Query,</text>
  <text x="536" y="228" font-size="11" fill="#dc2626">Commit не вызывается</text>
  <text x="536" y="248" font-size="12" fill="#dc2626" font-weight="600">→ дедлок</text>

  <text x="16" y="266" font-size="11" opacity="0.7">Все запросы внутри транзакции — через tx: они идут в её соединение.</text>
</svg>
