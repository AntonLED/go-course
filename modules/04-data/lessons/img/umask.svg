<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 208" role="img" aria-label="Права при создании файла: perm 0666 минус биты umask 022 даёт 0644 — снимаются биты записи для группы и остальных" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Как umask урезает perm</title>

  <!-- заголовки групп -->
  <g font-size="11" opacity="0.6" text-anchor="middle">
    <text x="287" y="16">владелец</text>
    <text x="403" y="16">группа</text>
    <text x="519" y="16">остальные</text>
  </g>

  <!-- ряд perm -->
  <text x="176" y="49" text-anchor="end">perm</text>
  <text x="192" y="49" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0666</text>
  <!-- ряд umask -->
  <text x="176" y="101" text-anchor="end">umask</text>
  <text x="192" y="101" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">022</text>
  <!-- итог -->
  <text x="176" y="165" text-anchor="end" font-weight="600">права файла</text>
  <text x="192" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">0644</text>

  <!-- ячейки: x групп 236, 352, 468; ширина 34 -->
  <g fill="none" stroke="currentColor" stroke-width="1.1" opacity="0.8">
    <rect x="236" y="28" width="102" height="32" rx="3"/><rect x="352" y="28" width="102" height="32" rx="3"/><rect x="468" y="28" width="102" height="32" rx="3"/>
    <rect x="236" y="80" width="102" height="32" rx="3"/><rect x="352" y="80" width="102" height="32" rx="3"/><rect x="468" y="80" width="102" height="32" rx="3"/>
    <rect x="236" y="144" width="102" height="32" rx="3"/><rect x="352" y="144" width="102" height="32" rx="3"/><rect x="468" y="144" width="102" height="32" rx="3"/>
    <path d="M270,28 v32 M304,28 v32 M386,28 v32 M420,28 v32 M502,28 v32 M536,28 v32"/>
    <path d="M270,80 v32 M304,80 v32 M386,80 v32 M420,80 v32 M502,80 v32 M536,80 v32"/>
    <path d="M270,144 v32 M304,144 v32 M386,144 v32 M420,144 v32 M502,144 v32 M536,144 v32"/>
  </g>
  <!-- биты umask -->
  <rect x="386" y="80" width="34" height="32" fill="#dc2626" fill-opacity="0.18"/>
  <rect x="502" y="80" width="34" height="32" fill="#dc2626" fill-opacity="0.18"/>
  <!-- снятые биты в итоге -->
  <rect x="386" y="144" width="34" height="32" fill="#dc2626" fill-opacity="0.08"/>
  <rect x="502" y="144" width="34" height="32" fill="#dc2626" fill-opacity="0.08"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">
    <!-- perm: rw rw rw -->
    <text x="253" y="49">r</text><text x="287" y="49">w</text><text x="321" y="49" opacity="0.4">-</text>
    <text x="369" y="49">r</text><text x="403" y="49">w</text><text x="437" y="49" opacity="0.4">-</text>
    <text x="485" y="49">r</text><text x="519" y="49">w</text><text x="553" y="49" opacity="0.4">-</text>
    <!-- umask: снимает w у группы и остальных -->
    <text x="253" y="101" opacity="0.4">-</text><text x="287" y="101" opacity="0.4">-</text><text x="321" y="101" opacity="0.4">-</text>
    <text x="369" y="101" opacity="0.4">-</text><text x="403" y="101" fill="#dc2626">w</text><text x="437" y="101" opacity="0.4">-</text>
    <text x="485" y="101" opacity="0.4">-</text><text x="519" y="101" fill="#dc2626">w</text><text x="553" y="101" opacity="0.4">-</text>
    <!-- итог: 0644 -->
    <text x="253" y="165" fill="#16a34a">r</text><text x="287" y="165" fill="#16a34a">w</text><text x="321" y="165" opacity="0.4">-</text>
    <text x="369" y="165" fill="#16a34a">r</text><text x="403" y="165" fill="#dc2626">-</text><text x="437" y="165" opacity="0.4">-</text>
    <text x="485" y="165" fill="#16a34a">r</text><text x="519" y="165" fill="#dc2626">-</text><text x="553" y="165" opacity="0.4">-</text>
  </g>

  <!-- операция -->
  <line x1="236" y1="128" x2="570" y2="128" stroke="currentColor" stroke-width="1.2"/>
  <text x="586" y="101" font-size="12">снимает биты</text>
  <text x="586" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">perm &amp;^ umask</text>
  <text x="16" y="200" font-size="11" opacity="0.7">Применяется только при создании (open с O_CREATE). <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">os.Chmod</tspan> ставит права точно — umask на него не действует.</text>
</svg>
