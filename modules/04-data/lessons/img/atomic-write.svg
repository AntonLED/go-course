<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 302" role="img" aria-label="Атомарная запись: CreateTemp, Write, Chmod, Sync, Close меняют только временный файл; читатели name видят старую версию целиком до Rename и новую целиком после" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Атомарная запись через temp + rename</title>

  <!-- заголовки -->
  <g font-size="11" opacity="0.6">
    <text x="16" y="16">шаг</text>
    <text x="236" y="16">временный файл .tmp-*</text>
    <text x="456" y="16">name — что видят читатели</text>
  </g>

  <!-- шаги -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="16" y="49">CreateTemp(dir, ".tmp-*")</text>
    <text x="16" y="85">tmp.Write(data)</text>
    <text x="16" y="121">tmp.Chmod(perm)</text>
    <text x="16" y="157">tmp.Sync()</text>
    <text x="16" y="193">tmp.Close()</text>
    <text x="16" y="229" fill="#0891b2" font-weight="600">os.Rename(tmp, name)</text>
    <text x="16" y="265">fsync каталога</text>
  </g>

  <!-- состояния временного файла -->
  <g fill="none" stroke="currentColor" stroke-width="1" opacity="0.4">
    <rect x="236" y="28" width="204" height="32" rx="3"/>
    <rect x="236" y="64" width="204" height="32" rx="3"/>
    <rect x="236" y="100" width="204" height="32" rx="3"/>
    <rect x="236" y="136" width="204" height="32" rx="3"/>
    <rect x="236" y="172" width="204" height="32" rx="3"/>
    <rect x="236" y="244" width="204" height="32" rx="3"/>
  </g>
  <rect x="236" y="208" width="204" height="32" rx="3" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <g font-size="12">
    <text x="248" y="49">пустой, права 0600</text>
    <text x="248" y="85">данные в page cache</text>
    <text x="248" y="121">права = perm</text>
    <text x="248" y="157">данные и права на диске</text>
    <text x="248" y="193">закрыт (проверить err)</text>
    <text x="248" y="229" fill="#0891b2">подменяет name целиком</text>
    <text x="248" y="265" opacity="0.8">запись каталога на диске</text>
  </g>

  <!-- что видят читатели -->
  <rect x="456" y="28" width="228" height="176" rx="4" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.2" opacity="0.9"/>
  <text x="570" y="100" text-anchor="middle" font-weight="600">старая версия целиком</text>
  <text x="570" y="132" text-anchor="middle" font-size="11" fill="#dc2626">сбой на любом из этих шагов:</text>
  <text x="570" y="147" text-anchor="middle" font-size="11" fill="#dc2626">name не тронут, .tmp-* —</text>
  <text x="570" y="162" text-anchor="middle" font-size="11" fill="#dc2626">удалить через os.Remove</text>
  <rect x="456" y="208" width="228" height="68" rx="4" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="1.2"/>
  <text x="570" y="237" text-anchor="middle" font-weight="600" fill="#16a34a">новая версия целиком</text>
  <text x="570" y="265" text-anchor="middle" font-size="11" opacity="0.8">переживёт и отключение питания</text>

  <!-- граница rename -->
  <line x1="448" y1="206" x2="692" y2="206" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="16" y="298" font-size="11" opacity="0.7">Временный файл — в том же каталоге: rename(2) атомарен только в пределах одной ФС (иначе EXDEV).</text>
</svg>
