<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 259" role="img" aria-label="bufio.Writer копит мелкие записи в буфере 4 КиБ и делает один write(2), когда буфер полон; хвост остаётся в буфере до Flush" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>bufio.Writer и Flush</title>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker>
    <marker id="ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
  </defs>

  <!-- заголовки колонок -->
  <g font-size="11" opacity="0.6" text-anchor="middle">
    <text x="84" y="14">программа</text>
    <text x="352" y="14">буфер bw (4096 Б)</text>
    <text x="620" y="14">f (*os.File)</text>
  </g>

  <!-- ряд 1: буфер заполнился -->
  <text x="84" y="44" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">bw.Write(…)</text>
  <text x="84" y="60" text-anchor="middle" font-size="11" opacity="0.7">много мелких записей</text>
  <line x1="160" y1="48" x2="206" y2="48" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="208" y="32" width="288" height="32" rx="3" fill="#0891b2" fill-opacity="0.18" stroke="#0891b2" stroke-width="1.2"/>
  <g stroke="#0891b2" stroke-width="1" opacity="0.5">
    <line x1="232" y1="32" x2="232" y2="64"/><line x1="250" y1="32" x2="250" y2="64"/><line x1="280" y1="32" x2="280" y2="64"/>
    <line x1="298" y1="32" x2="298" y2="64"/><line x1="336" y1="32" x2="336" y2="64"/><line x1="360" y1="32" x2="360" y2="64"/>
    <line x1="392" y1="32" x2="392" y2="64"/><line x1="420" y1="32" x2="420" y2="64"/><line x1="446" y1="32" x2="446" y2="64"/><line x1="474" y1="32" x2="474" y2="64"/>
  </g>
  <text x="352" y="80" text-anchor="middle" font-size="11" fill="#0891b2">полон</text>
  <line x1="496" y1="48" x2="560" y2="48" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="528" y="41" text-anchor="middle" font-size="11">write(2)</text>
  <rect x="562" y="32" width="116" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="620" y="53" text-anchor="middle" font-size="12">+4096 Б</text>

  <!-- ряд 2: конец без Flush -->
  <text x="84" y="124" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">return</text>
  <text x="84" y="140" text-anchor="middle" font-size="11" fill="#dc2626">без Flush</text>
  <rect x="208" y="112" width="288" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <rect x="208" y="112" width="84" height="32" rx="3" fill="#dc2626" fill-opacity="0.18" stroke="#dc2626" stroke-width="1.2"/>
  <text x="250" y="133" text-anchor="middle" font-size="12" fill="#dc2626">хвост</text>
  <text x="394" y="133" text-anchor="middle" font-size="11" opacity="0.6">свободно</text>
  <line x1="496" y1="128" x2="560" y2="128" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3"/>
  <g stroke="#dc2626" stroke-width="2"><line x1="520" y1="120" x2="536" y2="136"/><line x1="536" y1="120" x2="520" y2="136"/></g>
  <rect x="562" y="112" width="116" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="620" y="133" text-anchor="middle" font-size="12" fill="#dc2626">без хвоста</text>
  <text x="352" y="162" text-anchor="middle" font-size="11" fill="#dc2626">последние байты пропадают вместе с bw</text>

  <!-- ряд 3: Flush -->
  <text x="84" y="208" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">bw.Flush()</text>
  <text x="84" y="224" text-anchor="middle" font-size="11" opacity="0.7">и проверить err</text>
  <rect x="208" y="192" width="288" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <rect x="208" y="192" width="84" height="32" rx="3" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="1.2"/>
  <text x="250" y="213" text-anchor="middle" font-size="12" fill="#16a34a">хвост</text>
  <line x1="496" y1="208" x2="560" y2="208" stroke="#16a34a" stroke-width="1.4" marker-end="url(#ag)"/>
  <text x="528" y="201" text-anchor="middle" font-size="11" fill="#16a34a">write(2)</text>
  <rect x="562" y="192" width="116" height="32" rx="3" fill="none" stroke="#16a34a" stroke-width="1.2"/>
  <text x="620" y="213" text-anchor="middle" font-size="12" fill="#16a34a">всё на месте</text>
  <path d="M208,230 v6 h288 v-6" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <text x="352" y="248" text-anchor="middle" font-size="11" opacity="0.6">после Flush буфер снова пуст</text>
</svg>
