<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" role="img" aria-label="Набор шаблонов — словарь по именам: layout вызывает content по имени; первый Parse через block кладёт content по умолчанию, второй Parse его заменяет; для разных страниц base клонируют и в каждой копии переопределяют content" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>layout, block и define как набор именованных шаблонов</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- вызов -->
  <text x="16" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">t.ExecuteTemplate(w, "layout", data)</text>
  <line x1="60" y1="28" x2="60" y2="70" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- набор -->
  <rect x="16" y="40" width="384" height="224" rx="8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.6"/>
  <text x="392" y="58" text-anchor="end" font-size="11" opacity="0.7">набор t: имя → шаблон</text>

  <rect x="32" y="72" width="352" height="60" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.2"/>
  <text x="44" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">"layout"</text>
  <text x="44" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">&lt;html&gt;…&lt;body&gt;{{template "content" .}}&lt;/body&gt;</text>

  <line x1="200" y1="132" x2="200" y2="158" stroke="#0891b2" stroke-width="1.4" marker-end="url(#arr-acc)"/>
  <text x="210" y="149" font-size="11" fill="#0891b2">вызов по имени</text>

  <rect x="32" y="160" width="352" height="92" rx="5" fill="#0891b2" fill-opacity="0.08" stroke="#0891b2" stroke-width="1.2"/>
  <text x="44" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0891b2">"content"</text>
  <g opacity="0.5">
    <text x="44" y="204" font-size="11.5">Parse №1 (block): «по умолчанию»</text>
    <line x1="44" y1="200" x2="246" y2="200" stroke="currentColor" stroke-width="1"/>
  </g>
  <text x="262" y="204" font-size="11" opacity="0.7">заменён</text>
  <text x="44" y="232" font-size="11.5" fill="#0891b2">Parse №2 (define): <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">&lt;h1&gt;{{.Title}}&lt;/h1&gt;</tspan></text>

  <!-- Clone -->
  <text x="424" y="22" font-weight="600">разные страницы</text>
  <rect x="440" y="40" width="208" height="48" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.2"/>
  <text x="544" y="60" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">base</text>
  <text x="544" y="78" text-anchor="middle" font-size="11" opacity="0.75">layout + content по умолчанию</text>
  <line x1="500" y1="88" x2="480" y2="132" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="588" y1="88" x2="608" y2="132" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="544" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Clone()</text>
  <g font-size="11" text-anchor="middle">
    <rect x="424" y="136" width="112" height="60" rx="5" fill="#0891b2" fill-opacity="0.08" stroke="#0891b2" stroke-width="1.2"/>
    <text x="480" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">users</text>
    <text x="480" y="172" opacity="0.8">layout</text>
    <text x="480" y="188" fill="#0891b2">content: users</text>
    <rect x="552" y="136" width="112" height="60" rx="5" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="608" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">items</text>
    <text x="608" y="172" opacity="0.8">layout</text>
    <text x="608" y="188" fill="#7c3aed">content: items</text>
  </g>
  <text x="424" y="224" font-size="11" opacity="0.8">у каждой копии свой «content»;</text>
  <text x="424" y="240" font-size="11" opacity="0.8">base не меняется, копии не мешают</text>
  <text x="424" y="256" font-size="11" opacity="0.8">друг другу</text>
</svg>
