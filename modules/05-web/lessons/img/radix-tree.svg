<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 288" role="img" aria-label="Radix-дерево маршрутов: общие префиксы вроде user хранятся один раз, параметр :id — отдельный узел, поиск /users/42/orders идёт по дереву за длину пути" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Radix-дерево роутера</title>
  <path d="M56,126.0 H76.0 V86.0 H96" fill="none" stroke="#0891b2" stroke-width="1.8"/>
  <path d="M56,126.0 H76.0 V174.0 H96" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <path d="M160,86.0 H180.0 V54.0 H200" fill="none" stroke="#0891b2" stroke-width="1.8"/>
  <path d="M160,86.0 H180.0 V118.0 H200" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <path d="M240,54.0 H260.0 V54.0 H280" fill="none" stroke="#0891b2" stroke-width="1.8"/>
  <path d="M320,54.0 H340.0 V54.0 H360" fill="none" stroke="#0891b2" stroke-width="1.8"/>
  <path d="M416,54.0 H436.0 V54.0 H456" fill="none" stroke="#0891b2" stroke-width="1.8"/>
  <rect x="16" y="112" width="40" height="28" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="36.0" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">/</text>
  <rect x="96" y="72" width="64" height="28" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="128.0" y="90" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">user</text>
  <rect x="96" y="160" width="80" height="28" rx="5" fill="#16a34a" fill-opacity="0.14" stroke="#16a34a" stroke-width="1.3"/>
  <text x="136.0" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#16a34a">search</text>
  <rect x="200" y="40" width="40" height="28" rx="5" fill="#16a34a" fill-opacity="0.14" stroke="#16a34a" stroke-width="1.3"/>
  <text x="220.0" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#16a34a">s</text>
  <rect x="200" y="104" width="88" height="28" rx="5" fill="#16a34a" fill-opacity="0.14" stroke="#16a34a" stroke-width="1.3"/>
  <text x="244.0" y="122" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#16a34a">-groups</text>
  <rect x="280" y="40" width="40" height="28" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="300.0" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">/</text>
  <rect x="360" y="40" width="56" height="28" rx="5" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="4 2"/>
  <text x="388.0" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7c3aed">:id</text>
  <rect x="456" y="40" width="88" height="28" rx="5" fill="#16a34a" fill-opacity="0.14" stroke="#16a34a" stroke-width="1.3"/>
  <text x="500.0" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#16a34a">/orders</text>
  <text x="568" y="40" font-size="11" opacity="0.7">маршруты:</text>
  <text x="568" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">/users</text>
  <text x="568" y="75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">/users/:id</text>
  <text x="568" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">/users/:id/orders</text>
  <text x="568" y="109" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">/user-groups</text>
  <text x="568" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">/search</text>
  <rect x="216" y="160" width="14" height="14" rx="3" fill="#16a34a" fill-opacity="0.14" stroke="#16a34a"/><text x="236" y="171" font-size="11">узел с хендлером</text>
  <rect x="352" y="160" width="14" height="14" rx="3" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-dasharray="4 2"/><text x="372" y="171" font-size="11">параметр: сегмент до «/»</text>
  <line x1="16" y1="204" x2="664" y2="204" stroke="currentColor" stroke-width="1" opacity="0.2"/>
  <text x="16" y="230" font-size="12">поиск <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">/users/42/orders</tspan>:</text>
  <rect x="196" y="214" width="23" height="24" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.1"/><text x="208" y="230" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">/</text>
  <text x="226" y="230" text-anchor="middle" font-size="12" opacity="0.6">·</text>
  <rect x="233" y="214" width="45" height="24" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.1"/><text x="256" y="230" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">user</text>
  <text x="286" y="230" text-anchor="middle" font-size="12" opacity="0.6">·</text>
  <rect x="292" y="214" width="23" height="24" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.1"/><text x="304" y="230" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">s</text>
  <text x="323" y="230" text-anchor="middle" font-size="12" opacity="0.6">·</text>
  <rect x="330" y="214" width="23" height="24" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.1"/><text x="341" y="230" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">/</text>
  <text x="360" y="230" text-anchor="middle" font-size="12" opacity="0.6">·</text>
  <rect x="367" y="214" width="67" height="24" rx="4" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-width="1.1"/><text x="401" y="230" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7c3aed">42 → id</text>
  <text x="441" y="230" text-anchor="middle" font-size="12" opacity="0.6">·</text>
  <rect x="448" y="214" width="67" height="24" rx="4" fill="#16a34a" fill-opacity="0.08" stroke="#16a34a" stroke-width="1.1"/><text x="482" y="230" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#16a34a">/orders</text>
  <path d="M523,226 l4,4 l8,-9" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="16" y="262" font-size="11" opacity="0.75">Спуск по дереву сравнивает префиксы узлов — O(длина пути), а не O(число маршрутов);</text>
  <text x="16" y="278" font-size="11" opacity="0.75">общий префикс «user» хранится один раз. <tspan fill="#16a34a">●</tspan> у <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">:id</tspan> — на нём тоже висит хендлер (/users/:id).</text>
  <circle cx="412" cy="42" r="4" fill="#16a34a"/>
</svg>
