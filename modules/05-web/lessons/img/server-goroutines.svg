<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 412" role="img" aria-label="Горутина Serve принимает соединения и на каждое запускает go c.serve; в HTTP/1.1 горутина соединения в цикле читает запрос, вызывает ServeHTTP и ждёт следующий; в HTTP/2 каждый поток обрабатывается в своей горутине" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Горутины net/http-сервера</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Serve -->
  <text x="160" y="42" text-anchor="end" font-weight="600">горутина Serve</text>
  <rect x="176" y="20" width="328" height="36" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.2"/>
  <text x="340" y="43" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">for { rw, _ := l.Accept(); go c.serve(ctx) }</text>
  <path d="M240,56 L176,98" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
  <path d="M440,56 L508,98" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="176" y="80" text-anchor="end" font-size="11" opacity="0.7">соединение 1</text>
  <text x="500" y="80" font-size="11" opacity="0.7">соединение 2</text>
  <text x="340" y="84" text-anchor="middle" font-size="11" opacity="0.6">… по горутине на каждое</text>

  <!-- HTTP/1.1 соединение -->
  <rect x="16" y="100" width="320" height="304" rx="8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.6"/>
  <text x="32" y="122" font-weight="600">c.serve — HTTP/1.1</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <rect x="72" y="136" width="240" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="192" y="153">c.readRequest(ctx)</text>
    <rect x="72" y="196" width="240" height="40" rx="5" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.4"/>
    <text x="192" y="213" fill="#0891b2">handler.ServeHTTP(w, r)</text>
    <rect x="72" y="256" width="240" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="192" y="273">w.finishRequest()</text>
    <rect x="72" y="316" width="240" height="40" rx="5" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
    <text x="192" y="333">c.bufr.Peek(4)</text>
  </g>
  <g font-size="11" text-anchor="middle" opacity="0.7">
    <text x="192" y="169">стартовая строка + заголовки</text>
    <text x="192" y="289">сброс буфера, отправка ответа</text>
    <text x="192" y="349">ждём следующий запрос (idle)</text>
  </g>
  <text x="192" y="229" text-anchor="middle" font-size="11" fill="#0891b2">ваш хендлер — в этой же горутине</text>
  <g stroke="currentColor" stroke-width="1.3" fill="none">
    <line x1="192" y1="176" x2="192" y2="194" marker-end="url(#arr)"/>
    <line x1="192" y1="236" x2="192" y2="254" marker-end="url(#arr)"/>
    <line x1="192" y1="296" x2="192" y2="314" marker-end="url(#arr)"/>
    <path d="M72,336 H44 V156 H70" marker-end="url(#arr)"/>
  </g>
  <text x="38" y="246" font-size="11" text-anchor="middle" transform="rotate(-90 38 246)" opacity="0.8">keep-alive</text>
  <line x1="192" y1="356" x2="192" y2="374" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-red)"/>
  <text x="192" y="392" text-anchor="middle" font-size="11" fill="#dc2626">таймаут / EOF / Connection: close → закрыть</text>

  <!-- HTTP/2 соединение -->
  <rect x="352" y="100" width="312" height="304" rx="8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.6"/>
  <text x="368" y="122" font-weight="600">c.serve — HTTP/2</text>
  <rect x="388" y="136" width="240" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="508" y="153" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">sc.serve()</text>
  <text x="508" y="169" text-anchor="middle" font-size="11" opacity="0.7">фреймы всех потоков, запись ответов</text>
  <g stroke="#0891b2" stroke-width="1.3" fill="none">
    <path d="M508,176 V200 M408,200 H608"/>
    <line x1="408" y1="200" x2="408" y2="236" marker-end="url(#arr-acc)"/>
    <line x1="508" y1="200" x2="508" y2="236" marker-end="url(#arr-acc)"/>
    <line x1="608" y1="200" x2="608" y2="236" marker-end="url(#arr-acc)"/>
  </g>
  <text x="516" y="193" font-size="11" fill="#0891b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">go sc.runHandler</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">
    <rect x="362" y="238" width="92" height="44" rx="5" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.4"/>
    <text x="408" y="256" fill="#0891b2">ServeHTTP</text><text x="408" y="272" font-family="ui-sans-serif, system-ui, sans-serif" opacity="0.8">поток 1</text>
    <rect x="462" y="238" width="92" height="44" rx="5" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.4"/>
    <text x="508" y="256" fill="#0891b2">ServeHTTP</text><text x="508" y="272" font-family="ui-sans-serif, system-ui, sans-serif" opacity="0.8">поток 3</text>
    <rect x="562" y="238" width="92" height="44" rx="5" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.4"/>
    <text x="608" y="256" fill="#0891b2">ServeHTTP</text><text x="608" y="272" font-family="ui-sans-serif, system-ui, sans-serif" opacity="0.8">поток 5</text>
  </g>
  <g font-size="12" opacity="0.8">
    <text x="368" y="316">запросы одного соединения</text>
    <text x="368" y="334">выполняются параллельно:</text>
    <text x="368" y="352">по горутине на поток</text>
  </g>
</svg>
