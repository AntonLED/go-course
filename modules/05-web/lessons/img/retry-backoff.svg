<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 356" role="img" aria-label="Ретраи: попытки с растущими паузами и jitter, Retry-After важнее собственного backoff; пауза растёт как base·2^n до потолка и выбирается случайно; без jitter клиенты повторяют залпами, с jitter — равномерно" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Экспоненциальный backoff с jitter</title>
  <text x="16" y="20" font-size="12" font-weight="600">попытки одного запроса <tspan font-weight="400" opacity="0.6">(не в масштабе)</tspan></text>
  <rect x="16" y="34" width="88" height="28" rx="4" fill="#dc2626" fill-opacity="0.14" stroke="#dc2626" stroke-width="1.3"/><text x="60.0" y="52" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#dc2626">1 → 503</text>
  <line x1="104" y1="48" x2="184" y2="48" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="144.0" y="80" text-anchor="middle" font-size="11" fill="currentColor">пауза ∈ [0, 100 мс]</text>
  <rect x="184" y="34" width="104" height="28" rx="4" fill="#dc2626" fill-opacity="0.14" stroke="#dc2626" stroke-width="1.3"/><text x="236.0" y="52" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#dc2626">2 → reset</text>
  <line x1="288" y1="48" x2="376" y2="48" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="332.0" y="80" text-anchor="middle" font-size="11" fill="currentColor">пауза ∈ [0, 200 мс]</text>
  <rect x="376" y="34" width="88" height="28" rx="4" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.3"/><text x="420.0" y="52" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#d97706">3 → 429</text>
  <line x1="464" y1="48" x2="576" y2="48" stroke="#d97706" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="520.0" y="80" text-anchor="middle" font-size="11" fill="#d97706">Retry-After: 2 → 2 с</text>
  <path d="M516,40 l4,8 l-4,8 M524,40 l4,8 l-4,8" fill="none" stroke="#d97706" stroke-width="1.3"/>
  <rect x="576" y="34" width="88" height="28" rx="4" fill="#16a34a" fill-opacity="0.14" stroke="#16a34a" stroke-width="1.3"/><text x="620.0" y="52" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#16a34a">4 → 200</text>
  <text x="16" y="104" font-size="11" opacity="0.75">Тело для повтора — заново через <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">req.GetBody()</tspan>; каждая пауза — <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">select</tspan> по <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">timer.C</tspan> и <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ctx.Done()</tspan>.</text>
  <line x1="16" y1="122" x2="664" y2="122" stroke="currentColor" stroke-width="1" opacity="0.2"/>
  <text x="16" y="146" font-size="12" font-weight="600">пауза перед попыткой n</text>
  <text x="16" y="162" font-size="11" opacity="0.75"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">d = min(cap, base·2ⁿ)</tspan>, спим случайное из [0, d]</text>
