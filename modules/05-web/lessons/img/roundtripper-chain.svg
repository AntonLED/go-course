<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 216" role="img" aria-label="RoundTripper как middleware клиента: http.Client передаёт запрос в logRT, тот в authTransport, который клонирует запрос и добавляет Authorization, затем в http.Transport и в сеть; ответ возвращается обратно через те же слои" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Цепочка RoundTripper</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
  </defs>
  <text x="16" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">&amp;http.Client{Transport: &amp;logRT{base: &amp;authTransport{base: http.DefaultTransport}}}</text>
  <rect x="16" y="40" width="112" height="64" rx="6" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.3"/>
  <text x="72" y="76" text-anchor="middle" font-weight="600" fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">http.Client</text>
  <text x="72" y="124" text-anchor="middle" opacity="0.8" font-size="11">Timeout, Jar,</text>
  <text x="72" y="139" text-anchor="middle" opacity="0.8" font-size="11">редиректы: каждый —</text>
  <text x="72" y="154" text-anchor="middle" opacity="0.8" font-size="11">снова по цепочке</text>
  <rect x="150" y="40" width="112" height="64" rx="6" fill="#7c3aed" fill-opacity="0.1" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="206" y="76" text-anchor="middle" font-weight="600" fill="#7c3aed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">logRT</text>
  <text x="206" y="124" text-anchor="middle" opacity="0.8" font-size="11">засечь время;</text>
  <text x="206" y="139" text-anchor="middle" opacity="0.8" font-size="11">после — статус</text>
  <text x="206" y="154" text-anchor="middle" opacity="0.8" font-size="11">и длительность</text>
  <rect x="284" y="40" width="112" height="64" rx="6" fill="#0891b2" fill-opacity="0.1" stroke="#0891b2" stroke-width="1.3"/>
  <text x="340" y="76" text-anchor="middle" font-weight="600" fill="#0891b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">authTransport</text>
  <text x="340" y="124" text-anchor="middle" opacity="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">r := req.Clone(ctx)</text>
  <text x="340" y="139" text-anchor="middle" opacity="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">r.Header.Set(</text>
  <text x="340" y="154" text-anchor="middle" opacity="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">"Authorization", …)</text>
  <rect x="418" y="40" width="112" height="64" rx="6" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a" stroke-width="1.3"/>
  <text x="474" y="76" text-anchor="middle" font-weight="600" fill="#16a34a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">http.Transport</text>
  <text x="474" y="124" text-anchor="middle" opacity="0.8" font-size="11">пул соединений,</text>
  <text x="474" y="139" text-anchor="middle" opacity="0.8" font-size="11">TLS, HTTP/2,</text>
  <text x="474" y="154" text-anchor="middle" opacity="0.8" font-size="11">прокси</text>
  <rect x="552" y="40" width="112" height="64" rx="6" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="608" y="76" text-anchor="middle" font-weight="600" fill="currentColor">сервер</text>
  <line x1="130" y1="58" x2="148" y2="58" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="148" y1="88" x2="130" y2="88" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-ok)"/>
  <line x1="264" y1="58" x2="282" y2="58" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="282" y1="88" x2="264" y2="88" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-ok)"/>
  <line x1="398" y1="58" x2="416" y2="58" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="416" y1="88" x2="398" y2="88" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-ok)"/>
  <line x1="532" y1="58" x2="550" y2="58" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="550" y1="88" x2="532" y2="88" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-ok)"/>
  <g font-size="11"><text x="16" y="186" opacity="0.8">→ запрос: </text><text x="80" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">RoundTrip(req)</text><text x="196" y="186" fill="#16a34a">⇠ ответ: resp или err — обратно через те же слои</text></g>
  <text x="16" y="206" font-size="11" opacity="0.8">Контракт: req не менять, ответ не интерпретировать (редиректы, auth — дело Client), закрыть req.Body.</text>
</svg>
