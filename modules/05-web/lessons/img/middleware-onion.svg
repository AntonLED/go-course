<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 356" role="img" aria-label="Middleware как луковица: запрос проходит RequestID, Logging, Recover, Auth и попадает в mux, ответ возвращается через те же слои в обратном порядке" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Цепочка middleware как луковица</title>
  <defs>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="16" y="40" width="648" height="236" rx="10" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.3"/>
  <text x="124" y="63" font-weight="600" fill="currentColor">RequestID</text>
  <text x="212" y="63" font-size="12" opacity="0.85">взять или создать ID → ctx</text>
  <rect x="36" y="76" width="608" height="188" rx="10" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="124" y="99" font-weight="600" fill="#7c3aed">Logging</text>
  <text x="212" y="99" font-size="12" opacity="0.85"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">start := time.Now()</tspan></text>
  <text x="556" y="99" font-size="12" opacity="0.85" text-anchor="end">лог: статус, время</text>
  <rect x="56" y="112" width="568" height="140" rx="10" fill="#d97706" fill-opacity="0.06" stroke="#d97706" stroke-width="1.3"/>
  <text x="124" y="135" font-weight="600" fill="#d97706">Recover</text>
  <text x="212" y="135" font-size="12" opacity="0.85"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">defer recover()</tspan></text>
  <text x="556" y="135" font-size="12" opacity="0.85" text-anchor="end">паника → 500</text>
  <rect x="76" y="148" width="528" height="92" rx="10" fill="#0891b2" fill-opacity="0.06" stroke="#0891b2" stroke-width="1.3"/>
  <text x="124" y="171" font-weight="600" fill="#0891b2">Auth</text>
  <text x="212" y="171" font-size="12" opacity="0.85">нет прав → 401, next не зовём</text>
  <rect x="96" y="184" width="488" height="44" rx="6" fill="#16a34a" fill-opacity="0.14" stroke="#16a34a" stroke-width="1.4"/>
  <text x="340" y="211" text-anchor="middle" fill="#16a34a"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">mux</tspan> → ваш хендлер</text>
  <line x1="108" y1="14" x2="108" y2="206" stroke="#0891b2" stroke-width="1.6" marker-end="url(#arr-acc)"/>
  <line x1="572" y1="206" x2="572" y2="14" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr-ok)"/>
  <text x="118" y="24" font-size="12" fill="#0891b2">запрос: снаружи внутрь</text>
  <text x="562" y="24" font-size="12" fill="#16a34a" text-anchor="end">ответ: изнутри наружу</text>
  <text x="16" y="304" font-size="12" opacity="0.8"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Chain(mux, RequestID, Logging(l), Recover(l), Auth)</tspan> идёт по списку с конца:</text>
  <text x="16" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">h = Auth(mux) → h = Recover(l)(h) → h = Logging(l)(h) → h = RequestID(h)</text>
  <text x="16" y="346" font-size="12" opacity="0.8">первый в списке оборачивает последним и оказывается снаружи</text>
</svg>
