<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 252" role="img" aria-label="Слева: множество путей /users/new вложено в множество /users/{id}, поэтому /users/new специфичнее и побеждает. Справа: /users/{id} и /{kind}/new пересекаются на /users/new, но ни один не вложен в другой — регистрация паникует" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Специфичность паттернов как вложенность множеств</title>

  <!-- левая панель -->
  <text x="168" y="22" text-anchor="middle" font-weight="600" fill="#16a34a">вложены → побеждает внутренний</text>
  <ellipse cx="168" cy="126" rx="148" ry="86" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.3"/>
  <text x="168" y="66" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">/users/{id}</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" opacity="0.6">
    <text x="64" y="118">/users/42</text>
    <text x="64" y="158">/users/abc</text>
  </g>
  <circle cx="226" cy="138" r="46" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.4"/>
  <text x="226" y="134" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">/users/new</text>
  <text x="226" y="152" text-anchor="middle" font-size="11" fill="#0891b2">один путь</text>
  <text x="168" y="240" text-anchor="middle" font-size="12">GET /users/new → хендлер <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/users/new</tspan></text>

  <line x1="340" y1="16" x2="340" y2="244" stroke="currentColor" stroke-width="1" opacity="0.2"/>

  <!-- правая панель -->
  <text x="512" y="22" text-anchor="middle" font-weight="600" fill="#dc2626">пересекаются → panic при Handle</text>
  <ellipse cx="460" cy="138" rx="104" ry="76" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.3"/>
  <ellipse cx="564" cy="138" rx="104" ry="76" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="404" y="52" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">/users/{id}</text>
  <text x="620" y="52" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7c3aed">/{kind}/new</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" opacity="0.6" text-anchor="middle">
    <text x="410" y="142">/users/42</text>
    <text x="616" y="142">/posts/new</text>
  </g>
  <text x="512" y="134" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#dc2626">/users/new</text>
  <text x="512" y="152" text-anchor="middle" font-size="11" fill="#dc2626">чей?</text>
  <text x="512" y="240" text-anchor="middle" font-size="12">ни один не вложен в другой — конфликт</text>
</svg>
