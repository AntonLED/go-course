<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262" role="img" aria-label="Таймауты HTTP-клиента на шкале запроса: Dialer.Timeout — установка TCP, TLSHandshakeTimeout — рукопожатие, ResponseHeaderTimeout — ожидание заголовков после отправки запроса, Client.Timeout и контекст — весь запрос вместе с чтением тела" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Таймауты http.Client и Transport</title>
  <text x="476" y="16" text-anchor="middle" font-size="11"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Do</tspan> вернул resp</text><line x1="476" y1="21" x2="476" y2="38" stroke="currentColor" stroke-width="1.2"/>
  <text x="16" y="55" font-weight="600">запрос</text>
  <rect x="180" y="38" width="56" height="26" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.2"/><text x="208.0" y="55" text-anchor="middle" font-size="11" fill="currentColor">dial</text>
  <rect x="236" y="38" width="68" height="26" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.2"/><text x="270.0" y="55" text-anchor="middle" font-size="11" fill="currentColor">TLS</text>
  <rect x="304" y="38" width="52" height="26" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.2"/><text x="330.0" y="55" text-anchor="middle" font-size="11" fill="currentColor">запрос</text>
  <rect x="356" y="38" width="120" height="26" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/><text x="416.0" y="55" text-anchor="middle" font-size="11" fill="#d97706">ждём заголовки</text>
  <rect x="476" y="38" width="164" height="26" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/><text x="558.0" y="55" text-anchor="middle" font-size="11" fill="#0891b2">читаем resp.Body</text>
  <text x="16" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Dialer.Timeout</text>
  <rect x="180" y="90" width="64" height="16" rx="2" fill="currentColor" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/>
  <line x1="244" y1="85" x2="244" y2="111" stroke="currentColor" stroke-width="2"/>
  <text x="252" y="102" font-size="11">3 с</text>
  <text x="16" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">TLSHandshakeTimeout</text>
  <rect x="236" y="126" width="80" height="16" rx="2" fill="currentColor" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/>
  <line x1="316" y1="121" x2="316" y2="147" stroke="currentColor" stroke-width="2"/>
  <text x="324" y="138" font-size="11">3 с</text>
  <text x="16" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ResponseHeaderTimeout</text>
  <rect x="356" y="162" width="152" height="16" rx="2" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1.2"/>
  <line x1="508" y1="157" x2="508" y2="183" stroke="#d97706" stroke-width="2"/>
  <text x="516" y="174" font-size="11">5 с</text>
  <text x="360" y="192" text-anchor="start" font-size="11" fill="#d97706">после полной отправки запроса</text>
  <text x="16" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Client.Timeout</text>
  <rect x="180" y="206" width="472" height="16" rx="2" fill="#7c3aed" fill-opacity="0.16" stroke="#7c3aed" stroke-width="1.2"/>
  <line x1="652" y1="201" x2="652" y2="227" stroke="#7c3aed" stroke-width="2"/>
  <text x="416.0" y="218" text-anchor="middle" font-size="11" fill="#7c3aed">10 с: всё, включая редиректы и чтение тела</text>
  <text x="16" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ctx (дедлайн)</text>
  <rect x="180" y="242" width="400" height="16" rx="2" fill="#0891b2" fill-opacity="0.1" stroke="#0891b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="580" y1="237" x2="580" y2="263" stroke="#0891b2" stroke-width="2"/>
  <text x="380" y="254" text-anchor="middle" font-size="11" fill="#0891b2">свой на каждый запрос, прерывает любую стадию</text>
</svg>
