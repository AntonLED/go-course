<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-label="HTTP/1.1 обрабатывает запросы в соединении по очереди; HTTP/2 перемешивает фреймы потоков в одном TCP, и потеря сегмента тормозит все потоки; HTTP/3 на QUIC тормозит только поток с потерей" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>HTTP/1.1, HTTP/2 и HTTP/3 в одном соединении</title>

  <!-- HTTP/1.1 -->
  <text x="16" y="24" font-weight="600">HTTP/1.1</text>
  <text x="16" y="42" font-size="11" opacity="0.6">TCP, keep-alive</text>
  <rect x="140" y="10" width="524" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">
    <rect x="148" y="18" width="56" height="24" rx="3" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2"/><text x="176" y="34" fill="#0891b2">GET /a</text>
    <rect x="208" y="18" width="80" height="24" rx="3" fill="#0891b2" fill-opacity="0.4" stroke="#0891b2"/><text x="248" y="34" fill="#0891b2">200 /a</text>
    <rect x="316" y="18" width="56" height="24" rx="3" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed"/><text x="344" y="34" fill="#7c3aed">GET /b</text>
    <rect x="376" y="18" width="80" height="24" rx="3" fill="#7c3aed" fill-opacity="0.4" stroke="#7c3aed"/><text x="416" y="34" fill="#7c3aed">200 /b</text>
    <rect x="484" y="18" width="56" height="24" rx="3" fill="currentColor" fill-opacity="0.08" stroke="currentColor"/><text x="512" y="34">GET /c</text>
    <rect x="544" y="18" width="80" height="24" rx="3" fill="currentColor" fill-opacity="0.18" stroke="currentColor"/><text x="584" y="34">200 /c</text>
  </g>
  <text x="140" y="72" font-size="12" opacity="0.7">/b уходит только после того, как целиком пришёл ответ /a</text>

  <!-- HTTP/2 -->
  <text x="16" y="120" font-weight="600">HTTP/2</text>
  <text x="16" y="138" font-size="11" opacity="0.6">TCP + TLS, фреймы</text>
  <rect x="140" y="106" width="524" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <g><rect x="148" y="114" width="26" height="24" rx="3" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.2"/><text x="161" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">1</text></g>
  <g><rect x="178" y="114" width="26" height="24" rx="3" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1.2"/><text x="191" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7c3aed">3</text></g>
  <g><rect x="208" y="114" width="26" height="24" rx="3" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.2"/><text x="221" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">5</text></g>
  <g><rect x="238" y="114" width="26" height="24" rx="3" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.2"/><text x="251" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">1</text></g>
  <g><rect x="268" y="114" width="26" height="24" rx="3" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1.2"/><text x="281" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7c3aed">3</text></g>
  <g><rect x="298" y="114" width="26" height="24" rx="3" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.2"/><text x="311" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">5</text></g>
  <g><rect x="328" y="114" width="26" height="24" rx="3" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.2"/><text x="341" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">1</text></g>
  <rect x="358" y="114" width="26" height="24" rx="3" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="3 2"/>
  <path d="M365,120 l12,12 M377,120 l-12,12" stroke="#dc2626" stroke-width="1.6"/>
  <g opacity="0.4"><rect x="388" y="114" width="26" height="24" rx="3" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.2"/><text x="401" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">5</text></g>
  <g opacity="0.4"><rect x="418" y="114" width="26" height="24" rx="3" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.2"/><text x="431" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">1</text></g>
  <g opacity="0.4"><rect x="448" y="114" width="26" height="24" rx="3" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1.2"/><text x="461" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7c3aed">3</text></g>
  <g opacity="0.4"><rect x="478" y="114" width="26" height="24" rx="3" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.2"/><text x="491" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">5</text></g>
  <g opacity="0.4"><rect x="508" y="114" width="26" height="24" rx="3" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.2"/><text x="521" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">1</text></g>
  <g opacity="0.4"><rect x="538" y="114" width="26" height="24" rx="3" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1.2"/><text x="551" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7c3aed">3</text></g>
  <g opacity="0.4"><rect x="568" y="114" width="26" height="24" rx="3" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.2"/><text x="581" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">5</text></g>
  <g opacity="0.4"><rect x="598" y="114" width="26" height="24" rx="3" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.2"/><text x="611" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">1</text></g>
  <g opacity="0.4"><rect x="628" y="114" width="26" height="24" rx="3" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.2"/><text x="641" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">5</text></g>
  <path d="M390,154 v6 h272 v-6" fill="none" stroke="#dc2626" stroke-width="1.2"/>
  <text x="526" y="176" text-anchor="middle" font-size="12" fill="#dc2626">ждут ретрансмиссии — все потоки</text>
  <text x="140" y="176" font-size="12" opacity="0.7">потоки 1, 3, 5 идут вперемешку</text>

  <!-- HTTP/3 -->
  <text x="16" y="224" font-weight="600">HTTP/3</text>
  <text x="16" y="242" font-size="11" opacity="0.6">QUIC поверх UDP</text>
  <rect x="140" y="210" width="524" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <g><rect x="148" y="218" width="26" height="24" rx="3" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.2"/><text x="161" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">1</text></g>
  <g><rect x="178" y="218" width="26" height="24" rx="3" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1.2"/><text x="191" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7c3aed">3</text></g>
  <g><rect x="208" y="218" width="26" height="24" rx="3" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.2"/><text x="221" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">5</text></g>
  <g><rect x="238" y="218" width="26" height="24" rx="3" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.2"/><text x="251" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">1</text></g>
  <g><rect x="268" y="218" width="26" height="24" rx="3" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1.2"/><text x="281" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7c3aed">3</text></g>
  <g><rect x="298" y="218" width="26" height="24" rx="3" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.2"/><text x="311" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">5</text></g>
  <g><rect x="328" y="218" width="26" height="24" rx="3" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.2"/><text x="341" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">1</text></g>
  <rect x="358" y="218" width="26" height="24" rx="3" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="3 2"/>
  <path d="M365,224 l12,12 M377,224 l-12,12" stroke="#dc2626" stroke-width="1.6"/>
  <g><rect x="388" y="218" width="26" height="24" rx="3" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.2"/><text x="401" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">5</text></g>
  <g><rect x="418" y="218" width="26" height="24" rx="3" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.2"/><text x="431" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">1</text></g>
  <g opacity="0.4"><rect x="448" y="218" width="26" height="24" rx="3" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1.2"/><text x="461" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7c3aed">3</text></g>
  <g><rect x="478" y="218" width="26" height="24" rx="3" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.2"/><text x="491" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">5</text></g>
  <g><rect x="508" y="218" width="26" height="24" rx="3" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.2"/><text x="521" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">1</text></g>
  <g opacity="0.4"><rect x="538" y="218" width="26" height="24" rx="3" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1.2"/><text x="551" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7c3aed">3</text></g>
  <g><rect x="568" y="218" width="26" height="24" rx="3" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.2"/><text x="581" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">5</text></g>
  <g><rect x="598" y="218" width="26" height="24" rx="3" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.2"/><text x="611" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">1</text></g>
  <g><rect x="628" y="218" width="26" height="24" rx="3" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.2"/><text x="641" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">5</text></g>
  <text x="140" y="280" font-size="12" opacity="0.7">потеря пакета потока 3 задерживает только поток 3 — 1 и 5 идут дальше</text>

  <!-- легенда -->
  <g font-size="12">
    <rect x="140" y="304" width="14" height="14" rx="2" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2"/><text x="160" y="315">поток 1</text>
    <rect x="228" y="304" width="14" height="14" rx="2" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed"/><text x="248" y="315">поток 3</text>
    <rect x="316" y="304" width="14" height="14" rx="2" fill="currentColor" fill-opacity="0.15" stroke="currentColor"/><text x="336" y="315">поток 5</text>
    <rect x="404" y="304" width="14" height="14" rx="2" fill="none" stroke="#dc2626" stroke-dasharray="3 2"/><path d="M407,307 l8,8 M415,307 l-8,8" stroke="#dc2626" stroke-width="1.4"/><text x="424" y="315">потерянный пакет</text>
    <rect x="552" y="304" width="14" height="14" rx="2" fill="currentColor" fill-opacity="0.15" stroke="currentColor" opacity="0.4"/><text x="572" y="315">ждёт</text>
  </g>
  <text x="664" y="315" text-anchor="end" font-size="11" opacity="0.6">время →</text>
</svg>
