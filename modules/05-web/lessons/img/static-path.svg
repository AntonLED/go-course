<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" role="img" aria-label="Путь запроса /static/css/app.css: mux выбирает поддерево /static/, StripPrefix срезает префикс, FileServerFS открывает css/app.css, fs.Sub дописывает каталог static, и файл находится во встроенной embed.FS" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Как URL превращается в файл из embed.FS</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect x="16" y="16" width="300" height="40" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="28" y="41" font-weight="600">запрос</text>
  <line x1="322" y1="36" x2="356" y2="36" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="364" y="41" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">GET /static/css/app.css</text>
  <line x1="166" y1="56" x2="166" y2="70" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="16" y="72" width="300" height="40" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="28" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">mux.Handle("GET /static/", …)</text><text x="28" y="105" font-size="11" opacity="0.7">поддерево /static/</text>
  <line x1="322" y1="92" x2="356" y2="92" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="364" y="97" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">/static/css/app.css</text>
  <line x1="166" y1="112" x2="166" y2="126" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="16" y="128" width="300" height="40" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="28" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">http.StripPrefix("/static/", …)</text><text x="28" y="161" font-size="11" opacity="0.7">срезает префикс</text>
  <line x1="322" y1="148" x2="356" y2="148" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="364" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#dc2626" opacity="0.7">/static/</text>
  <line x1="364" y1="149" x2="421.84000000000003" y2="149" stroke="#dc2626" stroke-width="1.4"/>
  <text x="427.84000000000003" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">css/app.css</text>
  <line x1="166" y1="168" x2="166" y2="182" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="16" y="184" width="300" height="40" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="28" y="201" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">http.FileServerFS(sub)</text><text x="28" y="217" font-size="11" opacity="0.7">чистит путь, Open без «/»</text>
  <line x1="322" y1="204" x2="356" y2="204" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="364" y="209" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">Open("css/app.css")</text>
  <line x1="166" y1="224" x2="166" y2="238" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="16" y="240" width="300" height="40" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="28" y="257" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">fs.Sub(staticFS, "static")</text><text x="28" y="273" font-size="11" opacity="0.7">дописывает каталог</text>
  <line x1="322" y1="260" x2="356" y2="260" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="364" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#16a34a">static/</text>
  <line x1="364" y1="269" x2="414.61" y2="269" stroke="#16a34a" stroke-width="1.4"/>
  <text x="414.61" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="currentColor">css/app.css</text>
  <line x1="166" y1="280" x2="166" y2="294" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="16" y="296" width="300" height="40" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="28" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">embed.FS  //go:embed static</text><text x="28" y="329" font-size="11" opacity="0.7">файл в бинарнике</text>
  <line x1="322" y1="316" x2="356" y2="316" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="364" y="321" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#16a34a">static/css/app.css</text>
  <path d="M504.14,315 l4,4 l8,-9" fill="none" stroke="#16a34a" stroke-width="2"/>
</svg>
