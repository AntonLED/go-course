<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 332" role="img" aria-label="Graceful shutdown: Shutdown закрывает листенер, затем с нарастающим интервалом закрывает простаивающие соединения и ждёт активные; по истечении контекста возвращает ошибку и остаток закрывает Close; hijacked-соединения не ждёт" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Что происходит при srv.Shutdown(ctx)</title>

  <!-- события сверху -->
  <line x1="200" y1="34" x2="200" y2="244" stroke="currentColor" stroke-width="1.4"/>
  <text x="200" y="24" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">srv.Shutdown(ctx)</text>
  <line x1="600" y1="34" x2="600" y2="244" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="600" y="24" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#dc2626">ctx истёк</text>

  <!-- подписи дорожек -->
  <g font-size="12">
    <text x="16" y="60">Listener</text>
    <text x="16" y="100">idle-соединение</text>
    <text x="16" y="140">активный запрос</text>
    <text x="16" y="180">долгий запрос</text>
    <text x="16" y="220">WebSocket (hijack)</text>
  </g>

  <!-- Listener -->
  <rect x="168" y="48" width="32" height="16" rx="2" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="1.2"/>
  <path d="M202,50 l12,12 M214,50 l-12,12" stroke="#dc2626" stroke-width="1.8"/>
  <text x="224" y="60" font-size="11">закрыт сразу — новых соединений нет</text>

  <!-- idle -->
  <rect x="168" y="88" width="36" height="16" rx="2" fill="#d97706" fill-opacity="0.18" stroke="#d97706" stroke-width="1.2"/>
  <path d="M206,90 l12,12 M218,90 l-12,12" stroke="#dc2626" stroke-width="1.8"/>
  <text x="228" y="100" font-size="11">закрыто на первом же опросе</text>

  <!-- активный -->
  <rect x="168" y="128" width="200" height="16" rx="2" fill="#0891b2" fill-opacity="0.18" stroke="#0891b2" stroke-width="1.2"/>
  <text x="268" y="140" text-anchor="middle" font-size="11" fill="#0891b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ServeHTTP</text>
  <path d="M374,136 l5,5 l9,-10" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="396" y="140" font-size="11">ответ отправлен → закрыто</text>

  <!-- долгий -->
  <rect x="168" y="168" width="432" height="16" rx="2" fill="#0891b2" fill-opacity="0.18" stroke="#0891b2" stroke-width="1.2"/>
  <text x="400" y="180" text-anchor="middle" font-size="11" fill="#0891b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ServeHTTP</text>
  <path d="M604,170 l12,12 M616,170 l-12,12" stroke="#dc2626" stroke-width="1.8"/>
  <text x="624" y="180" font-size="11" fill="#dc2626" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Close()</text>

  <!-- hijacked -->
  <rect x="168" y="208" width="496" height="16" rx="2" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="400" y="220" text-anchor="middle" font-size="11" fill="#7c3aed">Shutdown не ждёт — сигнал через <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">RegisterOnShutdown</tspan></text>

  <!-- опрос -->
  <line x1="200" y1="257" x2="664" y2="257" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <g stroke="currentColor" stroke-width="1.2">
    <line x1="204" y1="252" x2="204" y2="262"/>
    <line x1="208" y1="252" x2="208" y2="262"/>
    <line x1="216" y1="252" x2="216" y2="262"/>
    <line x1="232" y1="252" x2="232" y2="262"/>
    <line x1="264" y1="252" x2="264" y2="262"/>
    <line x1="328" y1="252" x2="328" y2="262"/>
    <line x1="424" y1="252" x2="424" y2="262"/>
    <line x1="520" y1="252" x2="520" y2="262"/>
    <line x1="616" y1="252" x2="616" y2="262"/>
  </g>
  <text x="200" y="280" font-size="11"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">closeIdleConns()</tspan> через 1, 2, 4, 8 … мс, не реже раза в 500 мс</text>
  <text x="16" y="306" font-size="11" opacity="0.7"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ListenAndServe</tspan> сразу вернёт <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ErrServerClosed</tspan>. Все закрылись до дедлайна → <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Shutdown</tspan> вернёт nil;</text>
  <text x="16" y="322" font-size="11" opacity="0.7">иначе — <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ctx.Err()</tspan>, и оставшиеся соединения закрывает <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">srv.Close()</tspan>.</text>
</svg>
