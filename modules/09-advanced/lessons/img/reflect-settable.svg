<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 244" role="img" aria-label="Слева: ValueOf(x) видит копию x внутри интерфейса, CanSet false, SetInt паникует. Справа: ValueOf(&amp;x) даёт Value-указатель, Elem() — адресуемое Value, указывающее на сам x; SetInt(2) меняет x" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Почему settable только через указатель</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- панели -->
  <rect x="12" y="8" width="320" height="228" rx="8" fill="#dc2626" fill-opacity="0.05" stroke="#dc2626" stroke-opacity="0.5" stroke-width="1.2"/>
  <rect x="348" y="8" width="320" height="228" rx="8" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-opacity="0.5" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">
    <text x="172" y="32" fill="#dc2626">v := reflect.ValueOf(x)</text>
    <text x="508" y="32" fill="#16a34a">v := reflect.ValueOf(&amp;x).Elem()</text>
  </g>

  <!-- ЛЕВО -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="32" y="66" opacity="0.7">x</text>
    <rect x="48" y="50" width="88" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="92" y="69" text-anchor="middle">1</text>

    <line x1="92" y1="78" x2="92" y2="118" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
    <text x="100" y="102" font-size="11" opacity="0.7" font-family="ui-sans-serif, system-ui, sans-serif">копируется в any</text>

    <rect x="48" y="122" width="88" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="92" y="141" text-anchor="middle">1</text>
    <text x="92" y="166" text-anchor="middle" font-size="11" opacity="0.6" font-family="ui-sans-serif, system-ui, sans-serif">копия</text>

    <rect x="196" y="122" width="116" height="28" rx="4" fill="#dc2626" fill-opacity="0.1" stroke="#dc2626" stroke-width="1.2"/>
    <text x="254" y="141" text-anchor="middle">Value · Int</text>
    <line x1="196" y1="136" x2="140" y2="136" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
    <text x="168" y="130" text-anchor="middle" font-size="11" opacity="0.7">ptr</text>

    <text x="32" y="198">CanSet() == false</text>
    <text x="32" y="220" fill="#dc2626">SetInt(2) → panic: unaddressable</text>
  </g>

  <!-- ПРАВО -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="368" y="66" opacity="0.7">x</text>
    <rect x="384" y="50" width="88" height="28" rx="4" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.2"/>
    <text x="428" y="69" text-anchor="middle">1 → 2</text>

    <rect x="532" y="50" width="120" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="592" y="69" text-anchor="middle">Value · Ptr</text>
    <line x1="532" y1="64" x2="476" y2="64" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
    <text x="504" y="58" text-anchor="middle" font-size="11" opacity="0.7">&amp;x</text>

    <line x1="592" y1="78" x2="592" y2="118" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
    <text x="600" y="102" font-size="11" opacity="0.8">Elem()</text>

    <rect x="532" y="122" width="120" height="28" rx="4" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a" stroke-width="1.2"/>
    <text x="592" y="141" text-anchor="middle">Value · Int</text>
    <path d="M532,136 L452,136 L452,82" fill="none" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arr-ok)"/>
    <text x="492" y="130" text-anchor="middle" font-size="11" fill="#16a34a" font-family="ui-sans-serif, system-ui, sans-serif">сам x</text>
    <text x="592" y="166" text-anchor="middle" font-size="11" opacity="0.6" font-family="ui-sans-serif, system-ui, sans-serif">адресуемое</text>

    <text x="368" y="198">CanSet() == true</text>
    <text x="368" y="220" fill="#16a34a">SetInt(2) → x == 2</text>
  </g>
</svg>
