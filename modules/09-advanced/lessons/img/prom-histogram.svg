<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 256" role="img" aria-label="Histogram хранит кумулятивные бакеты: каждый le считает все наблюдения не больше границы, поэтому столбцы только растут; le=0.1 равен 900, le=+Inf равен _count 1027; отдельно _sum 53.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
