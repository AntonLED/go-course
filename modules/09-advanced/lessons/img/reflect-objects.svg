<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 256" role="img" aria-label="Значение x упаковывается в any: _type указывает на дескриптор float64, data — на копию 3.14. TypeOf берёт _type и даёт reflect.Type, ValueOf берёт оба слова и даёт reflect.Value; v.Interface() упаковывает значение обратно в any" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Из значения в объекты рефлексии и обратно</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
    <marker id="arr-vio" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- x -->
  <text x="75" y="32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">x float64</text>
  <rect x="20" y="44" width="110" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="75" y="65" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">3.14</text>

  <line x1="130" y1="60" x2="186" y2="60" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="158" y="52" text-anchor="middle" font-size="11" opacity="0.7">в any</text>

  <!-- eface -->
  <text x="280" y="32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">any <tspan font-weight="400" opacity="0.6">(eface)</tspan></text>
  <rect x="190" y="44" width="180" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <line x1="280" y1="44" x2="280" y2="76" stroke="currentColor" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="235" y="65">_type</text><text x="325" y="65">data</text>
  </g>

  <!-- память -->
  <line x1="235" y1="76" x2="235" y2="156" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="325" y1="76" x2="360" y2="156" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="112" y="160" width="192" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.8"/>
  <text x="208" y="180" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">float64</text>
  <text x="208" y="198" text-anchor="middle" font-size="11" opacity="0.7">дескриптор: Size 8, Kind Float64</text>
  <rect x="316" y="160" width="100" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.8"/>
  <text x="366" y="180" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">3.14</text>
  <text x="366" y="198" text-anchor="middle" font-size="11" opacity="0.7">копия x</text>

  <!-- reflect.Type -->
  <rect x="470" y="20" width="190" height="32" rx="4" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="565" y="41" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7c3aed">reflect.Type</text>
  <text x="565" y="68" text-anchor="middle" font-size="11" opacity="0.6">только тип: Name, Kind, Field…</text>
  <line x1="370" y1="52" x2="466" y2="38" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arr-vio)"/>
  <text x="418" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7c3aed">TypeOf</text>

  <!-- reflect.Value -->
  <rect x="470" y="96" width="190" height="32" rx="4" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <text x="565" y="117" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">reflect.Value</text>
  <line x1="370" y1="68" x2="466" y2="108" stroke="#0891b2" stroke-width="1.3" marker-end="url(#arr-acc)"/>
  <text x="400" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0891b2">ValueOf</text>
  <text x="400" y="118" text-anchor="middle" font-size="11" opacity="0.6">закон 1</text>
  <text x="565" y="144" text-anchor="middle" font-size="11" opacity="0.6">тип + указатель на данные + флаги</text>

  <!-- обратно в интерфейс -->
  <line x1="565" y1="152" x2="565" y2="196" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="573" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">v.Interface()</text>
  <rect x="520" y="200" width="90" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="565" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">any</text>
  <text x="565" y="250" text-anchor="middle" font-size="11" opacity="0.6">закон 2 · дальше .(float64)</text>
</svg>
