<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 268" role="img" aria-label="Слева: при живой куче 40 МБ и GOGC=100 куча растёт до цели около 80 МБ, затем GC; при GOGC=200 — до 120 МБ, циклов вдвое меньше. Справа: GOGC=200 с GOMEMLIMIT около 100 МБ — цель ограничена лимитом, GC срабатывает раньше и чаще" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>GOGC и GOMEMLIMIT: цель кучи</title>

  <g font-size="12" font-weight="600">
    <text x="48" y="18">GOGC — цель относительно живой кучи</text>
    <text x="392" y="18">GOMEMLIMIT — потолок сверху</text>
  </g>

  <!-- сетка: y(v) = 200 - v*4/3 -->
  <g stroke="currentColor" stroke-opacity="0.15">
    <line x1="48" y1="40" x2="320" y2="40"/><line x1="48" y1="93.3" x2="320" y2="93.3"/><line x1="48" y1="146.7" x2="320" y2="146.7"/>
    <line x1="392" y1="40" x2="664" y2="40"/><line x1="392" y1="93.3" x2="664" y2="93.3"/><line x1="392" y1="146.7" x2="664" y2="146.7"/>
  </g>
  <g stroke="currentColor" stroke-opacity="0.6">
    <line x1="48" y1="200" x2="320" y2="200"/><line x1="48" y1="36" x2="48" y2="200"/>
    <line x1="392" y1="200" x2="664" y2="200"/><line x1="392" y1="36" x2="392" y2="200"/>
  </g>
  <g font-size="11" opacity="0.6" text-anchor="end">
    <text x="42" y="44">120</text><text x="42" y="97">80</text><text x="42" y="150">40</text><text x="42" y="204">0</text>
    <text x="386" y="44">120</text><text x="386" y="97">80</text><text x="386" y="150">40</text><text x="386" y="204">0</text>
  </g>
  <text x="42" y="30" text-anchor="end" font-size="11" opacity="0.6">МБ</text>
  <text x="386" y="30" text-anchor="end" font-size="11" opacity="0.6">МБ</text>

  <!-- живая куча -->
  <line x1="48" y1="146.7" x2="320" y2="146.7" stroke="currentColor" stroke-dasharray="5 3" stroke-opacity="0.7"/>
  <line x1="392" y1="146.7" x2="664" y2="146.7" stroke="currentColor" stroke-dasharray="5 3" stroke-opacity="0.7"/>

  <!-- левый: GOGC=200 (фиолетовый) -->
  <path d="M56,146.7 L184,40 L184,146.7 L312,40 L312,146.7" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 3"/>
  <!-- левый: GOGC=100 (бирюза) -->
  <path d="M56,146.7 L120,93.3 L120,146.7 L184,93.3 L184,146.7 L248,93.3 L248,146.7 L312,93.3 L312,146.7" fill="none" stroke="#0891b2" stroke-width="1.8"/>

  <!-- лимит -->
  <line x1="392" y1="66.7" x2="664" y2="66.7" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="6 3"/>
  <text x="660" y="60" text-anchor="end" font-size="11" fill="#dc2626">GOMEMLIMIT</text>
  <!-- правый: GOGC=200 + лимит -->
  <path d="M400,146.7 L496,66.7 L496,146.7 L592,66.7 L592,146.7 L656,93.3" fill="none" stroke="#d97706" stroke-width="1.8"/>

  <!-- метки GC -->
  <g font-size="10" text-anchor="middle" opacity="0.7">
    <text x="120" y="162">GC</text><text x="184" y="162">GC</text><text x="248" y="162">GC</text>
    <text x="496" y="162">GC</text><text x="592" y="162">GC</text>
  </g>

  <text x="184" y="214" text-anchor="middle" font-size="11" opacity="0.6">время →</text>
  <text x="528" y="214" text-anchor="middle" font-size="11" opacity="0.6">время →</text>

  <!-- легенда -->
  <g font-size="11">
    <line x1="48" y1="234" x2="72" y2="234" stroke="#0891b2" stroke-width="1.8"/>
    <text x="78" y="238">GOGC=100: цель ≈ 40 × 2 = 80</text>
    <line x1="48" y1="254" x2="72" y2="254" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 3"/>
    <text x="78" y="258">GOGC=200: цель ≈ 40 × 3 = 120</text>
    <line x1="392" y1="234" x2="416" y2="234" stroke="#d97706" stroke-width="1.8"/>
    <text x="422" y="238">GOGC=200 + лимит: GC раньше цели</text>
    <line x1="392" y1="254" x2="416" y2="254" stroke="currentColor" stroke-dasharray="5 3" stroke-opacity="0.7"/>
    <text x="422" y="258">живая куча после маркировки, 40 МБ</text>
  </g>
</svg>
