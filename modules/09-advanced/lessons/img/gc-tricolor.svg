<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 296" role="img" aria-label="Трёхцветная маркировка в три шага: сначала объект A, на который указывают корни, серый; затем A просканирован и стал чёрным, B и C серые; в конце все достижимые A, B, C, D чёрные, а недостижимые E и F остались белыми и будут освобождены при sweep" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Трёхцветная маркировка</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- заголовки шагов -->
  <g font-size="12" font-weight="600">
    <text x="12" y="18">1. корни просканированы</text>
    <text x="236" y="18">2. A просканирован</text>
    <text x="460" y="18">3. серых не осталось</text>
  </g>
  <g stroke="currentColor" stroke-opacity="0.2">
    <line x1="226" y1="8" x2="226" y2="232"/><line x1="450" y1="8" x2="450" y2="232"/>
  </g>

  <!-- ========== шаблон графа (3 копии со смещением) ========== -->
  <!-- шаг 1: ox=12 -->
  <g>
    <rect x="12" y="32" width="64" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
    <text x="44" y="48" text-anchor="middle" font-size="11">корни</text>
    <g stroke="currentColor" stroke-width="1.2" fill="none" opacity="0.8">
      <line x1="44" y1="56" x2="44" y2="81" marker-end="url(#arr)"/>
      <line x1="36" y1="106" x2="28" y2="141" marker-end="url(#arr)"/>
      <line x1="54" y1="104" x2="98" y2="144" marker-end="url(#arr)"/>
      <line x1="108" y1="168" x2="108" y2="193" marker-end="url(#arr)"/>
      <line x1="176" y1="112" x2="176" y2="161" marker-end="url(#arr)"/>
    </g>
    <circle cx="44" cy="94" r="12" fill="#0891b2" fill-opacity="0.3" stroke="#0891b2"/>
    <circle cx="24" cy="154" r="12" fill="none" stroke="currentColor"/>
    <circle cx="108" cy="156" r="12" fill="none" stroke="currentColor"/>
    <circle cx="108" cy="206" r="12" fill="none" stroke="currentColor"/>
    <circle cx="176" cy="100" r="12" fill="none" stroke="currentColor"/>
    <circle cx="176" cy="174" r="12" fill="none" stroke="currentColor"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="62" y="98">A</text><text x="42" y="158">B</text><text x="126" y="160">C</text>
      <text x="126" y="210">D</text><text x="194" y="104">E</text><text x="194" y="178">F</text>
    </g>
  </g>

  <!-- шаг 2: ox=236 -->
  <g>
    <rect x="236" y="32" width="64" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
    <text x="268" y="48" text-anchor="middle" font-size="11">корни</text>
    <g stroke="currentColor" stroke-width="1.2" fill="none" opacity="0.8">
      <line x1="268" y1="56" x2="268" y2="81" marker-end="url(#arr)"/>
      <line x1="260" y1="106" x2="252" y2="141" marker-end="url(#arr)"/>
      <line x1="278" y1="104" x2="322" y2="144" marker-end="url(#arr)"/>
      <line x1="332" y1="168" x2="332" y2="193" marker-end="url(#arr)"/>
      <line x1="400" y1="112" x2="400" y2="161" marker-end="url(#arr)"/>
    </g>
    <circle cx="268" cy="94" r="12" fill="#0891b2" fill-opacity="0.9" stroke="#0891b2"/>
    <circle cx="248" cy="154" r="12" fill="#0891b2" fill-opacity="0.3" stroke="#0891b2"/>
    <circle cx="332" cy="156" r="12" fill="#0891b2" fill-opacity="0.3" stroke="#0891b2"/>
    <circle cx="332" cy="206" r="12" fill="none" stroke="currentColor"/>
    <circle cx="400" cy="100" r="12" fill="none" stroke="currentColor"/>
    <circle cx="400" cy="174" r="12" fill="none" stroke="currentColor"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="286" y="98">A</text><text x="266" y="158">B</text><text x="350" y="160">C</text>
      <text x="350" y="210">D</text><text x="418" y="104">E</text><text x="418" y="178">F</text>
    </g>
  </g>

  <!-- шаг 3: ox=460 -->
  <g>
    <rect x="460" y="32" width="64" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
    <text x="492" y="48" text-anchor="middle" font-size="11">корни</text>
    <g stroke="currentColor" stroke-width="1.2" fill="none" opacity="0.8">
      <line x1="492" y1="56" x2="492" y2="81" marker-end="url(#arr)"/>
      <line x1="484" y1="106" x2="476" y2="141" marker-end="url(#arr)"/>
      <line x1="502" y1="104" x2="546" y2="144" marker-end="url(#arr)"/>
      <line x1="556" y1="168" x2="556" y2="193" marker-end="url(#arr)"/>
      <line x1="624" y1="112" x2="624" y2="161" marker-end="url(#arr)"/>
    </g>
    <g fill="#0891b2" fill-opacity="0.9" stroke="#0891b2">
      <circle cx="492" cy="94" r="12"/><circle cx="472" cy="154" r="12"/>
      <circle cx="556" cy="156" r="12"/><circle cx="556" cy="206" r="12"/>
    </g>
    <g fill="#dc2626" fill-opacity="0.08" stroke="#dc2626">
      <circle cx="624" cy="100" r="12"/><circle cx="624" cy="174" r="12"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="510" y="98">A</text><text x="490" y="158">B</text><text x="574" y="160">C</text>
      <text x="574" y="210">D</text><text x="642" y="104" fill="#dc2626">E</text><text x="642" y="178" fill="#dc2626">F</text>
    </g>
    <text x="624" y="210" text-anchor="middle" font-size="11" fill="#dc2626">мусор:</text>
    <text x="624" y="224" text-anchor="middle" font-size="11" fill="#dc2626">освободит sweep</text>
  </g>

  <!-- легенда -->
  <line x1="12" y1="244" x2="668" y2="244" stroke="currentColor" stroke-opacity="0.2"/>
  <circle cx="24" cy="268" r="8" fill="none" stroke="currentColor"/>
  <text x="38" y="266" font-weight="600" font-size="12">белый</text>
  <text x="38" y="282" font-size="11" opacity="0.7">ещё не достигнут</text>
  <circle cx="200" cy="268" r="8" fill="#0891b2" fill-opacity="0.3" stroke="#0891b2"/>
  <text x="214" y="266" font-weight="600" font-size="12">серый</text>
  <text x="214" y="282" font-size="11" opacity="0.7">достигнут, ссылки не просмотрены</text>
  <circle cx="452" cy="268" r="8" fill="#0891b2" fill-opacity="0.9" stroke="#0891b2"/>
  <text x="466" y="266" font-weight="600" font-size="12">чёрный</text>
  <text x="466" y="282" font-size="11" opacity="0.7">просканирован полностью</text>
</svg>
