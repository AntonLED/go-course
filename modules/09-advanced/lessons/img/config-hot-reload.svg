<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 292" role="img" aria-label="По SIGHUP конфиг загружается и валидируется; при ошибке остаётся старый, при успехе atomic.Pointer переключается на новый Config целиком. Запрос, взявший v1 до Store, дорабатывает на v1; новые запросы получают v2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Hot reload через atomic.Pointer</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- поток перезагрузки -->
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="12" y="16" width="100" height="36" rx="4"/>
    <rect x="136" y="16" width="176" height="36" rx="4"/>
    <rect x="336" y="16" width="112" height="36" rx="4"/>
  </g>
  <rect x="512" y="16" width="156" height="36" rx="4" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="300" y="88" width="184" height="36" rx="4" fill="#dc2626" fill-opacity="0.1" stroke="#dc2626" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="62" y="39">SIGHUP</text>
    <text x="224" y="39">Load(...) + Validate</text>
    <text x="392" y="39">err?</text>
    <text x="590" y="39">v.Store(&amp;cfg)</text>
  </g>
  <text x="392" y="111" text-anchor="middle" font-size="12" fill="#dc2626">log.Error, старый остаётся</text>
  <g stroke="currentColor" stroke-width="1.3">
    <line x1="112" y1="34" x2="132" y2="34" marker-end="url(#arr)"/>
    <line x1="312" y1="34" x2="332" y2="34" marker-end="url(#arr)"/>
  </g>
  <line x1="448" y1="34" x2="508" y2="34" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arr-ok)"/>
  <text x="478" y="28" text-anchor="middle" font-size="11" fill="#16a34a">nil</text>
  <line x1="392" y1="52" x2="392" y2="84" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-bad)"/>
  <text x="400" y="72" font-size="11" fill="#dc2626">≠ nil</text>

  <!-- Holder -->
  <path d="M590,52 L590,168 L444,168" fill="none" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arr-ok)"/>
  <text x="582" y="140" text-anchor="end" font-size="11" fill="#16a34a">атомарная замена</text>
  <text x="582" y="154" text-anchor="end" font-size="11" fill="#16a34a">указателя целиком</text>
  <rect x="240" y="152" width="200" height="32" rx="4" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <text x="340" y="173" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">atomic.Pointer[Config]</text>
  <text x="232" y="173" text-anchor="end" font-size="11" opacity="0.6">holder.v</text>

  <!-- версии конфига -->
  <line x1="300" y1="184" x2="236" y2="236" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 3" opacity="0.5" marker-end="url(#arr)"/>
  <text x="252" y="206" text-anchor="end" font-size="11" opacity="0.6">было</text>
  <line x1="380" y1="184" x2="444" y2="236" stroke="#0891b2" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="428" y="206" font-size="11" fill="#0891b2">стало</text>
  <rect x="148" y="240" width="128" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <rect x="404" y="240" width="128" height="40" rx="4" fill="none" stroke="#0891b2" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="212" y="264" opacity="0.7">Config v1</text>
    <text x="468" y="264">Config v2</text>
  </g>

  <!-- читатели -->
  <g font-size="11">
    <text x="12" y="248">запрос A</text>
    <text x="12" y="262" opacity="0.6">Load() до Store —</text>
    <text x="12" y="276" opacity="0.6">дорабатывает на v1</text>
    <text x="548" y="248">запрос B</text>
    <text x="548" y="262" opacity="0.6">Load() после Store</text>
    <text x="548" y="276" opacity="0.6">видит v2</text>
  </g>
  <line x1="120" y1="244" x2="144" y2="252" stroke="currentColor" stroke-width="1.2" opacity="0.6" marker-end="url(#arr)"/>
  <line x1="544" y1="244" x2="536" y2="252" stroke="currentColor" stroke-width="1.2" opacity="0.6" marker-end="url(#arr)"/>
</svg>
