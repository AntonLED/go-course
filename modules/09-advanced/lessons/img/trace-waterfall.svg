<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="Водопад одной трассы: GET /checkout в api-gateway 120 мс, внутри клиентский вызов orders, серверный спан Service.Create, в нём INSERT в базу и вызов payments, где спан Charge и обращение к банку" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Трасса запроса через три сервиса</title>
  <text x="12" y="18" font-size="11" opacity="0.6">спан (отступ = родитель)</text>
  <text x="236" y="18" font-size="11" opacity="0.6">время запроса, мс</text>
  <line x1="236.0" y1="26" x2="236.0" y2="224" stroke="currentColor" stroke-opacity="0.12"/>
  <text x="236.0" y="240" text-anchor="middle" font-size="10" opacity="0.6">0</text>
  <line x1="306.7" y1="26" x2="306.7" y2="224" stroke="currentColor" stroke-opacity="0.12"/>
  <text x="306.7" y="240" text-anchor="middle" font-size="10" opacity="0.6">20</text>
  <line x1="377.3" y1="26" x2="377.3" y2="224" stroke="currentColor" stroke-opacity="0.12"/>
  <text x="377.3" y="240" text-anchor="middle" font-size="10" opacity="0.6">40</text>
  <line x1="448.0" y1="26" x2="448.0" y2="224" stroke="currentColor" stroke-opacity="0.12"/>
  <text x="448.0" y="240" text-anchor="middle" font-size="10" opacity="0.6">60</text>
  <line x1="518.7" y1="26" x2="518.7" y2="224" stroke="currentColor" stroke-opacity="0.12"/>
  <text x="518.7" y="240" text-anchor="middle" font-size="10" opacity="0.6">80</text>
  <line x1="589.3" y1="26" x2="589.3" y2="224" stroke="currentColor" stroke-opacity="0.12"/>
  <text x="589.3" y="240" text-anchor="middle" font-size="10" opacity="0.6">100</text>
  <line x1="660.0" y1="26" x2="660.0" y2="224" stroke="currentColor" stroke-opacity="0.12"/>
  <text x="660.0" y="240" text-anchor="middle" font-size="10" opacity="0.6">120</text>
  <text x="12" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">GET /checkout</text>
  <rect x="236.0" y="32" width="424.0" height="18" rx="3" fill="#0891b2" fill-opacity="0.35" stroke="#0891b2"/>
  <text x="654.0" y="45" text-anchor="end" font-size="10">120 мс</text>
  <text x="24" y="73" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">POST orders</text>
  <rect x="257.2" y="60" width="381.6" height="18" rx="3" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2"/>
  <text x="644.8" y="73" font-size="10" opacity="0.7">108 мс</text>
  <text x="36" y="101" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Service.Create</text>
  <rect x="267.8" y="88" width="360.4" height="18" rx="3" fill="#7c3aed" fill-opacity="0.35" stroke="#7c3aed"/>
  <text x="634.2" y="101" font-size="10" opacity="0.7">102 мс</text>
  <text x="48" y="129" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">INSERT orders</text>
  <rect x="285.5" y="116" width="84.8" height="18" rx="3" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed"/>
  <text x="376.3" y="129" font-size="10" opacity="0.7">24 мс</text>
  <text x="48" y="157" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">POST /charge</text>
  <rect x="384.4" y="144" width="226.1" height="18" rx="3" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed"/>
  <text x="616.5" y="157" font-size="10" opacity="0.7">64 мс</text>
  <text x="60" y="185" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Charge</text>
  <rect x="395.0" y="172" width="204.9" height="18" rx="3" fill="#d97706" fill-opacity="0.35" stroke="#d97706"/>
  <text x="605.9" y="185" font-size="10" opacity="0.7">58 мс</text>
  <text x="72" y="213" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">bank API</text>
  <rect x="412.7" y="200" width="162.5" height="18" rx="3" fill="#d97706" fill-opacity="0.15" stroke="#d97706"/>
  <text x="581.2" y="213" font-size="10" opacity="0.7">46 мс</text>
  <rect x="12" y="262" width="14" height="12" rx="2" fill="#0891b2" fill-opacity="0.35" stroke="#0891b2"/>
  <text x="32" y="272" font-size="11">api-gateway</text>
  <rect x="122" y="262" width="14" height="12" rx="2" fill="#7c3aed" fill-opacity="0.35" stroke="#7c3aed"/>
  <text x="142" y="272" font-size="11">orders</text>
  <rect x="232" y="262" width="14" height="12" rx="2" fill="#d97706" fill-opacity="0.35" stroke="#d97706"/>
  <text x="252" y="272" font-size="11">payments</text>
  <text x="352" y="272" font-size="11" opacity="0.7">плотная заливка — server-спан, светлая — client/db</text>
  <text x="12" y="292" font-size="11" opacity="0.7">у всех спанов один trace_id; у каждого свой span_id и parent_span_id родителя</text>
</svg>
