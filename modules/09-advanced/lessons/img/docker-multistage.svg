<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 252" role="img" aria-label="Стадия build на golang:1.23.4-alpine содержит тулчейн, кэш модулей, исходники и собранный /out/app, всего сотни мегабайт; в финальный образ distroless/static-debian12:nonroot копируется только бинарь через COPY --from=build" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Multi-stage build: в образ едет только бинарь</title>
  <defs>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- build -->
  <rect x="12" y="12" width="280" height="196" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.5" stroke-dasharray="6 4"/>
  <text x="24" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">FROM golang:1.23.4-alpine AS build</text>
  <g fill="none" stroke="currentColor" stroke-opacity="0.5">
    <rect x="24" y="48" width="256" height="28" rx="3"/>
    <rect x="24" y="82" width="256" height="28" rx="3"/>
    <rect x="24" y="116" width="256" height="28" rx="3"/>
  </g>
  <g font-size="11">
    <text x="34" y="66">Go-тулчейн, apk, busybox</text>
    <text x="34" y="100"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/go/pkg/mod</tspan>, кэш сборки</text>
    <text x="34" y="134"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/src</tspan> — исходники (COPY . .)</text>
  </g>
  <rect x="24" y="152" width="256" height="28" rx="3" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.2"/>
  <text x="34" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">/out/app</text>
  <text x="270" y="170" text-anchor="end" font-size="11" opacity="0.7">go build, CGO_ENABLED=0</text>
  <text x="152" y="200" text-anchor="middle" font-size="11" opacity="0.6">~300+ МБ — в итоговый образ не попадает</text>

  <!-- final -->
  <rect x="388" y="12" width="280" height="196" rx="8" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/>
  <text x="400" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600">FROM distroless/static-debian12:nonroot</text>
  <g fill="none" stroke="currentColor" stroke-opacity="0.5">
    <rect x="400" y="48" width="256" height="28" rx="3"/>
    <rect x="400" y="82" width="256" height="28" rx="3"/>
  </g>
  <g font-size="11">
    <text x="410" y="66">CA-сертификаты, tzdata</text>
    <text x="410" y="100"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/etc/passwd</tspan>: nonroot (65532), без shell</text>
  </g>
  <rect x="400" y="152" width="256" height="28" rx="3" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.2"/>
  <text x="410" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">/app</text>
  <text x="646" y="170" text-anchor="end" font-size="11" opacity="0.7">ENTRYPOINT ["/app"]</text>
  <text x="528" y="134" text-anchor="middle" font-size="11" opacity="0.6">~2 МБ базового образа</text>
  <text x="528" y="200" text-anchor="middle" font-size="11" fill="#16a34a">итог: ~2 МБ + бинарь (5–15 МБ)</text>

  <!-- копирование бинаря -->
  <line x1="280" y1="166" x2="396" y2="166" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <text x="340" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0891b2">COPY --from=build /out/app /app</text>
  <path d="M340,166 L340,220" stroke="#0891b2" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
</svg>
