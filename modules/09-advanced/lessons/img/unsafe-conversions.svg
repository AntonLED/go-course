<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 232" role="img" aria-label="*T1 превращается в unsafe.Pointer и затем в *T2 (шаблон 1). unsafe.Pointer можно превратить в uintptr (шаблон 2), это просто число, которое GC не видит. Обратно в unsafe.Pointer — только в том же выражении (шаблоны 3–5); сохранённый в переменной uintptr превращать в указатель нельзя. unsafe.Add делает арифметику без uintptr" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Допустимые преобразования unsafe.Pointer</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d97706"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- узлы -->
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="12" y="36" width="112" height="32" rx="4"/>
    <rect x="12" y="148" width="112" height="32" rx="4"/>
  </g>
  <rect x="236" y="92" width="176" height="32" rx="4" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.2"/>
  <rect x="540" y="92" width="128" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 3"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle" font-weight="600">
    <text x="68" y="57">*T1</text><text x="68" y="169">*T2</text>
    <text x="324" y="113">unsafe.Pointer</text><text x="604" y="113">uintptr</text>
  </g>
  <g font-size="11" opacity="0.6" text-anchor="middle">
    <text x="324" y="140">GC видит как указатель</text>
    <text x="604" y="140">просто число:</text>
    <text x="604" y="154">GC его не видит</text>
  </g>

  <!-- (1) -->
  <line x1="124" y1="58" x2="232" y2="100" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="236" y1="118" x2="128" y2="158" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="12" y="104" font-size="11"><tspan font-weight="600">(1)</tspan> если T2 не больше T1</text>
  <text x="12" y="120" font-size="11" opacity="0.6">и раскладки совместимы</text>

  <!-- unsafe.Add петля -->
  <path d="M296,92 C296,48 352,48 352,88" fill="none" stroke="#0891b2" stroke-width="1.3" marker-end="url(#arr-acc)"/>
  <text x="324" y="40" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0891b2">unsafe.Add(p, off)</text>

  <!-- (2) -->
  <line x1="412" y1="100" x2="536" y2="100" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arr-ok)"/>
  <text x="474" y="92" text-anchor="middle" font-size="11" fill="#16a34a"><tspan font-weight="600">(2)</tspan> печать, сравнение</text>

  <!-- (3)-(5) -->
  <line x1="540" y1="118" x2="416" y2="118" stroke="#d97706" stroke-width="1.3" marker-end="url(#arr-warn)"/>
  <text x="478" y="178" text-anchor="middle" font-size="11" fill="#d97706"><tspan font-weight="600">(3)–(5)</tspan> обратно — только в том же</text>
  <text x="478" y="192" text-anchor="middle" font-size="11" fill="#d97706">выражении: Pointer(uintptr(p) + off)</text>
  <line x1="478" y1="164" x2="478" y2="124" stroke="#d97706" stroke-opacity="0.5" stroke-dasharray="2 2"/>

  <!-- ошибка -->
  <text x="12" y="222" font-size="11" fill="#dc2626">✕ <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">u := uintptr(p); …; unsafe.Pointer(u + 8)</tspan> — между строками объект мог быть собран или стек переехал</text>
</svg>
