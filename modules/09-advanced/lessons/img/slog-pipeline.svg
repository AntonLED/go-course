<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img" aria-label="Logger.With вызывает Handler.WithAttrs, Logger.WithGroup — Handler.WithGroup; каждый раз получается новый Handler. Вызов Info сначала спрашивает Enabled; если false — выход без построения Record, иначе строится Record и вызывается Handle, который пишет JSON с request_id и группой http" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>slog: Logger → Handler</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/>
    </marker>
    <marker id="arr-vio" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <g font-size="11" opacity="0.6">
    <text x="12" y="16">Logger — фронтенд</text>
    <text x="72" y="104">Handler — бэкенд</text>
  </g>

  <!-- Logger ряд -->
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="12" y="24" width="96" height="32" rx="4"/>
    <rect x="290" y="24" width="96" height="32" rx="4"/>
    <rect x="572" y="24" width="96" height="32" rx="4"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="60" y="45">log</text><text x="338" y="45">reqLog</text><text x="620" y="45">logger</text>
  </g>
  <line x1="108" y1="40" x2="286" y2="40" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="199" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">.With("request_id", id)</text>
  <line x1="386" y1="40" x2="568" y2="40" stroke="currentColor" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="479" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">.WithGroup("http")</text>

  <!-- связь Logger → Handler -->
  <g stroke="currentColor" stroke-width="1.1" stroke-dasharray="3 3" opacity="0.6">
    <line x1="60" y1="56" x2="60" y2="108"/><line x1="338" y1="56" x2="338" y2="108"/><line x1="620" y1="56" x2="620" y2="108"/>
  </g>

  <!-- Handler ряд -->
  <rect x="12" y="112" width="96" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <rect x="290" y="112" width="96" height="32" rx="4" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.2"/>
  <rect x="572" y="112" width="96" height="32" rx="4" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">
    <text x="60" y="132">JSONHandler</text><text x="338" y="132">+ request_id</text><text x="620" y="132">+ группа http</text>
  </g>
  <line x1="108" y1="128" x2="286" y2="128" stroke="#0891b2" stroke-width="1.3" marker-end="url(#arr-acc)"/>
  <text x="199" y="122" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0891b2">WithAttrs</text>
  <text x="199" y="158" text-anchor="middle" font-size="10" opacity="0.6">новый Handler</text>
  <line x1="386" y1="128" x2="568" y2="128" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arr-vio)"/>
  <text x="479" y="122" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7c3aed">WithGroup</text>
  <text x="479" y="158" text-anchor="middle" font-size="10" opacity="0.6">новый Handler</text>

  <!-- вызов -->
  <line x1="12" y1="172" x2="668" y2="172" stroke="currentColor" stroke-opacity="0.2"/>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="12" y="186" width="136" height="32" rx="4"/>
    <rect x="336" y="186" width="104" height="32" rx="4"/>
  </g>
  <rect x="168" y="186" width="144" height="32" rx="4" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <rect x="464" y="186" width="204" height="32" rx="4" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">
    <text x="80" y="206">.Info("done", …)</text>
    <text x="240" y="206">Enabled(ctx, INFO)</text>
    <text x="388" y="206">slog.Record</text>
    <text x="566" y="206">Handle(ctx, r) → Writer</text>
  </g>
  <g stroke="currentColor" stroke-width="1.3">
    <line x1="148" y1="202" x2="164" y2="202" marker-end="url(#arr)"/>
    <line x1="308" y1="202" x2="332" y2="202" marker-end="url(#arr)"/>
    <line x1="440" y1="202" x2="460" y2="202" marker-end="url(#arr)"/>
  </g>
  <text x="322" y="196" text-anchor="middle" font-size="10" fill="#16a34a">true</text>
  <text x="240" y="234" text-anchor="middle" font-size="11" fill="#d97706">false → выход, Record не строится</text>
  <line x1="620" y1="144" x2="620" y2="182" stroke="currentColor" stroke-width="1.1" stroke-dasharray="3 3" opacity="0.6" marker-end="url(#arr)"/>

  <!-- вывод -->
  <text x="12" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">{"time":"…","level":"INFO","msg":"done",<tspan fill="#0891b2">"request_id":"r-42"</tspan>,<tspan fill="#7c3aed">"http":{"status":200}</tspan>}</text>
  <text x="12" y="286" font-size="10" opacity="0.6">time, level, msg — из Record; request_id — заранее от WithAttrs; status попал в группу http</text>
</svg>
