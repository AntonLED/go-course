<svg xmlns="http://www.w3.org/2000/svg" viewBox="-9 0 689 276" role="img" aria-label="Четыре слоя конфигурации от слабого к сильному: defaults, файл, env, флаги. Для каждого ключа побеждает самый сильный слой, где ключ задан: addr из env, log_level из файла, db_dsn из env, timeout из флага" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="currentColor">
  <title>Слои конфигурации: кто победил для каждого ключа</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- заголовки ключей -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">
    <text x="221" y="24">addr</text><text x="326" y="24">log_level</text><text x="471" y="24">db_dsn</text><text x="611" y="24">timeout</text>
  </g>

  <!-- сила -->
  <line x1="18" y1="186" x2="18" y2="44" stroke="currentColor" stroke-width="1.3" opacity="0.6" marker-end="url(#arr)"/>
  <text x="18" y="200" text-anchor="middle" font-size="11" opacity="0.6">слабее</text>
  <text x="18" y="36" text-anchor="middle" font-size="11" opacity="0.6">сильнее</text>

  <!-- подписи слоёв -->
  <g font-size="12">
    <text x="36" y="55">флаги</text><text x="36" y="95">env</text><text x="36" y="135">файл</text><text x="36" y="175">defaults</text>
  </g>
  <g font-size="11" opacity="0.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="36" y="108">APP_*</text><text x="36" y="148">config.yaml</text><text x="36" y="188">Defaults()</text></g><g font-size="11" opacity="0.6"><text x="36" y="68">только явные</text>
  </g>

  <!-- пустые клетки -->
  <g font-size="12" text-anchor="middle" opacity="0.3">
    <text x="221" y="61">—</text><text x="326" y="61">—</text><text x="471" y="61">—</text>
    <text x="326" y="101">—</text><text x="611" y="101">—</text>
    <text x="221" y="141">—</text><text x="611" y="141">—</text>
    <text x="471" y="181">—</text>
  </g>

  <!-- перекрытые значения -->
  <g fill="none" stroke="currentColor" stroke-opacity="0.35">
    <rect x="276" y="162" width="100" height="28" rx="4"/>
    <rect x="176" y="162" width="90" height="28" rx="4"/>
    <rect x="566" y="162" width="90" height="28" rx="4"/>
    <rect x="386" y="122" width="170" height="28" rx="4"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle" opacity="0.45">
    <text x="221" y="180">:8080</text><text x="326" y="180">info</text><text x="611" y="180">30s</text>
    <text x="471" y="140">postgres://dev/app</text>
  </g>
  <g stroke="currentColor" stroke-opacity="0.45">
    <line x1="202" y1="176" x2="240" y2="176"/><line x1="310" y1="176" x2="342" y2="176"/>
    <line x1="598" y1="176" x2="624" y2="176"/><line x1="410" y1="136" x2="532" y2="136"/>
  </g>

  <!-- победители -->
  <g fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.2">
    <rect x="566" y="42" width="90" height="28" rx="4"/>
    <rect x="176" y="82" width="90" height="28" rx="4"/>
    <rect x="386" y="82" width="170" height="28" rx="4"/>
    <rect x="276" y="122" width="100" height="28" rx="4"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">
    <text x="611" y="60">5s</text>
    <text x="221" y="100">:9000</text>
    <text x="471" y="100">postgres://prod/app</text>
    <text x="326" y="140">warn</text>
  </g>

  <!-- итог -->
  <line x1="36" y1="206" x2="660" y2="206" stroke="currentColor" stroke-width="1.2"/>
  <text x="36" y="232" font-weight="600">итог cfg</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle" font-weight="600">
    <text x="221" y="232">:9000</text><text x="326" y="232">warn</text><text x="471" y="232">postgres://prod/app</text><text x="611" y="232">5s</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#0891b2">
    <text x="221" y="250">из env</text><text x="326" y="250">из файла</text><text x="471" y="250">из env</text><text x="611" y="250">из флага</text>
  </g>
  <text x="36" y="270" font-size="11" opacity="0.6">флаг --addr не задан → не перетирает :9000 из env (Visit)</text>
</svg>
