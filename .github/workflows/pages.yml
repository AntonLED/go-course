# Публикация книги на GitHub Pages и проверка курса.
# Срабатывает на каждый push в main. В настройках репозитория: Settings → Pages → Source: GitHub Actions.
name: Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Эталоны проходят тесты (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # минимальная поддерживаемая версия курса и актуальная
        go: ["1.23", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./... && go vet -tags solution ./...
      - run: go test -race -count=1 -tags solution ./...

  build:
    name: Сборка книги
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: book/package-lock.json
      - name: Установка зависимостей
        working-directory: book
        run: npm ci
      - name: Сборка
        working-directory: book
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          # Репозиторий <user>.github.io публикуется в корень домена, остальные — в /<repo>/.
          if [[ "$REPO" == *.github.io ]]; then export BASE_PATH=/; else export BASE_PATH="/$REPO/"; fi
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/.vitepress/dist

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
